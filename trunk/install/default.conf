server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    index       index.php;
    root         /home/judge/src/web;

    location / {

    }

    # 静态上传目录整体强缓存：目录内均为一次性写入的静态资源（上传同名文件时服务端
    # 自动改名保证 URL 唯一，课件封面另有 ?v= 版本参数），可放心长期缓存。
    # ^~ 使请求不再检查 server 级正则 location（含 .php$ 的 fastcgi 入口），天然不落
    # PHP-FPM；嵌套 403 为纵深防御，防日后误删 ^~ 或改动 location 结构时防线失效
    location ^~ /upload/ {
        expires 30d;
        access_log off;
        location ~* \.(php|phtml)$ {
            return 403;
        }
    }

    # 离线游戏包目录：仅供积分兑换流程内部使用（许可证由 PHP 调 Python 生成、
    # 安装包走外链下载），无任何合法 HTTP 直访场景，整体 404 防直链白嫖与源码/工具泄露。
    # ^~ 阻止该目录下任何请求（含混入的 .php）进入后续正则 location
    location ^~ /offline-games/ {
        return 404;
    }

    location ~ \.php$ {
        fastcgi_index               index.php;
        fastcgi_pass                127.0.0.1:9000;
        fastcgi_param               SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_split_path_info     ^(.+\.php)(/.+)$;
        client_max_body_size        80m;
        include                     fastcgi_params;
    }

    error_page 404 /404.html;
        location = /40x.html {
    }

    error_page 500 502 503 504 /50x.html;
        location = /50x.html {
    }
}