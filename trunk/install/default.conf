server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    index       index.php;
    root         /home/judge/src/web;

    location / {

    }

    # 课件封面：版本化静态资源（img URL 带 ?v=文件修改时间），可长期强缓存；
    # 封面更新后 v 自动变化，URL 改变即拉取新图。^~ 同时禁止该目录执行 PHP
    location ^~ /upload/course_cover/ {
        expires 30d;
        access_log off;
    }

    # 离线游戏包目录：仅供积分兑换流程内部使用（许可证由 PHP 调 Python 生成、
    # 安装包走外链下载），无任何合法 HTTP 直访场景，整体 404 防直链白嫖与源码/工具泄露。
    # ^~ 阻止该目录下任何请求（含混入的 .php）进入后续正则 location
    location ^~ /offline-games/ {
        return 404;
    }

    location ~ \.php$ {
        fastcgi_index               index.php;
        fastcgi_pass                127.0.0.1:9000;
        fastcgi_param               SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_split_path_info     ^(.+\.php)(/.+)$;
        client_max_body_size        80m;
        include                     fastcgi_params;
    }

    error_page 404 /404.html;
        location = /40x.html {
    }

    error_page 500 502 503 504 /50x.html;
        location = /50x.html {
    }
}