<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>气球打字</title>
    <script src="../js/confetti.min.js"></script>
    <script src="../js/game_confetti.js"></script>
    <style>
    .offline-back-btn {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 9999;
        background: rgba(255,255,255,0.9);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0,0,0,0.1);
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 14px;
        color: #333;
        text-decoration: none;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        transition: all 0.2s;
    }
    .offline-back-btn:hover {
        background: #667eea;
        color: #fff;
        transform: translateY(-2px);
    }
    #auth-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0,0,0,0.8);
        color: white;
        text-align: center;
        padding: 8px;
        font-size: 12px;
        z-index: 9999;
    }
    </style>
</head>
<body>
    <a href="../index.html" class="offline-back-btn">← 返回游戏大厅</a>
    <div id="auth-footer"></div>
    <!-- 未授权提示遮罩 -->
    <div id="no-auth-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:10000; align-items:center; justify-content:center;">
        <div style="background:white; border-radius:20px; padding:40px; max-width:400px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.3);">
            <div style="font-size:50px; margin-bottom:15px;">🔐</div>
            <h2 style="color:#333; margin-bottom:15px;">需要激活授权</h2>
            <p style="color:#666; margin-bottom:20px; line-height:1.6;">检测到未授权或授权文件无效。<br>请先激活后再使用游戏。</p>
            <a href="activate.html" style="display:inline-block; background:linear-gradient(135deg, #667eea, #764ba2); color:white; text-decoration:none; padding:12px 25px; border-radius:10px; font-weight:600;">前往激活</a>
            <p style="margin-top:15px; font-size:0.8rem; color:#888;">推荐：在本页同目录的 activate.html 验证授权码后下载 license.js，放入离线包 js 文件夹，即可直接使用</p>
        </div>
    </div>
    <script src="../js/jquery.min.js"></script>
    <script src="../js/license.js"></script>
    <script src="../js/rsa_verify.js"></script>
    <script src="../js/auth.js"></script>
    <script>
    $(document).ready(function() {
        Auth.checkAuth().then(function(result) {
            if (!result.valid) {
                // 显示未授权提示遮罩
                $('#no-auth-overlay').css('display', 'flex');
                // 隐藏游戏内容
                $('body > *:not(#no-auth-overlay):not(.offline-back-btn):not(#auth-footer)').hide();
                return;
            }
            if (result.license) {
                Auth.displayAuthInfo(result.license);
            }
        });
    });
    </script>

<div class="padding">
<style>
        /* ===== 统一游戏基础样式（清新天空蓝） ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 覆盖 syzoj 模板 .padding 的白玻璃效果（white.css 会给内容区垫 rgba(255,255,255,0.55) 半透明白底），
           否则暗色霓虹主题的文字（白色按钮文字等）会落在白底上看不见 */
        .padding {
            background: transparent !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            overflow: visible !important;
            padding: 0 !important;
            color: inherit !important;
            transition: none !important;
        }
        .padding::before,
        .padding::after {
            display: none !important;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            /* 双层背景：点纹层固定 + 天蓝→淡紫→粉渐变层流动（规范第二节：点纹 + 暖渐变底） */
            background:
                radial-gradient(circle at 1px 1px, rgba(2, 132, 199, 0.09) 1px, transparent 0) 0 0 / 22px 22px,
                linear-gradient(135deg, #e0f2fe 0%, #bae6fd 40%, #ede9fe 70%, #fce7f3 100%);
            background-size: 22px 22px, 400% 400%;
            animation: bgShift 20s ease infinite;
        }

        @keyframes bgShift {
            0%   { background-position: 0 0, 0% 50%; }
            50%  { background-position: 0 0, 100% 50%; }
            100% { background-position: 0 0, 0% 50%; }
        }

        /* 背景漂浮光斑 */
        .particle {
            position: fixed;
            border-radius: 50%;
            filter: blur(1px);
            pointer-events: none;
            z-index: 0;
        }
        .particle-1 {
            width: 320px;
            height: 320px;
            left: -120px;
            top: 18%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.22), transparent 70%);
            animation: drift 12s ease-in-out infinite;
        }
        .particle-2 {
            width: 380px;
            height: 380px;
            right: -140px;
            bottom: 8%;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.16), transparent 70%);   /* 粉色光斑，呼应对比色 */
            animation: drift 16s ease-in-out infinite reverse;
        }
        @keyframes drift {
            0%, 100% { transform: translateY(0) scale(1); }
            50%      { transform: translateY(-34px) scale(1.12); }
        }

        /* 全屏自适应：容器纵向排布，标题在顶部 + 下方左右两栏 */
        .game-container {
            max-width: 1100px;
            width: 100%;
            min-height: calc(100vh - 60px - 2rem);
            margin: 1rem auto;
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            padding: 1.5rem 1.75rem;
            box-shadow: 0 8px 32px rgba(2, 132, 199, 0.12), 0 20px 60px rgba(59, 130, 246, 0.15);
            text-align: center;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;    /* 让顶部彩虹条贴住圆角（不影响 fixed 弹窗） */
        }

        /* 容器顶部彩虹条（规范第三节） */
        .game-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #38bdf8, #0284c7, #ec4899, #f59e0b, #38bdf8);
            background-size: 300% 100%;
            animation: bt-gradient-shift 6s linear infinite;
        }
        @keyframes bt-gradient-shift {
            0%   { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* 左右两栏布局 */
        .main-row {
            flex: 1;
            display: flex;
            gap: 1.5rem;
            align-items: stretch;
            margin-top: 0.5rem;
            min-height: 0;
        }
        /* 左侧：难度/统计/输入/反馈/按钮 操作面板 */
        .panel-left {
            flex: 0 0 360px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.9rem;
            min-width: 0;
        }
        /* 右侧：气球游戏区卡片 */
        .panel-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        /* 左栏内用 flex gap 控制间距，去掉各组件自带的 margin-bottom */
        .panel-left .difficulty-selector,
        .panel-left .stats,
        .panel-left #input-area {
            margin-bottom: 0;
        }

        /* 系统自带可爱字体回退链（中文+英文+emoji，零外部依赖）
         *  优先级：Windows 华文琥珀 / 幼圆 → macOS 圆体-简/Hiragino丸 → 英文 Chalkboard/Comic Sans → 通用 PingFang/微软雅黑
         */
        :root {
            --font-cute:
                "STHupo", "华文琥珀",
                "STXingkai", "华文行楷",
                "YouYuan", "幼圆",
                "Yuanti SC", "圆体-简",
                "Hiragino Maru Gothic ProN", "HiraMaruProN-W4",
                "Chalkboard SE", "ChalkboardSE-Bold",
                "Comic Sans MS", "Comic Sans",
                "Marker Felt",
                "PingFang SC", "Microsoft YaHei",
                -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 游戏标题：天蓝→粉渐变文字（规范第四节：双 !important 防 MDC 全局样式覆盖变黑） */
        h1.game-title {
            font-family: var(--font-cute);
            font-size: clamp(1.8rem, 4.5vw, 2.3rem);
            font-weight: 700;               /* 降一级，琥珀/幼圆本就粗壮，800 会糊 */
            letter-spacing: 0.04em;
            line-height: 1.3;
            margin-bottom: 0.35rem;
            background: linear-gradient(135deg, #0284c7 0%, #38bdf8 45%, #ec4899 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            filter: drop-shadow(0 3px 10px rgba(2, 132, 199, 0.28));
        }
        /* 标题下装饰线 */
        h1.game-title::after {
            content: "";
            display: block;
            width: 56px;
            height: 4px;
            margin: 6px auto 0;
            border-radius: 2px;
            background: linear-gradient(90deg, #38bdf8, #ec4899);
        }
        /* 标题内 emoji 保持原生彩色，不被渐变剥离 */
        h1.game-title .title-keep {
            background: none !important;
            -webkit-background-clip: border-box !important;
            background-clip: border-box !important;
            -webkit-text-fill-color: initial !important;
            color: initial !important;
        }

        .game-subtitle {
            font-family: var(--font-cute);
            font-size: 1.02rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: #a855f7;                 /* 薰衣草紫，和粉色主色形成可爱对比 */
            margin-bottom: 0.85rem;
            text-shadow:
                0 1px 0   rgba(255, 255, 255, 0.9),
                0 2px 6px rgba(168, 85, 247, 0.18);
        }

        .difficulty-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .diff-btn {
            padding: 9px 20px;
            border: 2px solid #cbd5e1;
            border-radius: 999px;
            background: #ffffff;
            color: #334155;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.08);
        }
        .diff-btn:hover {
            border-color: #38bdf8;
            color: #0284c7;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.35);
            transform: translateY(-1px);
        }
        .diff-btn.active {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.45);
        }
        /* 困难档：橙红对比色区分（规范第六节） */
        .diff-btn[data-mode="hard"] {
            border-color: #fdba74;
            color: #c2410c;
        }
        .diff-btn[data-mode="hard"]:hover {
            border-color: #f97316;
            color: #ea580c;
            box-shadow: 0 0 14px rgba(249, 115, 22, 0.35);
        }
        .diff-btn[data-mode="hard"].active {
            background: linear-gradient(135deg, #fb923c, #ea580c);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 20px rgba(249, 115, 22, 0.45);
        }

        /* 统计栏：grid 三等分 + 顶部彩色边（规范第五节） */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(6px, 1.5vw, 10px);
            margin-bottom: 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        .stat-item {
            background: linear-gradient(135deg, #ffffff, #f0f9ff);
            border: 1px solid #bae6fd;
            border-top: 3px solid #38bdf8;
            border-radius: clamp(12px, 2vw, 16px);
            padding: clamp(8px, 1.8vh, 12px) clamp(6px, 1.5vw, 12px);
            box-shadow: 0 4px 16px rgba(2, 132, 199, 0.08);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }
        /* 三张统计卡顶部彩色边：蓝 / 粉 / 琥珀 */
        .stat-item:nth-child(2) { border-top-color: #ec4899; }
        .stat-item:nth-child(3) { border-top-color: #f59e0b; }
        .stat-item .stat-label {
            font-size: 0.8rem;
            color: #64748b;
            display: block;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .stat-item .stat-value {
            font-weight: 700;
            font-size: 1.15rem;
            display: inline-block;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
        }
        /* 生命是 emoji 心，保持原生彩色不被渐变剥离 */
        .stat-value.hearts {
            background: none !important;
            -webkit-background-clip: border-box !important;
            background-clip: border-box !important;
            -webkit-text-fill-color: initial !important;
            color: initial !important;
        }
        /* 统计数字跳动（渐变字不靠 color，只做缩放） */
        .stat-value.bump { animation: popScore 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes popScore {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* 蓝天游戏区（右侧卡片，撑满右栏高度） */
        .game-area {
            width: 100%;
            flex: 1;
            min-height: 280px;
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            cursor: none;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.5), transparent 50%),
                linear-gradient(to bottom, #38bdf8 0%, #7dd3fc 55%, #bae6fd 100%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.35), 0 8px 30px rgba(2, 132, 199, 0.15);
        }

        /* 底部飘云 */
        .game-area::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(60px 30px at 15% 78%, rgba(255, 255, 255, 0.95), transparent 100%),
                radial-gradient(85px 36px at 32% 88%, rgba(255, 255, 255, 0.9), transparent 100%),
                radial-gradient(70px 30px at 55% 82%, rgba(255, 255, 255, 0.95), transparent 100%),
                radial-gradient(95px 42px at 78% 90%, rgba(255, 255, 255, 0.9), transparent 100%),
                radial-gradient(60px 28px at 92% 80%, rgba(255, 255, 255, 0.95), transparent 100%),
                radial-gradient(50px 24px at 40% 70%, rgba(255, 255, 255, 0.55), transparent 100%);
            animation: drift 14s ease-in-out infinite;
            opacity: 0.9;
        }

        /* 角落太阳 */
        .game-area::after {
            content: "☀️";
            position: absolute;
            top: 14px;
            right: 22px;
            font-size: 2.2rem;
            filter: drop-shadow(0 0 14px rgba(253, 224, 71, 0.8));
            pointer-events: none;
        }

        /* 自定义准星光标 */
        .reticle {
            position: absolute;
            width: 34px;
            height: 34px;
            border: 2px solid #0284c7;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 50;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
            transition: opacity 0.2s;
        }
        .reticle::before,
        .reticle::after {
            content: "";
            position: absolute;
            background: #0284c7;
        }
        .reticle::before {
            left: 50%;
            top: -7px;
            width: 2px;
            height: 48px;
            transform: translateX(-50%);
        }
        .reticle::after {
            top: 50%;
            left: -7px;
            height: 2px;
            width: 48px;
            transform: translateY(-50%);
        }

        /* ===== 游戏开始前的 3-2-1-GO 倒计时覆盖层 ===== */
        .countdown-overlay {
            position: absolute;
            inset: 0;                    /* 填满整个气球游戏区 */
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse at center, rgba(236, 72, 153, 0.22) 0%, rgba(168, 85, 247, 0.22) 55%, rgba(2, 132, 199, 0.55) 100%);
            backdrop-filter: blur(3px) saturate(1.15);
            -webkit-backdrop-filter: blur(3px) saturate(1.15);
            z-index: 900;               /* 覆盖在气球之上，低于全局模态 1000 */
            overflow: hidden;
            animation: overlayFadeIn 0.3s ease-out;
        }
        @keyframes overlayFadeIn {
            0%   { opacity: 0; }
            100% { opacity: 1; }
        }

        .countdown-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: clamp(160px, 34%, 240px);
            aspect-ratio: 1 / 1;          /* 正圆卡 */
            border-radius: 50%;
            /* 根因修复：不再纯白底，改成柔和浅粉→浅紫渐变，避免数字透不到色时"白字+白底"完全看不见 */
            background: linear-gradient(135deg, #fff0f7 0%, #fae8ff 50%, #ede9fe 100%);
            border: 4px solid #fff;
            box-shadow:
                0 0 0 10px rgba(236, 72, 153, 0.28),
                0 0 40px rgba(168, 85, 247, 0.45),
                0 20px 60px rgba(2, 132, 199, 0.35);
        }

        .countdown-num {
            font-family: var(--font-cute);
            font-size: clamp(5.5rem, 13vw, 9rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.02em;
            /* 根因修复：彻底去掉 background-clip:text + color:transparent ——
             * 这个技巧在华文琥珀/幼圆等彩色字体下，某些浏览器（尤其是带 emoji 字体 fallback 的）
             * 会直接把 glyph 当白字画 + color:transparent 透不出底色 → 最终显示"白字+白卡"看不见。
             * 改为：深紫实色 + 4px 粉色描边 + 双层 drop-shadow（粉光 + 深紫轮廓），三重保障对比。
             */
            color: #a855f7;                              /* 薰衣草紫实色字心 */
            -webkit-text-stroke: 3.5px #ec4899;          /* WebKit/Chrome/Edge：4px 粉色外描边（幼圆粗体字 3.5 刚好不糊） */
            text-stroke: 3.5px #ec4899;
            /* 再叠两层文字阴影做"厚描边+发光"，text-stroke 不支持的 Firefox 也靠这两层兜底 */
            text-shadow:
                -3px  0   0 #ec4899,
                 3px  0   0 #ec4899,
                 0   -3px 0 #ec4899,
                 0    3px 0 #ec4899,
                -2px -2px 0 #ec4899,
                 2px -2px 0 #ec4899,
                -2px  2px 0 #ec4899,
                 2px  2px 0 #ec4899,
                 0    2px 0 rgba(255, 255, 255, 0.95);   /* 下方 2px 白高光，卡通立体字 */
            filter:
                drop-shadow(0 6px 16px rgba(236, 72, 153, 0.55))   /* 粉色柔光 */
                drop-shadow(0 2px 4px  rgba(168, 85, 247, 0.6));   /* 深紫轮廓钩字 */
        }
        /* 重启动画的实际类：每次"倒计时换字"时由 JS remove/add，强制浏览器重新播放 keyframes。
         * 故意不写在原 .countdown-num 上，否则 CSS 中声明的 forwards 动画只能播放一次、没法在 3→2→1→GO 换字时重放 */
        .countdown-num_play {
            animation: countdownPop 0.9s cubic-bezier(0.22, 1.3, 0.36, 1) forwards;
        }
        @keyframes countdownPop {
            0%   { transform: scale(0.25); opacity: 0; }
            30%  { transform: scale(1.25); opacity: 1; }
            55%  { transform: scale(1.0);  opacity: 1; }
            100% { transform: scale(0.55); opacity: 0; }
        }

        /* 霓虹发光气球 */
        .balloon {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform, opacity;
            transform: translateY(100px); /* 初始位置：gameArea 底部下方 */
            z-index: 1;
        }

        .balloon-body {
            min-width: 60px;
            height: 70px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 400;
            font-size: 1.3rem;
            color: white;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
            position: relative;
            padding: 0 12px;
            background: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0) 45%), var(--balloon-color, #ff6ec4);
            box-shadow: 0 0 18px var(--balloon-glow, var(--balloon-color)), inset 0 -8px 14px rgba(0, 0, 0, 0.18);
            animation: balloonIn 0.25s ease-out;
        }

        /* 高光 */
        .balloon-body::before {
            content: "";
            position: absolute;
            top: 10%;
            left: 14%;
            width: 42%;
            height: 28%;
            border-radius: 50%;
            background: linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0));
            transform: rotate(-18deg);
            pointer-events: none;
        }

        /* 气球底部三角 */
        .balloon-body::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 10px solid var(--balloon-color);
            filter: drop-shadow(0 0 4px var(--balloon-glow));
        }

        .balloon-string {
            width: 2px;
            height: 30px;
            background: linear-gradient(to bottom, var(--balloon-color, #888), rgba(255, 255, 255, 0.15));
            box-shadow: 0 0 4px var(--balloon-glow, transparent);
            margin-top: 2px;
        }

        @keyframes balloonIn {
            0%   { transform: scale(0.4); opacity: 0; }
            60%  { transform: scale(1.12); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 气球霓虹配色（CSS 变量驱动发光）—— 避开蓝色，与天空背景形成对比 */
        .balloon-red    { --balloon-color: #f65a5a; --balloon-glow: rgba(246, 90, 90, 0.75); }
        .balloon-orange { --balloon-color: #fb923c; --balloon-glow: rgba(251, 146, 60, 0.75); }
        .balloon-green  { --balloon-color: #22c55e; --balloon-glow: rgba(34, 197, 94, 0.75); }
        .balloon-yellow { --balloon-color: #f59e0b; --balloon-glow: rgba(245, 158, 11, 0.75); }
        .balloon-purple { --balloon-color: #a855f7; --balloon-glow: rgba(168, 85, 247, 0.75); }
        .balloon-pink   { --balloon-color: #ec4899; --balloon-glow: rgba(236, 72, 153, 0.75); }

        /* ===== 强化版气球爆炸视觉（全部走 transform / opacity，GPU Compositor，不触发 Layout/Paint） ===== */

        @keyframes pop {
            0%   { transform: scale(1); opacity: 1; }
            18%  { transform: scale(1.22) rotate(-2deg); opacity: 1; }  /* 先膨胀撕裂（squash） */
            35%  { transform: scale(1.45) rotate(3deg); opacity: 0.85; } /* 继续撑开，半透 */
            60%  { transform: scale(1.25) rotate(-1deg); opacity: 0.4; } /* 开始爆散、淡出 */
            100% { transform: scale(0.2) rotate(0deg); opacity: 0; }    /* 缩到中心消失 */
        }

        .balloon.pop {
            animation: pop 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transition: none !important; /* 击破时停止浮动动画 */
            will-change: transform, opacity;
        }

        /* 双环冲击波：从气球中心向外扩两圈半透明色环，模拟"嘭"的空气震动 */
        .shockwave {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            border-style: solid;
            z-index: 60;
            will-change: transform, opacity;
            mix-blend-mode: screen;
        }
        .shockwave.ring-1 {
            width: 60px;
            height: 60px;
            border-width: 4px;
            border-color: var(--sw-color, rgba(255,255,255,0.9));
            animation: shockwaveExpand 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .shockwave.ring-2 {
            width: 60px;
            height: 60px;
            border-width: 2px;
            border-color: var(--sw-color, rgba(255,255,255,0.75));
            animation: shockwaveExpand 0.7s 0.06s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0; /* 由动画开头恢复 */
        }
        @keyframes shockwaveExpand {
            0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
            40%  { opacity: 0.95; }
            100% { transform: translate(-50%, -50%) scale(5.2); opacity: 0; }
        }

        /* 中心强光闪白： radial-gradient 白光层瞬间爆亮再淡出，制造"一闪"的冲击感 */
        .burst-flash {
            position: absolute;
            width: 160px;
            height: 160px;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.1);
            background: radial-gradient(circle, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0.75) 22%, rgba(255,255,255,0.2) 52%, transparent 72%);
            border-radius: 50%;
            mix-blend-mode: screen;
            z-index: 61;
            will-change: transform, opacity;
            animation: flashPop 0.42s ease-out forwards;
        }
        @keyframes flashPop {
            0%   { transform: translate(-50%, -50%) scale(0.12); opacity: 1; }
            30%  { transform: translate(-50%, -50%) scale(1);   opacity: 1; } /* 最亮瞬间 */
            100% { transform: translate(-50%, -50%) scale(1.35); opacity: 0; }
        }

        /* ===== 升级版 emoji 爆闪：💥 锚点 + 4 层 CSS 光芒包裹（仍全部 transform / opacity，GPU 合成） ===== */

        /* 爆闪容器：居中定位，所有子层以它为原点展开 */
        .boom-wrap {
            position: absolute;
            width: 0;
            height: 0;
            pointer-events: none;
            z-index: 62;
            will-change: transform, opacity;
        }

        /* (1) 内层过曝金光圈：瞬间从中心放大，1 帧到最大亮度，制造"咔"的过曝一闪 */
        .boom-core {
            position: absolute;
            left: 0; top: 0;
            width: 180px; height: 180px;
            transform: translate(-50%, -50%) scale(0.05);
            background: radial-gradient(circle,
                rgba(255, 255, 220, 1) 0%,
                rgba(255, 235, 150, 0.95) 18%,
                var(--boom-core, rgba(255, 200, 120, 0.85)) 38%,
                rgba(255, 255, 255, 0.0) 70%);
            border-radius: 50%;
            mix-blend-mode: screen;
            animation: boomCore 0.38s cubic-bezier(0.12, 1, 0.25, 1) forwards;
        }
        @keyframes boomCore {
            0%   { transform: translate(-50%, -50%) scale(0.05); opacity: 0; }
            10%  { transform: translate(-50%, -50%) scale(0.85); opacity: 1; } /* 瞬间点亮  */
            28%  { transform: translate(-50%, -50%) scale(1.1);  opacity: 0.95; }
            100% { transform: translate(-50%, -50%) scale(1.8);  opacity: 0; }
        }

        /* (2) 4 向锯齿星芒：clip-path 8 角星，模拟爆炸的尖角喷射 */
        .boom-spikes {
            position: absolute;
            left: 0; top: 0;
            width: 160px; height: 160px;
            transform: translate(-50%, -50%) scale(0.08) rotate(0deg);
            background: radial-gradient(circle,
                var(--boom-spike, #ffd166) 0%,
                var(--boom-spike2, #ff9f40) 45%,
                rgba(255, 150, 60, 0.15) 72%,
                transparent 85%);
            /* 8 角星 clip-path（正四角 + 斜四角交替凹陷），爆炸锯齿形状 */
            clip-path: polygon(
                50% 0%,  58% 28%,  90% 10%, 72% 40%, 100% 50%, 72% 60%,
                90% 90%, 58% 72%,  50% 100%, 42% 72%, 10% 90%, 28% 60%,
                0% 50%,  28% 40%,  10% 10%, 42% 28%
            );
            filter: drop-shadow(0 0 8px var(--boom-spike2, #ff9f40));
            animation: boomSpikes 0.52s cubic-bezier(0.2, 0.95, 0.3, 1) forwards;
        }
        @keyframes boomSpikes {
            0%   { transform: translate(-50%, -50%) scale(0.08) rotate(-8deg); opacity: 0; }
            18%  { transform: translate(-50%, -50%) scale(0.72) rotate(4deg);  opacity: 1; }
            55%  { transform: translate(-50%, -50%) scale(1.02) rotate(-2deg); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(1.6)  rotate(8deg);  opacity: 0; }
        }

        /* (3) 锥形光环（conic-gradient）：旋转向外扩散，像光脉冲扫过 */
        .boom-conic {
            position: absolute;
            left: 0; top: 0;
            width: 200px; height: 200px;
            transform: translate(-50%, -50%) scale(0.05) rotate(0deg);
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                var(--boom-conic1, rgba(255,220,120,0.85)) 20deg,
                transparent 55deg,
                var(--boom-conic2, rgba(255,160,60,0.75)) 110deg,
                transparent 150deg,
                var(--boom-conic1, rgba(255,220,120,0.85)) 200deg,
                transparent 240deg,
                var(--boom-conic2, rgba(255,160,60,0.75)) 295deg,
                transparent 340deg
            );
            border-radius: 50%;
            mix-blend-mode: screen;
            animation: boomConic 0.55s linear forwards;
        }
        @keyframes boomConic {
            0%   { transform: translate(-50%, -50%) scale(0.05) rotate(0deg);   opacity: 0; }
            12%  { opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(1.8)  rotate(160deg); opacity: 0; }
        }

        /* (4) 底层外环扩散：细圈光环，强化冲击波的视觉锚点（和 shockwave 环呼应但更柔和） */
        .boom-ring {
            position: absolute;
            left: 0; top: 0;
            width: 60px; height: 60px;
            transform: translate(-50%, -50%) scale(0.2);
            border-radius: 50%;
            border: 3px solid var(--boom-ring, rgba(255, 225, 170, 0.95));
            box-shadow: 0 0 18px var(--boom-ring, rgba(255, 225, 170, 0.95));
            mix-blend-mode: screen;
            animation: boomRing 0.58s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes boomRing {
            0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
            75%  { opacity: 0.75; }
            100% { transform: translate(-50%, -50%) scale(4.2); opacity: 0; }
        }

        /* (5) 💥 emoji 本体：缩小尺寸、夹在中心金光和锯齿之间，作为语义锚点而非主体 */
        .boom-emoji {
            position: absolute;
            left: 0; top: 0;
            font-size: 44px;
            line-height: 1;
            transform: translate(-50%, -50%) scale(0.2);
            filter: drop-shadow(0 0 6px rgba(255, 200, 100, 0.9));
            animation: boomEmoji 0.48s cubic-bezier(0.22, 1.2, 0.36, 1) forwards;
            z-index: 1; /* 让 emoji 夹在中心层和锯齿层之间（不是最上面，避免黑边 emoji 破坏光感） */
        }
        @keyframes boomEmoji {
            0%   { transform: translate(-50%, -50%) scale(0.2) rotate(-12deg); opacity: 0; }
            22%  { transform: translate(-50%, -50%) scale(1.3) rotate(6deg);   opacity: 1; } /* 弹性过冲 */
            45%  { transform: translate(-50%, -50%) scale(1.0) rotate(-3deg);  opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.6) rotate(0deg);   opacity: 0; }
        }

        /* 旧版单一 emoji 容器（.explosion）保留——但新版不再使用，仅为未来回退留路径 */
        .explosion {
            position: absolute;
            width: 100px;
            height: 100px;
            pointer-events: none;
            animation: explode 0.5s ease-out forwards;
            z-index: 60;
        }
        @keyframes explode {
            0%   { transform: scale(0); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* 击破火花粒子（圆点）：
         *  - 基础尺寸保留 9px，JS 会用 SPARK_BOOST 独立放大（避免两端耦合——经验 1507452）
         *  - box-shadow 发光半径改为 CSS 变量 --spark-glow，方便 JS 端同步放大
         *  - 末态 scale 从 0.15 → 0.45（不再缩成一个小点消失）
         *  - 不透明保持到 65% 帧
         *  - z-index 提到 63 层，和碎片同层更协调
         */
        .spark {
            position: absolute;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: sparkFly 0.82s cubic-bezier(0.14, 0.82, 0.32, 1) forwards;
            /* 外层柔光晕 + 内层白心高光（双层盒阴影可叠加，不需要多元素） */
            box-shadow:
                0 0 var(--spark-glow, 14px) var(--spark-color, #fff),
                0 0 2px    rgba(255,255,255,0.95) inset;
            border: 1px solid rgba(255, 255, 255, 0.75);
            z-index: 63;
            will-change: transform, opacity;
        }
        @keyframes sparkFly {
            0%   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            65%  { transform: translate(calc(-50% + var(--dx) * 0.72), calc(-50% + var(--dy) * 0.72 + (var(--dy2, 0px) * 0.55))) scale(1.08); opacity: 1; } /* 中段微膨胀 + 保持可见 */
            100% { transform: translate(calc(-50% + var(--dx)),        calc(-50% + var(--dy)        + (var(--dy2, 0px))))        scale(0.45); opacity: 0; } /* 末态不再缩太小 */
        }

        /* 气球碎片（长条矩形）：强化可见性 —— 放大尺寸、加厚、更长不透明、加描边、z-index 提到 63 压在爆闪之上 */
        .shard {
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -50%) rotate(0deg) scale(1);
            background: var(--shard-color, #ff6ec4);
            border-radius: 3px;
            /* 三层叠加：外层柔光晕 + 内层强发光描边 + 1px 白边提升对比度 */
            box-shadow:
                0 0 14px var(--shard-glow, rgba(255,110,196,0.85)),
                0 0 4px  rgba(255,255,255,0.9) inset,
                0 0 1px  rgba(0,0,0,0.25);
            border: 1px solid rgba(255, 255, 255, 0.65);
            z-index: 63;
            will-change: transform, opacity;
            animation: shardFly 1.0s cubic-bezier(0.2, 0.85, 0.3, 1) forwards;
        }
        @keyframes shardFly {
            0%   { transform: translate(-50%, -50%) rotate(0deg) scale(1);   opacity: 1; }
            65%  { transform: translate(calc(-50% + var(--sdx) * 0.72), calc(-50% + var(--sdy) * 0.72 + var(--sdy2, 0px) * 0.55)) rotate(calc(var(--srot, 360deg) * 0.65)) scale(1.05); opacity: 1; } /* 到 65% 还保持清晰 */
            100% { transform: translate(calc(-50% + var(--sdx)),        calc(-50% + var(--sdy)        + var(--sdy2, 0px)))        rotate(var(--srot, 360deg))                  scale(0.65); opacity: 0; } /* 末态只缩到 0.65，不是 0.3 */
        }

        #input-area {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;              /* 左右 padding 从 20→16，给文字腾空间 */
            font-size: 1.35rem;              /* 输入字体从 1.5 缩到 1.35，视觉不影响输入但显著减少占位 */
            line-height: 1.35;
            border: 2px solid #bae6fd;
            border-radius: 14px;
            margin-bottom: 12px;
            text-align: center;
            background: #f0f9ff;
            color: #1e293b;
            transition: all 0.3s;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            /* Chrome/Safari/Firefox 统一：输入框原生支持从右向左删减，避免超长时看不到光标 */
            direction: ltr;
        }
        /* placeholder 单独字号（经验 1095715：主诉是文字溢出时优先独立设置占位字号，避免影响输入正文） */
        #input-area::placeholder {
            color: #94a3b8;
            font-size: 0.95rem;              /* placeholder 明显比输入字小，一行内稳稳放下 */
            line-height: 1.2;
            letter-spacing: 0.01em;
            opacity: 1;                      /* 覆盖 Firefox 默认 0.54 的淡透明度 */
        }
        /* 跨浏览器前缀兜底（Edge、旧 Chromium 会吃 -webkit 前缀） */
        #input-area::-webkit-input-placeholder {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.2;
            opacity: 1;
        }
        #input-area::-moz-placeholder {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.2;
            opacity: 1;
        }
        #input-area:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15), 0 0 28px rgba(56, 189, 248, 0.25);
            transform: translateY(-2px);
            background: #ffffff;
        }

        .control-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border: none;
            border-radius: 999px;
            padding: 12px 34px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
            margin: 0.25rem 0.5rem;
            position: relative;    /* 波纹定位锚点 */
            overflow: hidden;      /* 波纹裁剪在按钮内 */
        }
        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(2, 132, 199, 0.45);
        }
        .control-btn:active {
            transform: translateY(0);
        }
        .control-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        /* 次级按钮（暂停/继续）：描边白底（规范第七节） */
        #pause-btn {
            background: #ffffff;
            color: #0369a1;
            border: 2px solid #bae6fd;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.1);
        }
        #pause-btn:hover {
            box-shadow: 0 8px 22px rgba(2, 132, 199, 0.18);
        }
        #pause-btn:disabled {
            opacity: 0.4;
            box-shadow: none;
        }

        /* 反馈区：彩色药丸 + 弹性弹入（成功绿 / 失败红 / 提示橙，规范第八节） */
        .feedback {
            height: 26px;
            min-height: 26px;
            font-size: 1.02rem;
            margin: 6px 0;
            font-weight: 700;
            color: #0369a1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 14px;
            border-radius: 999px;
        }
        .feedback.fb-pop { animation: fbPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .feedback.fb-ok   { background: linear-gradient(135deg, #34d399, #10b981); color: #fff; text-shadow: none; }
        .feedback.fb-err  { background: linear-gradient(135deg, #f87171, #ef4444); color: #fff; text-shadow: none; }
        .feedback.fb-info { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #fff; text-shadow: none; }
        @keyframes fbPop {
            0%   { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1);   opacity: 1; }
        }

        /* 输入框状态闪烁：打对绿闪 / 打错红闪+抖动（1.2s 后由 JS 清除） */
        #input-area.flash-correct {
            border-color: #34d399;
            background: #ecfdf5;
            box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.22), 0 0 24px rgba(52, 211, 153, 0.3);
        }
        #input-area.flash-wrong {
            border-color: #f87171;
            background: #fef2f2;
            box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.2), 0 0 24px rgba(248, 113, 113, 0.28);
            animation: inputShake 0.35s ease;
        }
        @keyframes inputShake {
            0%, 100% { transform: translateX(0); }
            25%      { transform: translateX(-5px); }
            75%      { transform: translateX(5px); }
        }

        /* 按钮点击波纹 */
        .btn-ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0);
            animation: btnRipple 0.6s ease-out forwards;
            pointer-events: none;
        }
        @keyframes btnRipple {
            to { transform: scale(4); opacity: 0; }
        }

        /* 游戏结束弹窗 */
        .game-over {
            background: rgba(2, 132, 199, 0.35);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-over-card {
            background: linear-gradient(160deg, #ffffff 0%, #f0f9ff 55%, #fce7f3 100%);
            border: 1px solid rgba(56, 189, 248, 0.45);
            border-radius: 30px;
            padding: 2.6rem 2.4rem;
            text-align: center;
            box-shadow: 0 30px 80px rgba(2, 132, 199, 0.28), 0 0 0 1px rgba(56, 189, 248, 0.12);
            max-width: 420px;
            width: 90%;
            position: relative;
            overflow: hidden;
            animation: cardIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        /* 弹窗顶部彩虹条（同容器，规范第十节） */
        .game-over-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #38bdf8, #0284c7, #ec4899, #f59e0b, #38bdf8);
        }
        @keyframes cardIn {
            0%   { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .game-over-card h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1rem;
            /* 关键：h2 自身不再挂 background-clip:text，否则连 emoji 一起被 clip 成蓝紫色渐变蒙版 */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            line-height: 1.2;
        }

        // ===== 颜色工具（供爆闪、碎片等特效动态调色）=====
        // #RRGGBB → rgba(R, G, B, a)
        function hexToRgba(hex, a = 1) {
            const m = hex.replace('#', '');
            const v = m.length === 3 ? m.split('').map(c => c + c).join('') : m;
            const r = parseInt(v.slice(0, 2), 16);
            const g = parseInt(v.slice(2, 4), 16);
            const b = parseInt(v.slice(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${a})`;
        }
        // 将 #RRGGBB 按 amount (0~1) 向白色方向提亮（简单线性插值即可）
        function lighten(hex, amount = 0.3) {
            const m = hex.replace('#', '');
            const v = m.length === 3 ? m.split('').map(c => c + c).join('') : m;
            let r = parseInt(v.slice(0, 2), 16);
            let g = parseInt(v.slice(2, 4), 16);
            let b = parseInt(v.slice(4, 6), 16);
            r = Math.round(r + (255 - r) * amount);
            g = Math.round(g + (255 - g) * amount);
            b = Math.round(b + (255 - b) * amount);
            return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
        }

        // 从弹窗中心绽开礼花（不改共享 game_confetti.js，页面内覆盖，规范第九节）

                if (canvas.parentNode) canvas.parentNode.removeChild(canvas);

            // 根据气球类读取配色，保证碎片/冲击波与气球色系一致（视觉统一）
            const colorMap = {
                'balloon-red':    { c: '#f65a5a', g: 'rgba(246, 90, 90, 0.75)',  sw: 'rgba(255, 200, 200, 0.85)' },
                'balloon-orange': { c: '#fb923c', g: 'rgba(251, 146, 60, 0.75)', sw: 'rgba(255, 220, 180, 0.85)' },
                'balloon-green':  { c: '#22c55e', g: 'rgba(34, 197, 94, 0.75)',  sw: 'rgba(200, 255, 215, 0.85)' },
                'balloon-yellow': { c: '#f59e0b', g: 'rgba(245, 158, 11, 0.75)', sw: 'rgba(255, 240, 200, 0.85)' },
                'balloon-purple': { c: '#a855f7', g: 'rgba(168, 85, 247, 0.75)', sw: 'rgba(230, 210, 255, 0.85)' },
                'balloon-pink':   { c: '#ec4899', g: 'rgba(236, 72, 153, 0.75)', sw: 'rgba(255, 215, 235, 0.85)' },
            };
            const palette = colorMap[balloonColorClass] || colorMap['balloon-pink'];

            // ===== 两个独立"旋钮"：碎片稍小 / 圆点火花稍大（经验 1507452：对比型需求必须做成互不叠乘的独立参数）=====
            const SHARD_SHRINK = 0.78;   // 碎片尺寸倍率：比上一版小 22%（"稍微小一点点"）
            const SPARK_BOOST  = 0.85;   // 圆点火花尺寸倍率：降到比默认 9px 还小 15%（约 7.7px），与长条碎片的形状+尺寸双维度区分，避免混淆

            // 爆闪专用调色：金色基础 + 气球色点缀，既保持"金色爆闪"的冲击感又呼应气球色
            const Boom = {
                core:   palette.c.startsWith('#') ? hexToRgba(palette.c, 0.55) : palette.g,
                spike:  lighten(palette.c, 0.35),
                spike2: palette.c,
                conic1: palette.c.startsWith('#') ? hexToRgba(lighten(palette.c, 0.4), 0.88) : palette.sw,
                conic2: palette.c.startsWith('#') ? hexToRgba(palette.c, 0.78)             : palette.g,
                ring:   palette.c.startsWith('#') ? hexToRgba(lighten(palette.c, 0.55), 0.92) : palette.sw,
            };
            const sparkPalette = ['#fff3b0', palette.c, '#ffffff',
                Object.values(colorMap)[Math.floor(Math.random()*6)].c,
                Object.values(colorMap)[Math.floor(Math.random()*6)].c];

            /* --- 1) 双环冲击波（2 个元素，不同延迟/粗细） --- */
            for (let r = 1; r <= 2; r++) {
                const ring = document.createElement('div');
                ring.className = `shockwave ring-${r}`;
                ring.style.left = `${x}px`;
                ring.style.top = `${y}px`;
                ring.style.setProperty('--sw-color', palette.sw);
                ring.addEventListener('animationend', () => ring.remove());
                gameArea.appendChild(ring);
            }

            /* --- 2) 中心强光闪白 --- */
            const burst = document.createElement('div');
            burst.className = 'burst-flash';
            burst.style.left = `${x}px`;
            burst.style.top = `${y}px`;
            burst.addEventListener('animationend', () => burst.remove());
            gameArea.appendChild(burst);

            /* --- 3) 圆点火花（18 颗，球面均匀采样 + 重力下坠 + 每粒子随机相位）—— 应用 SPARK_BOOST 放大基础尺寸 --- */
            const sparkCount = 18;
            for (let i = 0; i < sparkCount; i++) {
                const spark = document.createElement('div');
                spark.className = 'spark';
                // 球面均匀采样（避免 1157477 提到的"对角聚团/整齐同步"）
                const u = Math.random();
                const v = Math.random();
                const angle = 2 * Math.PI * u;
                const radial = 1 - Math.sqrt(v); // 中心更密、外围稀疏，像真实爆炸
                const dist = 38 + radial * 78 + Math.random() * 18;
                const gravityY = 38 + Math.random() * 46; // 独立重力参数
                const color = sparkPalette[Math.floor(Math.random() * sparkPalette.length)];
                spark.style.left = `${x}px`;
                spark.style.top  = `${y}px`;
                spark.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
                spark.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
                spark.style.setProperty('--dy2', `${gravityY}px`);
                spark.style.setProperty('--spark-color', color);
                spark.style.background = color;
                // 用 SPARK_BOOST 放大每颗火花的基础尺寸 + 发光半径
                spark.style.width  = `${9  * SPARK_BOOST}px`;
                spark.style.height = `${9  * SPARK_BOOST}px`;
                spark.style.setProperty('--spark-glow', `${14 * SPARK_BOOST}px`);
                // 独立起始动画延迟，打破"齐爆"感
                const delayMs = Math.random() * 40;
                if (delayMs > 0) spark.style.animationDelay = `${delayMs}ms`;
                spark.addEventListener('animationend', () => spark.remove());
                gameArea.appendChild(spark);
            }

            /* --- 4) 气球碎片长条（14 条，随机宽高+旋转）—— 应用 SHARD_SHRINK 稍微收窄尺寸 --- */
            const shardCount = 14;
            for (let i = 0; i < shardCount; i++) {
                const shard = document.createElement('div');
                shard.className = 'shard';
                const angle = Math.random() * Math.PI * 2;
                const dist = 62 + Math.random() * 95;
                const gravityY = 75 + Math.random() * 80;
                // 上版基础宽高范围：w 6~19 / h 14~42 → 乘 SHARD_SHRINK（0.78）后约 5~15 / 11~33，即"稍微小一点点"
                const w = (6  + Math.random() * 13) * SHARD_SHRINK;
                const h = (14 + Math.random() * 28) * SHARD_SHRINK;
                const rot = (Math.random() * 1080 - 540) + 'deg';
                shard.style.left = `${x}px`;
                shard.style.top  = `${y}px`;
                shard.style.width  = `${w}px`;
                shard.style.height = `${h}px`;
                shard.style.setProperty('--sdx', `${Math.cos(angle) * dist}px`);
                shard.style.setProperty('--sdy', `${Math.sin(angle) * dist}px`);
                shard.style.setProperty('--sdy2', `${gravityY}px`);
                shard.style.setProperty('--srot', rot);
                shard.style.setProperty('--shard-color', palette.c);
                shard.style.setProperty('--shard-glow', palette.g);
                const delayMs = Math.random() * 35;
                if (delayMs > 0) shard.style.animationDelay = `${delayMs}ms`;
                shard.addEventListener('animationend', () => shard.remove());
                gameArea.appendChild(shard);
            }

            /* --- 5) 升级版爆闪（💥 锚点 + 4 层 CSS 光芒包裹）—— 临时关闭，方便对比碎片单独的视觉效果（后续把 "// TEMP_DISABLED:" 去掉即可恢复）
            // TEMP_DISABLED: (function createBoom() {
                const wrap = document.createElement('div');
                wrap.className = 'boom-wrap';
                wrap.style.left = `${x}px`;
                wrap.style.top  = `${y}px`;

                const core = document.createElement('div');
                core.className = 'boom-core';
                core.style.setProperty('--boom-core', Boom.core);

                const spikes = document.createElement('div');
                spikes.className = 'boom-spikes';
                spikes.style.setProperty('--boom-spike',  Boom.spike);
                spikes.style.setProperty('--boom-spike2', Boom.spike2);

                const conic = document.createElement('div');
                conic.className = 'boom-conic';
                conic.style.setProperty('--boom-conic1', Boom.conic1);
                conic.style.setProperty('--boom-conic2', Boom.conic2);

                const ring = document.createElement('div');
                ring.className = 'boom-ring';
                ring.style.setProperty('--boom-ring', Boom.ring);

                const emoji = document.createElement('div');
                emoji.className = 'boom-emoji';
                emoji.textContent = '💥';

                // 层级（从下到上）：ring → conic → spikes → emoji → core（金光叠在最上方，盖在 emoji 上模拟过曝）
                wrap.appendChild(ring);
                wrap.appendChild(conic);
                wrap.appendChild(spikes);
                wrap.appendChild(emoji);
                wrap.appendChild(core);

                // 子层中动画最长的是 boom-ring (0.58s)，以最长的为基准清理 wrap
                const longestChild = ring;
                longestChild.addEventListener('animationend', () => { if (wrap.parentNode) wrap.remove(); }, { once: true });
                // 兜底清理，防止 animationend 偶发不触发
                setTimeout(() => { if (wrap.parentNode) wrap.remove(); }, 900);

                gameArea.appendChild(wrap);
            // TEMP_DISABLED: })();
            --- */
        }

        // 击破气球（主体爆开动画 + 装饰特效同帧启动，主体结束后才 remove DOM，避免割裂感）
        function popBalloon(balloon) {
            balloon.popped = true;
            const el = balloon.element;

            // 读取气球颜色类，让爆炸特效与气球色系一致
            const colorClass = Array.from(el.classList).find(c => c.startsWith('balloon-') && c !== 'balloon');

            // 停止浮动 transition，锁定当前位置
            const rect = el.getBoundingClientRect();
            const gameRect = gameArea.getBoundingClientRect();
            el.style.transition = 'none';
            el.style.transform = `translateY(${rect.top - gameRect.top - 100}px)`;

            // 主体命中关键帧 + 所有装饰特效在同一帧启动
            const cx = rect.left - gameRect.left + (rect.width / 2);
            const cy = rect.top - gameRect.top + (rect.height / 2);
            el.classList.add('pop');
            createExplosion(cx, cy, colorClass);  // 同步启动装饰特效，无时间差

            // 主体动画结束后再移除 DOM，保证视觉衔接自然（经验 1549261）
            el.addEventListener('animationend', () => { if (el.parentNode) el.remove(); }, { once: true });

            // 更新得分
            combo++;
            if (combo > maxCombo) maxCombo = combo;
            const baseScore = 10;
            const comboBonus = Math.floor(combo / 5) * 5;
            score += baseScore + comboBonus;

            updateStats();
            bounceStat(comboEl);
            setFeedback(`+${baseScore + comboBonus}分！连击×${combo} 🔥`, 'ok');
            flashInput('correct');
        }

        // 气球到达顶部（标记 done，由 cleanupBalloons 统一清理）
        function balloonMissed(balloon) {
            if (!gameRunning) return; // 游戏已结束，忽略在途气球的回调，避免重复扣血/负数生命
            balloon.done = true;
            lives--;
            combo = 0;

            updateStats();
            bounceStat(livesEl);
            setFeedback('气球飞走了 😢', 'err');

            if (balloon.element.parentNode) {
                balloon.element.remove();
            }

            if (lives <= 0) {
                endGame();
            }
        }

        // 定期清理已完成/已击破的气球（替代每帧 splice）
        function cleanupBalloons() {
            for (let i = balloons.length - 1; i >= 0; i--) {
                if (balloons[i].done || balloons[i].popped) {
                    balloons.splice(i, 1);
                }
            }
        }

        // 游戏主循环（轻量兜底：检查 CSS transition 可能漏掉的到期气球）
        function gameLoop() {
            if (!gameRunning || gamePaused) return;

            const now = Date.now();
            for (let i = balloons.length - 1; i >= 0; i--) {
                const balloon = balloons[i];
                if (balloon.popped || balloon.done) continue;

                // 超时兜底：transitionend 可能因浏览器原因未触发
                if (now - balloon.startTime > balloon.duration * 1000 + 200) {
                    balloonMissed(balloon);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // 游戏结束礼花已由页面内 launchConfettiFromCard() 接管（canvas-confetti，见文件顶部辅助函数区）

        // 点击"开始游戏"按钮：
        // 1）防重复：正在运行 / 正在倒计时 中都直接 return
        // 2）跑 3 → 2 → 1 → GO! 倒计时（≈ 2.7s）
        // 3）倒计时结束后才真正执行气球生成
        function startGame() {
            if (gameRunning) return;
            if (countdownPending) return;          // 已经在倒计时，忽略重入点击

            // 锁定"开始"按钮，倒计时期间再点也不会多开一轮
            startBtn.disabled = true;

            startCountdownThen(() => {
                gameRunning = true;
                gamePaused = false;
                inputArea.disabled = false;
                pauseBtn.disabled = false;
                reticle.style.opacity = '1';
                inputArea.focus();

                // 开始生成气球
                spawnInterval = setInterval(createBalloon, currentDifficulty.spawnRate);

                // 定期清理已结束的气球（1秒一次，替代每帧 splice）
                cleanupInterval = setInterval(cleanupBalloons, 1000);

                // 启动兜底检查循环
                requestAnimationFrame(gameLoop);
            });
        }

        // 暂停游戏（冻结/恢复 CSS transition）
        function togglePause() {
            if (!gameRunning) return;

            gamePaused = !gamePaused;
            pauseBtn.textContent = gamePaused ? '继续' : '暂停';

            if (gamePaused) {
                // 冻结每个气球的当前位置
                const now = Date.now();
                balloons.forEach(balloon => {
                    if (balloon.popped || balloon.done) return;
                    const elapsed = (now - balloon.startTime) / 1000;
                    balloon.remainingTime = Math.max(0, balloon.duration - elapsed);
                    // 读取当前渲染位置并冻结
                    const currentY = getComputedStyle(balloon.element).transform;
                    balloon.element.style.transition = 'none';
                    balloon.element.style.transform = currentY === 'none' ? 'translateY(100px)' : currentY;
                });
                setFeedback('游戏已暂停 ⏸️', 'info');
            } else {
                // 恢复：从冻结位置续播剩余时间
                balloons.forEach(balloon => {
                    if (balloon.popped || balloon.done) return;
                    if (balloon.remainingTime <= 0) {
                        balloonMissed(balloon);
                        return;
                    }
                    balloon.startTime = Date.now();
                    balloon.duration = balloon.remainingTime;
                    balloon.element.style.transition = `transform ${balloon.remainingTime}s linear`;
                    balloon.element.offsetHeight; // 强制 reflow
                    balloon.element.style.transform = `translateY(-${gameArea.clientHeight + 100}px)`;
                });
                setFeedback('', null);
                requestAnimationFrame(gameLoop);
                inputArea.focus();
            }
        }

        // 结束游戏
        function endGame() {
            gameRunning = false;

            clearInterval(spawnInterval);
            clearInterval(cleanupInterval);
            spawnInterval = null;
            cleanupInterval = null;

            inputArea.disabled = true;
            pauseBtn.disabled = true;

            finalScoreEl.textContent = score;
            document.getElementById('final-combo').textContent = maxCombo;
            // 弹窗和礼花同时出现（规范第九节）
            gameOverEl.classList.remove('hidden');
            launchConfettiFromCard();
        }

        // 切换难度
        function changeDifficulty(e) {
            if (gameRunning) {
                if (!confirm('切换难度将重新开始游戏，确定吗？')) {
                    return;
                }
                initGame();
            }

            // 移除所有active类
            diffBtns.forEach(btn => btn.classList.remove('active'));

            // 添加当前active类
            const btn = e.target;
            btn.classList.add('active');

            gameMode = btn.dataset.mode;

            // 设置难度参数
            switch (gameMode) {
                case 'easy':
                    currentDifficulty = {
                        spawnRate: 2200,
                        floatDuration: 10000,
                        maxBalloons: 1,
                        wordType: 'letter'
                    };
                    break;
                case 'normal':
                    currentDifficulty = {
                        spawnRate: 2800,
                        floatDuration: 9000,
                        maxBalloons: 2,
                        wordType: 'word'
                    };
                    break;
                case 'hard':
                    currentDifficulty = {
                        spawnRate: 3000,
                        floatDuration: 10000,
                        maxBalloons: 2,
                        wordType: 'phrase'
                    };
                    break;
            }
        }

        // 处理输入
        function handleInput(e) {
            if (!gameRunning || gamePaused) return;

            const input = inputArea.value.trim().toLowerCase();
            if (!input) return;

            // 查找匹配的气球
            for (let i = 0; i < balloons.length; i++) {
                if (balloons[i].text.toLowerCase() === input && !balloons[i].popped) {
                    popBalloon(balloons[i]);
                    inputArea.value = '';
                    return;
                }
            }

            // 没有匹配 - 只在有实际输入内容时才算打错
            // 部分匹配不算错，让用户继续输入
            const hasPartialMatch = balloons.some(b => !b.popped && !b.done && b.text.toLowerCase().startsWith(input));
            if (!hasPartialMatch && input.length > 1) {
                combo = 0;
                updateStats();
                setFeedback('打错啦 ❌', 'err');
                flashInput('wrong');
                inputArea.value = '';
            }
        }

        // 事件监听（按钮统一带波纹动效）
        diffBtns.forEach(btn => btn.addEventListener('click', (e) => {
            createBtnRipple(e.currentTarget, e);
            changeDifficulty(e);
        }));
        startBtn.addEventListener('click', (e) => { createBtnRipple(startBtn, e); startGame(); });
        pauseBtn.addEventListener('click', (e) => { createBtnRipple(pauseBtn, e); togglePause(); });
        restartBtn.addEventListener('click', (e) => { createBtnRipple(restartBtn, e); initGame(); });
        inputArea.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleInput();
            }
        });
        // 实时匹配：每次输入都检查
        inputArea.addEventListener('input', () => {
            if (!gameRunning || gamePaused) return;
            const input = inputArea.value.trim().toLowerCase();
            if (!input) return;
            // 完全匹配则击破
            for (let i = 0; i < balloons.length; i++) {
                if (balloons[i].text.toLowerCase() === input && !balloons[i].popped) {
                    popBalloon(balloons[i]);
                    inputArea.value = '';
                    return;
                }
            }
        });

        // 初始化游戏
        initGame();
    </script>
</div>
