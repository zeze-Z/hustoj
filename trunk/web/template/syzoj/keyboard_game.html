    const comboEl = document.getElementById('combo');
    const comboDisplay = document.getElementById('combo-display');
    const wordCharsEl = document.getElementById('word-chars');
    const wordPinyinEl = document.getElementById('word-pinyin');
    const inputArea = document.getElementById('input-area');
    const inputHint = document.getElementById('input-hint');
    const feedbackEl = document.getElementById('feedback');
    const gameOverMessage = document.getElementById('game-over-message');
    const progressBar = document.getElementById('progress-bar');
    const learnMode = document.getElementById('learn-mode');
    const correctAnswerEl = document.getElementById('correct-answer');
    const achievementEl = document.getElementById('achievement');
    const diffBtns = document.querySelectorAll('.diff-btn');

    // 游戏状态
    let currentWordIndex = 0;
    let filteredWords = [];
    let score = 0;
    let correctCount = 0;
    let totalCount = 0;
    let timer = 600;
    let timerInterval = null;
    let gameStarted = false;
    let isPaused = false;
    let combo = 0;
    let maxCombo = 0;
    let isLearnMode = false;
    let currentDifficulty = 'easy';
    let totalWords = 0;

    // 根据难度筛选词语
    function filterWordsByDifficulty(difficulty) {
        switch(difficulty) {
            case 'easy':
                return wordList.filter(w => w.char.length === 2);
            case 'medium':
                return wordList.filter(w => w.char.length === 3);
            case 'hard':
            default:
                return [...wordList];
        }
    }

    // 打乱数组
    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // 显示当前词语
    function showCurrentWord() {
        if (currentWordIndex >= filteredWords.length) {
            endGame();
            return;
        }

        const word = filteredWords[currentWordIndex];
        const chars = word.char.split('');
        
        // 清空并渲染字符
        wordCharsEl.innerHTML = '';
        chars.forEach((char, index) => {
            const span = document.createElement('span');
            span.className = 'char pending' + (index === 0 ? ' current' : '');
            span.textContent = char;
            span.dataset.index = index;
            wordCharsEl.appendChild(span);
        });
        
        wordPinyinEl.textContent = word.pinyin;
        
        // 更新进度条
        const progress = (currentWordIndex / totalWords) * 100;
        progressBar.style.width = progress + '%';
        
        // 更新输入提示
        inputHint.textContent = `请输入: ${word.char}`;
    }

    // 更新字符状态
    function updateCharStatus(inputLength) {
        const word = filteredWords[currentWordIndex];
        const chars = wordCharsEl.querySelectorAll('.char');
        const input = inputArea.value;
        
        chars.forEach((charEl, index) => {
            charEl.classList.remove('current', 'correct', 'wrong', 'pending');
            
            if (index < input.length) {
                if (input[index] === word.char[index]) {
                    charEl.classList.add('correct');
                } else {
                    charEl.classList.add('wrong');
                }
            } else if (index === input.length) {
                charEl.classList.add('current');
            } else {
                charEl.classList.add('pending');
            }
        });
    }

    // 显示成就
    function showAchievement(text) {
        achievementEl.textContent = text;
        achievementEl.style.display = 'block';
        setTimeout(() => {
            achievementEl.style.display = 'none';
        }, 2000);
    }

    // 开始游戏
    function startGame() {
        if (gameStarted) return;
        
        // 筛选并打乱词语
        filteredWords = shuffleArray(filterWordsByDifficulty(currentDifficulty));
        totalWords = filteredWords.length;
        
        currentWordIndex = 0;
        score = 0;
        correctCount = 0;
        totalCount = 0;
        timer = 600;
        combo = 0;
        maxCombo = 0;
        gameStarted = true;
        isPaused = false;
        isLearnMode = false;
        
        gameOverMessage.textContent = '';
        feedbackEl.textContent = '';
        learnMode.style.display = 'none';
        
        // 更新按钮状态
        startBtn.disabled = true;
        pauseBtn.disabled = false;
        resetBtn.disabled = false;
        inputArea.disabled = false;
        inputArea.value = '';
        inputArea.placeholder = '请输入上面的词语';
        inputArea.focus();
        
        // 禁用难度选择
        diffBtns.forEach(btn => btn.disabled = true);
        
        // 显示第一个词语
        showCurrentWord();
        
        // 启动计时器
        timerInterval = setInterval(() => {
            if (!isPaused) {
                timer--;
                timerEl.textContent = timer;
                if (timer <= 0) {
                    endGame();
                }
            }
        }, 1000);
    }

    // 暂停/继续
    function togglePause() {
        isPaused = !isPaused;
        pauseBtn.textContent = isPaused ? '▶️ 继续' : '⏸️ 暂停';
        inputArea.disabled = isPaused;
        
        if (isPaused) {
            inputHint.textContent = '游戏已暂停';
        } else {
            inputArea.focus();
            checkInput();
        }
    }

    // 重置游戏
    function resetGame() {
        clearInterval(timerInterval);
        gameStarted = false;
        isPaused = false;
        
        startBtn.disabled = false;
        pauseBtn.disabled = true;
        pauseBtn.textContent = '⏸️ 暂停';
        resetBtn.disabled = true;
        inputArea.disabled = true;
        inputArea.value = '';
        inputArea.placeholder = '点击开始游戏';
        
        timer = 600;
        timerEl.textContent = timer;
        score = 0;
        scoreEl.textContent = score;
        correctCount = 0;
        totalCount = 0;
        accuracyEl.textContent = '100';
        combo = 0;
        comboEl.textContent = combo;
        comboDisplay.classList.remove('active');
        
        wordCharsEl.innerHTML = '<span class="char pending">点击开始游戏</span>';
        wordPinyinEl.textContent = '';
        inputHint.textContent = '';
        feedbackEl.textContent = '';
        gameOverMessage.textContent = '';
        learnMode.style.display = 'none';
        progressBar.style.width = '0%';
        
        // 启用难度选择
        diffBtns.forEach(btn => btn.disabled = false);
    }

    // 结束游戏
    function endGame() {
        clearInterval(timerInterval);
        gameStarted = false;
        
        startBtn.disabled = false;
        pauseBtn.disabled = true;
        resetBtn.disabled = false;
        inputArea.disabled = true;
        
        diffBtns.forEach(btn => btn.disabled = false);
        
        const accuracy = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 100;
        gameOverMessage.innerHTML = `
            🎉 游戏结束！<br>
            最终得分：<strong>${score}</strong> 分<br>
            正确率：<strong>${accuracy}%</strong><br>
            最高连击：<strong>${maxCombo}</strong> 次
        `;
    }

    // 检查输入
    function checkInput() {
        if (!gameStarted || isPaused) return;
        
        const input = inputArea.value;
        const word = filteredWords[currentWordIndex];
        
        // 更新字符状态
        updateCharStatus(input.length);
        
        // 检查是否输入完成
        if (input.length >= word.char.length) {
            if (input === word.char) {
                // 正确
                handleCorrect();
            } else {
                // 错误
                handleWrong();
            }
        }
    }

    // 处理正确答案
    function handleCorrect() {
        correctCount++;
        totalCount++;
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        
        // 计算得分（基础10分 + 连击奖励）
        let points = 10;
        if (combo >= 10) {
            points = 20;
            showAchievement('🔥 连击达人！+20分');
        } else if (combo >= 5) {
            points = 15;
        }
        score += points;
        
        // 更新UI
        feedbackEl.textContent = '✅ 正确！' + (combo >= 5 ? ` 连击${combo}次！+${points}分` : '');
        feedbackEl.className = 'feedback correct';
        comboEl.textContent = combo;
        comboDisplay.classList.toggle('active', combo >= 3);
        
        // 清空输入
        inputArea.value = '';
        inputArea.classList.remove('error');
        learnMode.style.display = 'none';
        isLearnMode = false;
        
        // 下一个词
        currentWordIndex++;
        
        // 短暂延迟后显示下一个词
        setTimeout(() => {
            feedbackEl.textContent = '';
            showCurrentWord();
        }, 300);
        
        // 更新统计
        updateStats();
    }

    // 处理错误答案
    function handleWrong() {
        totalCount++;
        combo = 0;
        
        const word = filteredWords[currentWordIndex];
        
        feedbackEl.textContent = '❌ 再试一次';
        feedbackEl.className = 'feedback wrong';
        comboEl.textContent = combo;
        comboDisplay.classList.remove('active');
        
        // 显示学习模式
        if (!isLearnMode) {
            isLearnMode = true;
            learnMode.style.display = 'block';
            correctAnswerEl.textContent = word.char;
            inputArea.classList.add('error');
        }
        
        // 清空输入，让用户重新输入
        inputArea.value = '';
        
        updateStats();
    }

    // 更新统计
    function updateStats() {
        scoreEl.textContent = score;
        const accuracy = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 100;
        accuracyEl.textContent = accuracy;
    }

    // 难度选择
    diffBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            if (gameStarted) return;
            
            diffBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentDifficulty = btn.dataset.diff;
        });
    });

    // 事件监听
    startBtn.addEventListener('click', startGame);
    pauseBtn.addEventListener('click', togglePause);
    resetBtn.addEventListener('click', resetGame);
    inputArea.addEventListener('input', checkInput);

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (gameStarted && !isPaused) {
                togglePause();
            }
        }
        if (e.key === 'Enter' && !gameStarted) {
            startGame();
        }
    });

    // 初始化显示
    wordCharsEl.innerHTML = '<span class="char pending">点击开始游戏</span>';
    wordPinyinEl.textContent = '';
</script>
</div>
<?php include("template/$OJ_TEMPLATE/footer.php");?>
