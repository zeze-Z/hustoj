<div class="ms-wrap">
  <div class="ms-card">
    <div class="ms-title"><span class="ms-title-icon" id="msTitleIcon" aria-hidden="true">🔥</span><span class="ms-title-text">火柴棒算式</span></div>
    <div class="ms-sub">小火苗的夜课 · 移动一根火柴，让等式成立<br><span class="ms-tier" id="msTier">入门</span></div>

    <div class="ms-stats">
      <div class="ms-stat"><span class="ms-stat-icon">📋</span><b class="ms-stat-label">题号</b><span class="ms-stat-value" id="msQ">1/12</span></div>
      <div class="ms-stat"><span class="ms-stat-icon">✅</span><b class="ms-stat-label">已解</b><span class="ms-stat-value" id="msDone">0</span></div>
      <div class="ms-stat"><span class="ms-stat-icon">⏱️</span><b class="ms-stat-label">用时</b><span class="ms-stat-value" id="msTime">00:00</span></div>
      <div class="ms-stat"><span class="ms-stat-icon">🏆</span><b class="ms-stat-label">最佳</b><span class="ms-stat-value" id="msBest">--</span></div>
      <div class="ms-stat"><span class="ms-stat-icon">💡</span><b class="ms-stat-label">提示</b><span class="ms-stat-value" id="msHints">3</span></div>
    </div>

    <div class="ms-board" id="msBoard">
      <div class="ms-eq" id="msEq"></div>
    </div>

    <div class="ms-msg" id="msMsg"></div>

    <div class="ms-btns">
      <button class="ms-btn primary" id="msNext">下一题 ›</button>
      <button class="ms-btn ghost" id="msRestart">重新开始</button>
      <button class="ms-btn amber" id="msHint">💡 提示</button>
    </div>
  </div>
</div>

</div><!-- /padding -->

<div class="ms-victory hidden" id="msVictory">
  <div class="ms-vwin">
    <div class="ms-vflame" id="msVFlame"><div class="ms-flamebig"></div></div>
    <h2>等式成立！🎉</h2>
    <p>小火苗陪你点亮了夜课的一题</p>
    <div class="ms-vlist">
      <div class="ms-stat"><span class="ms-stat-icon">✅</span><b class="ms-stat-label">完成</b><span class="ms-stat-value" id="msvDone">0</span></div>
      <div class="ms-stat"><span class="ms-stat-icon">⏱️</span><b class="ms-stat-label">用时</b><span class="ms-stat-value" id="msvTime">--</span></div>
      <div class="ms-stat"><span class="ms-stat-icon">🏆</span><b class="ms-stat-label">最佳</b><span class="ms-stat-value" id="msvBest">--</span></div>
    </div>
    <button class="ms-vbtn" id="msNextGame">下一题 ›</button>
  </div>
</div>

<script>
(function(){
"use strict";
var SEGB={a:1,b:2,c:4,d:8,e:16,f:32,g:64};
var DIGITEQ={0:63,1:6,2:91,3:79,4:102,5:109,6:125,7:7,8:127,9:111};
var REV={};for(var d in DIGITEQ)REV[DIGITEQ[d]]=+d;
var DIGIT_GEO={
 a:{x:.13,y:.04,w:.74,h:.13},d:{x:.13,y:.83,w:.74,h:.13},g:{x:.13,y:.435,w:.74,h:.13},
 b:{x:.835,y:.11,w:.15,h:.32},c:{x:.835,y:.585,w:.15,h:.32},
 f:{x:.13,y:.11,w:.15,h:.32},e:{x:.13,y:.585,w:.15,h:.32}
};
var DIGIT_SEGS=['a','b','c','d','e','f','g'];
var OP_GEO={
 '+':[{id:'h',x:.08,y:.435,w:.84,h:.13},{id:'v',x:.435,y:.08,w:.13,h:.84}],
 '-':[{id:'h',x:.10,y:.435,w:.80,h:.13}],
 '=':[{id:'e1',x:.15,y:.34,w:.70,h:.13},{id:'e2',x:.15,y:.66,w:.70,h:.13}]
};
var TIERNAME=['入门','进阶','困难'];
var L=[
 {e:"8+6=8",f:"0:g",t:"2:b",g:0},
 {e:"9+5=9",f:"0:f",t:"2:e",g:0},
 {e:"7+6=9",f:"0:a",t:"2:b",g:0},
 {e:"8+5=9",f:"0:g",t:"2:b",g:0},
 {e:"0+7=9",f:"2:a",t:"0:g",g:1},
 {e:"5+8=9",f:"2:g",t:"0:b",g:1},
 {e:"6+8=8",f:"2:g",t:"0:b",g:1},
 {e:"5+7=7",f:"2:a",t:"0:e",g:1},
 {e:"5+2=4",f:"1:v",t:"0:e",g:2},
 {e:"3+2=7",f:"1:v",t:"0:f",g:2},
 {e:"6+4=4",f:"1:v",t:"0:b",g:2},
 {e:"0+5=3",f:"1:v",t:"0:g",g:2}
];

var $=function(id){return document.getElementById(id);};
var board=$('msBoard'), eq=$('msEq'), tierEl=$('msTier');
var qEl=$('msQ'),doneEl=$('msDone'),timeEl=$('msTime'),bestEl=$('msBest'),hintEl=$('msHints');
var btnNext=$('msNext'),btnRestart=$('msRestart'),btnHint=$('msHint'),msgEl=$('msMsg');

var cells=[], lv=0, held=null, solving=false, hints=3, t0=0, timerId=0, doneSet={};

/* anime.js v4 自托管：缺失时全部效果自动降级到 CSS */
var A=window.anime||null;
function reduced(){try{return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}}
function canAnimate(){return !!A && !reduced();}

function digitSegs(d){var m=DIGITEQ[d],s={};for(var k in SEGB)s[k]=(m&SEGB[k])?true:false;return s;}
function opSegs(op){var s={},g=OP_GEO[op];for(var j=0;j<g.length;j++)s[g[j].id]=true;return s;}
function eqCells(str){var a=[];for(var i=0;i<str.length;i++){var ch=str[i];if(ch>='0'&&ch<='9')a.push({type:'d',seg:digitSegs(+ch)});else a.push({type:'o',op:ch,seg:opSegs(ch)});}return a;}

function sym(cell){var h=!!cell.seg.h,v=!!cell.seg.v,p=!!cell.seg.e1,q=!!cell.seg.e2;if(p||q)return(p&&q)?'=':null;if(h&&v)return'+';if(h&&!v)return'-';return null;}
function interp(i){var c=cells[i];if(!c)return null;if(c.type==='d'){var m=0;for(var k in SEGB)if(c.seg[k])m+=SEGB[k];return(m in REV)?REV[m]:null;}return sym(c);}
function check(){if(cells.length!==5)return{ok:false};var a=interp(0),op=interp(1),b=interp(2),e=interp(3),c=interp(4);if(a===null||b===null||c===null||op===null)return{ok:false};if(e!=='=')return{ok:false};var v=op==='+'?a+b:(op==='-'?a-b:null);if(v===null)return{ok:false};return{ok:true,val:v,eq:(v===c)};}

function render(){
  eq.innerHTML='';
  var GS=window.GameSketch||null, sketch=!!(GS&&GS.available);
  /* gs-sketch 挂 body：标题图标/弹窗在 eq 外，挂 eq 上够不着 */
  document.body.classList.toggle('gs-sketch',sketch);
  for(var i=0;i<cells.length;i++){
    var cell=cells[i], cEl=document.createElement('div');
    cEl.className='ms-cell'+(cell.type==='o'?' ms-op':'');
    eq.appendChild(cEl);   /* 先入 DOM，slot 的 offsetWidth 才可测 */
    var segs=(cell.type==='d')?DIGIT_SEGS.slice():OP_GEO[cell.op].map(function(s){return s.id;});
    for(var si=0;si<segs.length;si++){
      var sid=segs[si];
      var g=cell.type==='d'?DIGIT_GEO[sid]:geoOf(cell.op,sid);
      var sl=document.createElement('div');
      sl.className='ms-slot '+(g.w>=g.h?'ms-h':'ms-v');
      sl.dataset.cell=i;sl.dataset.seg=sid;
      sl.style.left=(g.x*100)+'%';sl.style.top=(g.y*100)+'%';
      sl.style.width=(g.w*100)+'%';sl.style.height=(g.h*100)+'%';
      var lit=!!cell.seg[sid];
      if(lit){
        sl.className+=' ms-on';
        if(held&&held.cell===i&&held.seg===sid){sl.className+=' ms-selected';}
        if(hintOn&&hintOn===i+':'+sid)sl.className+=' ms-hintsel';
      }else{
        sl.className+=' ms-off';
        if(held)sl.className+=' ms-drop';
      }
      cEl.appendChild(sl);
      /* 手绘火柴（rough.js）：亮=杆+头，暗=虚线空位；seed 按 cell:seg 稳定，重绘不抖 */
      if(sketch)GS.matchstick(sl,{horiz:g.w>=g.h,ghost:!lit,seed:GS.seedFrom(i+':'+sid)});
    }
  }
  if(sketch)GS.frame(board,{inset:6,color:'rgba(255,217,138,.32)',roughness:1.5,seed:7});
}
function geoOf(op,sid){var g=OP_GEO[op];for(var j=0;j<g.length;j++)if(g[j].id===sid)return g[j];return{id:sid,x:.5,y:.5,w:.1,h:.1};}

var hintOn=null;
function loadLevel(i){
  lv=i;cells=eqCells(L[i].e);held=null;solving=false;hintOn=null;
  hints=3;hintEl.textContent=hints;btnHint.disabled=false;
  doneEl.textContent=Object.keys(doneSet).length;
  qEl.textContent=(lv+1)+'/12';
  tierEl.textContent=TIERNAME[L[i].g];
  bestEl.textContent=fmt(best(L[i]));
  msgEl.textContent='';msgEl.className='ms-msg';
  timerStart();
  render();
}
function best(i){try{var b=JSON.parse(localStorage.getItem('ms_best')||'{}');return b[i]!==undefined?b[i]:null;}catch(e){return null;}}
function saveBest(i,sec){try{var b=JSON.parse(localStorage.getItem('ms_best')||'{}');if(b[i]===undefined||sec<b[i])b[i]=sec;localStorage.setItem('ms_best',JSON.stringify(b));}catch(e){}}
function fmt(s){if(s===null)return'--';var m=Math.floor(s/60),sec=s%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');}

function timerStart(){clearInterval(timerId);t0=Date.now();ticker();timerId=setInterval(ticker,1000);}
function ticker(){timeEl.textContent=fmt(Math.floor((Date.now()-t0)/1000));}
function stopTimer(){clearInterval(timerId);}

/* 统计数字弹性跳动：优先 anime.js 弹簧，降级 CSS 类 */
function bounce(el){
  if(canAnimate()){
    A.animate(el,{scale:[1,1.22,1],ease:'out(2)',duration:420});
    return;
  }
  el.classList.remove('sbounce');void el.offsetWidth;el.classList.add('sbounce');
}

/* 反馈条：彩色底 + 弹性弹入 */
function msg(t,type){
  msgEl.textContent=t;
  msgEl.className='ms-msg'+(type?(' ms-'+type):'');
  if(canAnimate()){
    A.animate(msgEl,{opacity:[0,1],scale:[.9,1],y:[8,0],ease:'out(3)',duration:340});
  }
}

/* 按钮波纹 */
function addRipple(e,btn){
  var r=btn.getBoundingClientRect();
  var d=Math.max(r.width,r.height);
  var s=document.createElement('span');
  s.className='ms-ripple';
  s.style.width=s.style.height=d+'px';
  s.style.left=(e.clientX-r.left-d/2)+'px';
  s.style.top=(e.clientY-r.top-d/2)+'px';
  btn.appendChild(s);
  setTimeout(function(){s.remove();},620);
}

board.addEventListener('click',function(e){
  if(solving)return;
  var sl=e.target.closest('.ms-slot');if(!sl)return;
  var ci=+sl.dataset.cell,si=sl.dataset.seg;
  if(sl.classList.contains('ms-on')){
    if(held){cancel();return;}
    pick(ci,si);
  }else if(sl.classList.contains('ms-off')&&held){
    place(ci,si);
  }
});
function pick(ci,si){held={cell:ci,seg:si,ocell:ci,oseg:si};msg('点一个空位放下这根火柴','hint');render();}
function cancel(){held=null;msgEl.textContent='';msgEl.className='ms-msg';render();}
function shake(){
  if(canAnimate()){
    A.animate(board,{x:[0,-8,7,-5,4,0],ease:'out(2)',duration:420});
    return;
  }
  board.classList.remove('ms-shake');void board.offsetWidth;board.classList.add('ms-shake');
}

function place(ci,si){
  var oc=held.ocell,os=held.oseg;held=null;
  cells[oc].seg[os]=false;
  cells[ci].seg[si]=true;
  var r=check();
  if(r.ok&&r.eq){
    win();
  }else{
    cells[ci].seg[si]=false;
    cells[oc].seg[os]=true;
    shake();
    useHint();
    if(r.ok&&!r.eq)msg('等式还不对哦，再想想~','warn');
    else msg('这样拼不出正确的数呀','err');
    render();
  }
}
function useHint(){
  if(hints>0){hints--;hintEl.textContent=hints;bounce(hintEl);if(hints<=0)btnHint.disabled=true;}
}
btnHint.addEventListener('click',function(e){
  addRipple(e,btnHint);
  var p=L[lv];hintOn=p.f;msg('看看这根火柴~','hint');
  render();
  /* 目标火柴脉冲：anime.js 注意力动画 */
  if(canAnimate()){
    var sel=eq.querySelector('.ms-hintsel');
    if(sel)A.animate(sel,{scale:[1,1.12,1],ease:'inOut(2)',duration:520,repeat:2});
  }
  setTimeout(function(){hintOn=null;render();},2200);
});

btnRestart.addEventListener('click',function(e){addRipple(e,btnRestart);loadLevel(lv);});
btnNext.addEventListener('click',function(e){
  addRipple(e,btnNext);
  loadLevel(lv<L.length-1?lv+1:0);
});

/* 金色粒子：anime.js 弧线上飘，降级 CSS */
function spawnGold(node,delay){
  setTimeout(function(){
    var r=node.getBoundingClientRect();
    var p=document.createElement('span');
    p.className='ms-gold';
    p.style.left=(r.left+r.width/2)+'px';
    p.style.top=(r.top)+'px';
    document.body.appendChild(p);
    if(canAnimate()){
      A.animate(p,{
        y:-150-Math.random()*40,
        x:(Math.random()*40-20),
        scale:[1,.35],
        opacity:[1,0],
        ease:'out(3)',
        duration:900,
        onComplete:function(){p.remove();}
      });
    }else{
      p.style.setProperty('--dx',(Math.random()*40-20)+'px');
      p.classList.add('ms-rise');
      setTimeout(function(){p.remove();},950);
    }
  },delay);
}

/* 通关：点燃编排 → 粒子 → 弹窗（anime.js timeline 统一时序） */
function win(){
  solving=true;held=null;
  var sec=Math.floor((Date.now()-t0)/1000);
  stopTimer();
  doneSet[lv]=1;doneEl.textContent=Object.keys(doneSet).length;bounce(doneEl);
  saveBest(lv,sec);bestEl.textContent=fmt(best(lv));bounce(bestEl);
  render();
  var ons=Array.prototype.slice.call(eq.querySelectorAll('.ms-on'));
  if(canAnimate()){
    /* 光晕波从左到右点亮 */
    A.animate(ons,{
      boxShadow:['0 0 0px 0px rgba(255,179,71,0)','0 0 14px 4px rgba(255,179,71,.75)'],
      ease:'out(2)',
      duration:650,
      delay:A.stagger(110)
    });
    ons.forEach(function(n,i){
      setTimeout(function(){n.classList.add('ms-ignite');spawnGold(n,120);},i*110);
    });
    var total=ons.length*110+750;
    setTimeout(function(){showVictory(sec);},total);
  }else{
    ons.forEach(function(n,i){n.classList.add('ms-ignite');n.style.animationDelay=(i*130)+'ms';});
    ons.forEach(function(n,i){spawnGold(n,120+i*130);});
    setTimeout(function(){showVictory(sec);},Math.min(1700,ons.length*130+400));
  }
}
/* 火焰摇曳：三层焰异相摆动（anime.js），降级 CSS 类 */
function flickerFlame(root,dur){
  if(!root)return;
  if(!canAnimate()){root.classList.add('gs-flicker');return;}
  var out=root.querySelector('.gs-flame-out'),
      mid=root.querySelector('.gs-flame-mid'),
      core=root.querySelector('.gs-flame-core');
  if(out)A.animate(out,{scaleY:[1,1.12,.94,1.08,1],rotate:[0,3,-2,1,0],ease:'inOut(2)',duration:dur,loop:true});
  if(mid)A.animate(mid,{scaleY:[1,1.2,.9,1.12,1],rotate:[0,-4,2,-1,0],ease:'inOut(2)',duration:dur*.72,loop:true});
  if(core)A.animate(core,{scaleY:[1,1.28,.85,1.15,1],ease:'out(2)',duration:dur*.55,loop:true});
}
/* 标题图标：手绘点燃火柴（rough.js），无库时保留 emoji */
function drawTitleIcon(){
  var el=$('msTitleIcon');
  if(!el||!(window.GameSketch&&GameSketch.available))return;
  GameSketch.litMatch(el,{seed:GameSketch.seedFrom('title')});
  flickerFlame(el,1700);
}
function showVictory(sec){
  document.getElementById('msvDone').textContent=Object.keys(doneSet).length;
  document.getElementById('msvTime').textContent=fmt(sec);
  document.getElementById('msvBest').textContent=fmt(best(lv));
  var overlay=$('msVictory'), card=overlay.querySelector('.ms-vwin');
  overlay.classList.remove('hidden');
  /* 弹窗火焰：overlay 显示后再画（隐藏时元素无布局，量不出尺寸）；只画一次，动画 loop 常驻 */
  var vf=$('msVFlame');
  if(vf&&!vf.dataset.drawn&&window.GameSketch&&GameSketch.available){
    vf.dataset.drawn='1';
    GameSketch.flameInto(vf,{seed:GameSketch.seedFrom('vflame')});
    flickerFlame(vf,1500);
  }
  if(canAnimate()){
    A.animate(card,{opacity:[0,1],scale:[.82,1],y:[18,0],ease:'out(4)',duration:520});
    /* 火焰随弹窗 spring 弹出 */
    if(vf&&vf.dataset.drawn)A.animate(vf,{scale:[0,1],ease:'out(4)',duration:520,delay:120});
  }else{
    card.classList.remove('ms-vwin-in');void card.offsetWidth;card.classList.add('ms-vwin-in');
  }
  /* 弹窗与礼花同时出现 */
  if(window.launchConfetti){try{setTimeout(window.launchConfetti,60);}catch(e){}}
}
/* 事件委托到 document：弹窗 DOM 顺序变化也不会因 null 抛错拖死整个 IIFE */
document.addEventListener('click',function(e){
  if(!e.target||!e.target.closest||!e.target.closest('#msNextGame'))return;
  $('msVictory').classList.add('hidden');
  var n=(lv+1)%L.length;loadLevel(n);
});

loadLevel(0);
drawTitleIcon();

window.matchstickLoaded=true;
})();
</script>
