// === 构建索引 ===
const idiomMap = {}; // idiom -> object
const charIndex = {}; // first character -> [idiom objects]
const pinyinIndex = {}; // first pinyin syllable -> [idiom objects]

IDIOM_DB.forEach(item => {
    idiomMap[item.idiom] = item;
    const firstChar = item.idiom[0];
    if (!charIndex[firstChar]) charIndex[firstChar] = [];
    charIndex[firstChar].push(item);

    // Extract first pinyin syllable
    const firstPinyin = item.pinyin.split(' ')[0].replace(/[0-9]/g, '');
    if (!pinyinIndex[firstPinyin]) pinyinIndex[firstPinyin] = [];
    pinyinIndex[firstPinyin].push(item);
});

// Extract last pinyin syllable for matching
function getLastPinyin(idiom) {
    const item = idiomMap[idiom];
    if (!item) return '';
    const syllables = item.pinyin.split(' ');
    return syllables[syllables.length - 1].replace(/[0-9]/g, '');
}

function getFirstPinyin(idiom) {
    const item = idiomMap[idiom];
    if (!item) return '';
    return item.pinyin.split(' ')[0].replace(/[0-9]/g, '');
}

// Find idioms that can follow the current one
function findNextIdioms(currentIdiom) {
    const lastChar = currentIdiom[currentIdiom.length - 1];
    const lastPinyin = getLastPinyin(currentIdiom);

    let matches = [];

    // Match by character first
    if (charIndex[lastChar]) {
        charIndex[lastChar].forEach(item => {
            if (item.idiom !== currentIdiom && !usedIdioms.has(item.idiom)) {
                matches.push(item);
            }
        });
    }

    // Match by pinyin (same sound, different character)
    if (pinyinIndex[lastPinyin]) {
        pinyinIndex[lastPinyin].forEach(item => {
            if (item.idiom !== currentIdiom && !usedIdioms.has(item.idiom) && !matches.find(m => m.idiom === item.idiom)) {
                matches.push(item);
            }
        });
    }

    return matches;
}

// === Game State ===
let currentIdiom = null;
let usedIdioms = new Set();
let score = 0;
let chainCount = 0;
let timeLeft = 60;
let timerInterval = null;
let isPlaying = false;
let bestScore = parseInt(localStorage.getItem('idiom_chain_best') || '0');

// === UI Elements ===
const startScreen = document.getElementById('startScreen');
const gameScreen = document.getElementById('gameScreen');
const resultScreen = document.getElementById('resultScreen');
const startBtn = document.getElementById('startBtn');
const submitBtn = document.getElementById('submitBtn');
const idiomInput = document.getElementById('idiomInput');
const currentIdiomEl = document.getElementById('currentIdiom');
const currentPinyinEl = document.getElementById('currentPinyin');
const currentMeaningEl = document.getElementById('currentMeaning');
const targetCharEl = document.getElementById('targetChar');
const scoreDisplay = document.getElementById('scoreDisplay');
const chainDisplay = document.getElementById('chainDisplay');
const timerDisplay = document.getElementById('timerDisplay');
const bestDisplay = document.getElementById('bestDisplay');
const feedbackEl = document.getElementById('feedback');
const chainList = document.getElementById('chainList');

// Initialize best score display
bestDisplay.textContent = bestScore;

// === Game Functions ===
function startGame() {
    // Reset state
    usedIdioms = new Set();
    score = 0;
    chainCount = 0;
    timeLeft = 60;
    isPlaying = true;

    // Pick a random starting idiom
    const startIdx = Math.floor(Math.random() * IDIOM_DB.length);
    currentIdiom = IDIOM_DB[startIdx].idiom;
    usedIdioms.add(currentIdiom);

    // Update UI
    updateCurrentIdiomDisplay();
    scoreDisplay.textContent = '0';
    chainDisplay.textContent = '0';
    timerDisplay.textContent = '60';
    bestDisplay.textContent = bestScore;
    chainList.innerHTML = '';
    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
    idiomInput.value = '';

    // Show game screen
    startScreen.classList.add('hidden');
    resultScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');

    // Start timer
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);

    // Focus input
    idiomInput.focus();
}

function updateTimer() {
    timeLeft--;
    timerDisplay.textContent = timeLeft;

    if (timeLeft <= 10) {
        timerDisplay.classList.add('timer-warning');
    }

    if (timeLeft <= 0) {
        endGame();
    }
}

function updateCurrentIdiomDisplay() {
    const item = idiomMap[currentIdiom];
    if (item) {
        currentIdiomEl.textContent = item.idiom;
        currentPinyinEl.textContent = item.pinyin;
        currentMeaningEl.textContent = item.meaning;
    }
    const lastChar = currentIdiom[currentIdiom.length - 1];
    targetCharEl.textContent = lastChar;
}

function submitIdiom() {
    if (!isPlaying) return;

    const input = idiomInput.value.trim();
    feedbackEl.className = 'feedback';

    // Validate input
    if (!input) {
        feedbackEl.textContent = '请输入一个成语！';
        feedbackEl.classList.add('error');
        return;
    }

    if (input.length < 3) {
        feedbackEl.textContent = '成语至少3个字哦～';
        feedbackEl.classList.add('error');
        return;
    }

    // Check if idiom is in database
    if (!idiomMap[input]) {
        feedbackEl.textContent = '😅 库里没有这个成语，换一个试试？';
        feedbackEl.classList.add('error');
        return;
    }

    // Check if already used
    if (usedIdioms.has(input)) {
        feedbackEl.textContent = '这个成语已经用过了！';
        feedbackEl.classList.add('error');
        return;
    }

    // Check if first character/pinyin matches
    const lastChar = currentIdiom[currentIdiom.length - 1];
    const lastPinyin = getLastPinyin(currentIdiom);
    const inputFirstChar = input[0];
    const inputFirstPinyin = getFirstPinyin(input);

    const charMatch = inputFirstChar === lastChar;
    const pinyinMatch = inputFirstPinyin === lastPinyin;

    if (!charMatch && !pinyinMatch) {
        feedbackEl.textContent = `需要以"${lastChar}"（或同音字）开头的成语哦！`;
        feedbackEl.classList.add('error');
        return;
    }

    // Success!
    usedIdioms.add(input);
    chainCount++;
    score += charMatch ? 10 : 8; // 同字加10分，同音加8分

    // Add to chain display
    const chainItem = document.createElement('span');
    chainItem.className = 'chain-item';
    chainItem.textContent = input;
    if (chainList.children.length > 0) {
        const arrow = document.createElement('span');
        arrow.className = 'chain-arrow';
        arrow.textContent = '→';
        chainList.appendChild(arrow);
    }
    chainList.appendChild(chainItem);
    chainList.scrollTop = chainList.scrollHeight;

    // Update score display
    scoreDisplay.textContent = score;
    chainDisplay.textContent = chainCount;

    feedbackEl.textContent = charMatch ? '✅ 完美接龙！+10分' : '✅ 同音接龙！+8分';
    feedbackEl.classList.add('success');

    // Update current idiom
    currentIdiom = input;
    updateCurrentIdiomDisplay();

    // Check if there are any possible next idioms
    const nextOptions = findNextIdioms(currentIdiom);
    if (nextOptions.length === 0) {
        feedbackEl.textContent = '🎉 太厉害了！没有更多可接的成语了！';
        endGame();
        return;
    }

    // Clear input
    idiomInput.value = '';
    idiomInput.focus();

    // Clear feedback after delay
    setTimeout(() => {
        if (feedbackEl.classList.contains('success')) {
            feedbackEl.textContent = '';
        }
    }, 1500);
}

function endGame() {
    isPlaying = false;
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    // Update best score
    if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('idiom_chain_best', bestScore.toString());
    }

    // Show result
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalChain').textContent = chainCount;
    document.getElementById('finalBest').textContent = bestScore;

    gameScreen.classList.add('hidden');
    resultScreen.classList.remove('hidden');
}

// === Event Listeners ===
idiomInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && isPlaying) {
        submitIdiom();
    }
});

// IME handling for Chinese input
let isComposing = false;
idiomInput.addEventListener('compositionstart', function() {
    isComposing = true;
});
idiomInput.addEventListener('compositionend', function() {
    isComposing = false;
});
idiomInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && isComposing) {
        e.preventDefault();
    }
});
</script>
