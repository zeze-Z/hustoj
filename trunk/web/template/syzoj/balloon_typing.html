    <script>
        // 单词库
        const wordList = ['cat', 'dog', 'sun', 'red', 'run', 'hot', 'big', 'fun', 'top', 'cup', 'hat', 'pen', 'box', 'sit', 'win', 'fly', 'sky', 'map', 'car', 'bus', 'key', 'ice', 'egg', 'fan', 'bed', 'day', 'old', 'new', 'boy', 'girl', 'fish', 'book', 'play', 'star', 'hand', 'tree', 'bird', 'cake', 'ball', 'rain', 'home', 'snow', 'apple', 'green', 'happy', 'water', 'light', 'music', 'dance', 'smile', 'color', 'plant'];
        const phraseList = ['big cat', 'red sun', 'hot dog', 'blue sky', 'old tree', 'new book', 'fun game', 'top hat', 'ice cream', 'green leaf', 'happy dog', 'cold water', 'warm day', 'dark night', 'fast car', 'small fish', 'tall tree', 'long road', 'nice bird', 'white snow', 'rain bow', 'gold star', 'pink cake', 'black cat', 'brown bear', 'red apple', 'sweet home', 'good boy', 'nice girl', 'loud music'];
        const balloonColors = ['balloon-red', 'balloon-blue', 'balloon-green', 'balloon-yellow', 'balloon-purple', 'balloon-pink'];

        // 获取DOM元素
        const diffBtns = document.querySelectorAll('.diff-btn');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const comboEl = document.getElementById('combo');
        const gameArea = document.getElementById('game-area');
        const inputArea = document.getElementById('input-area');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const restartBtn = document.getElementById('restart-btn');
        const feedbackEl = document.getElementById('feedback');
        const gameOverEl = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');

        // 游戏状态变量
        let gameMode = 'easy';
        let score = 0;
        let lives = 3;
        let combo = 0;
        let gameRunning = false;
        let gamePaused = false;
        let balloons = [];
        let spawnInterval = null;
        let cleanupInterval = null;
        let currentDifficulty = {
            spawnRate: 2000,
            floatDuration: 8000,
            maxBalloons: 1,
            wordType: 'letter'
        };

        // 初始化游戏
        function initGame() {
            score = 0;
            lives = 3;
            combo = 0;
            gameRunning = false;
            gamePaused = false;
            
            updateStats();
            clearBalloons();
            inputArea.value = '';
            feedbackEl.textContent = '';
            gameOverEl.style.display = 'none';
            inputArea.disabled = true;
            pauseBtn.disabled = true;
            startBtn.disabled = false;
        }

        // 更新统计显示
        function updateStats() {
            scoreEl.textContent = score;
            livesEl.textContent = '❤️'.repeat(lives);
            comboEl.textContent = combo;
        }

        // 清空所有气球
        function clearBalloons() {
            balloons.forEach(balloon => {
                if (balloon.element && balloon.element.parentNode) {
                    balloon.element.remove();
                }
            });
            balloons = [];
            clearInterval(cleanupInterval);
            cleanupInterval = null;
        }

        // 生成随机字母或单词
        function generateText() {
            if (currentDifficulty.wordType === 'letter') {
                return String.fromCharCode(97 + Math.floor(Math.random() * 26));
            } else if (currentDifficulty.wordType === 'word') {
                // 3-5个字母的单词
                const words = wordList.filter(word => word.length >= 3 && word.length <= 5);
                return words[Math.floor(Math.random() * words.length)];
            } else {
                // 多词短语
                return phraseList[Math.floor(Math.random() * phraseList.length)];
            }
        }

        // 生成随机颜色
        function getRandomColor() {
            return balloonColors[Math.floor(Math.random() * balloonColors.length)];
        }

        // 创建气球（CSS transition 驱动动画，GPU 合成）
        function createBalloon() {
            if (!gameRunning || gamePaused || balloons.length >= currentDifficulty.maxBalloons) return;

            const text = generateText();
            const color = getRandomColor();

            // 创建气球元素
            const balloonEl = document.createElement('div');
            balloonEl.className = `balloon ${color}`;

            const balloonBody = document.createElement('div');
            balloonBody.className = 'balloon-body';
            balloonBody.textContent = text;

            const string = document.createElement('div');
            string.className = 'balloon-string';

            balloonEl.appendChild(balloonBody);
            balloonEl.appendChild(string);

            // 随机水平位置
            const maxLeft = gameArea.clientWidth - 70;
            const left = Math.random() * maxLeft;
            balloonEl.style.left = `${left}px`;
            balloonEl.style.bottom = '0px';

            gameArea.appendChild(balloonEl);

            const duration = currentDifficulty.floatDuration / 1000; // 秒

            // 添加到气球数组（先存再触发动画，确保 transitionend 监听在前）
            const balloon = {
                element: balloonEl,
                text: text,
                popped: false,
                done: false,
                startTime: Date.now(),
                duration: duration
            };

            // transitionend 兜底：动画自然结束时标记 done
            balloonEl.addEventListener('transitionend', function handler(e) {
                if (e.propertyName === 'transform' && !balloon.popped) {
                    balloon.done = true;
                    balloonEl.removeEventListener('transitionend', handler);
                }
            });

            // 设置 CSS transition 并触发浮动（从 100px → -500px）
            balloonEl.style.transition = `transform ${duration}s linear`;
            // 强制 reflow 确保初始位置生效
            balloonEl.offsetHeight; // eslint-disable-line no-unused-expressions
            balloonEl.style.transform = 'translateY(-500px)';

            balloons.push(balloon);
        }

        // 爆炸动画（animationend 事件清理，无需 setTimeout）
        function createExplosion(x, y) {
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            explosion.style.left = `${x - 50}px`;
            explosion.style.top = `${y - 50}px`;
            explosion.innerHTML = '💥';
            explosion.style.fontSize = '50px';

            explosion.addEventListener('animationend', () => explosion.remove());
            // 兜底：万一 animationend 未触发（概率极低），800ms 后清理
            setTimeout(() => { if (explosion.parentNode) explosion.remove(); }, 800);

            gameArea.appendChild(explosion);
        }

        // 击破气球（标记 popped，由 cleanupBalloons 统一清理）
        function popBalloon(balloon) {
            balloon.popped = true;
            const el = balloon.element;

            // 停止浮动 transition，锁定当前位置
            const rect = el.getBoundingClientRect();
            const gameRect = gameArea.getBoundingClientRect();
            el.style.transition = 'none';
            el.style.transform = `translateY(${rect.top - gameRect.top - 100}px)`;

            // 播放击破动画
            el.classList.add('pop');
            el.addEventListener('animationend', () => el.remove());

            // 爆炸效果
            createExplosion(rect.left - gameRect.left + 30, rect.top - gameRect.top + 35);

            // 更新得分
            combo++;
            const baseScore = 10;
            const comboBonus = Math.floor(combo / 5) * 5;
            score += baseScore + comboBonus;

            updateStats();
            feedbackEl.textContent = `+${baseScore + comboBonus}分！连击×${combo} 🔥`;
            feedbackEl.style.color = '#66bb6a';
        }

        // 气球到达顶部（标记 done，由 cleanupBalloons 统一清理）
        function balloonMissed(balloon) {
            balloon.done = true;
            lives--;
            combo = 0;

            updateStats();
            feedbackEl.textContent = '气球飞走了 😢';
            feedbackEl.style.color = '#ef5350';

            if (balloon.element.parentNode) {
                balloon.element.remove();
            }

            if (lives <= 0) {
                endGame();
            }
        }

        // 定期清理已完成/已击破的气球（替代每帧 splice）
        function cleanupBalloons() {
            for (let i = balloons.length - 1; i >= 0; i--) {
                if (balloons[i].done || balloons[i].popped) {
                    balloons.splice(i, 1);
                }
            }
        }

        // 游戏主循环（轻量兜底：检查 CSS transition 可能漏掉的到期气球）
        function gameLoop() {
            if (!gameRunning || gamePaused) return;

            const now = Date.now();
            for (let i = balloons.length - 1; i >= 0; i--) {
                const balloon = balloons[i];
                if (balloon.popped || balloon.done) continue;

                // 超时兜底：transitionend 可能因浏览器原因未触发
                if (now - balloon.startTime > balloon.duration * 1000 + 200) {
                    balloonMissed(balloon);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // 开始游戏
        function startGame() {
            if (gameRunning) return;
            
            gameRunning = true;
            gamePaused = false;
            inputArea.disabled = false;
            pauseBtn.disabled = false;
            startBtn.disabled = true;
            inputArea.focus();
            
            // 开始生成气球
            spawnInterval = setInterval(createBalloon, currentDifficulty.spawnRate);

            // 定期清理已结束的气球（1秒一次，替代每帧 splice）
            cleanupInterval = setInterval(cleanupBalloons, 1000);

            // 启动兜底检查循环
            requestAnimationFrame(gameLoop);
        }

        // 暂停游戏（冻结/恢复 CSS transition）
        function togglePause() {
            if (!gameRunning) return;

            gamePaused = !gamePaused;
            pauseBtn.textContent = gamePaused ? '继续' : '暂停';

            if (gamePaused) {
                // 冻结每个气球的当前位置
                const now = Date.now();
                balloons.forEach(balloon => {
                    if (balloon.popped || balloon.done) return;
                    const elapsed = (now - balloon.startTime) / 1000;
                    balloon.remainingTime = Math.max(0, balloon.duration - elapsed);
                    // 读取当前渲染位置并冻结
                    const currentY = getComputedStyle(balloon.element).transform;
                    balloon.element.style.transition = 'none';
                    balloon.element.style.transform = currentY === 'none' ? 'translateY(100px)' : currentY;
                });
                feedbackEl.textContent = '游戏已暂停 ⏸️';
            } else {
                // 恢复：从冻结位置续播剩余时间
                balloons.forEach(balloon => {
                    if (balloon.popped || balloon.done) return;
                    if (balloon.remainingTime <= 0) {
                        balloonMissed(balloon);
                        return;
                    }
                    balloon.startTime = Date.now();
                    balloon.duration = balloon.remainingTime;
                    balloon.element.style.transition = `transform ${balloon.remainingTime}s linear`;
                    balloon.element.offsetHeight; // 强制 reflow
                    balloon.element.style.transform = 'translateY(-500px)';
                });
                feedbackEl.textContent = '';
                requestAnimationFrame(gameLoop);
                inputArea.focus();
            }
        }

        // 结束游戏
        function endGame() {
            gameRunning = false;

            clearInterval(spawnInterval);
            clearInterval(cleanupInterval);
            spawnInterval = null;
            cleanupInterval = null;

            inputArea.disabled = true;
            pauseBtn.disabled = true;

            finalScoreEl.textContent = score;
            gameOverEl.style.display = 'block';
        }

        // 切换难度
        function changeDifficulty(e) {
            if (gameRunning) {
                if (!confirm('切换难度将重新开始游戏，确定吗？')) {
                    return;
                }
                initGame();
            }

            // 移除所有active类
            diffBtns.forEach(btn => btn.classList.remove('active'));
            
            // 添加当前active类
            const btn = e.target;
            btn.classList.add('active');
            
            gameMode = btn.dataset.mode;
            
            // 设置难度参数
            switch (gameMode) {
                case 'easy':
                    currentDifficulty = {
                        spawnRate: 2200,
                        floatDuration: 10000,
                        maxBalloons: 1,
                        wordType: 'letter'
                    };
                    break;
                case 'normal':
                    currentDifficulty = {
                        spawnRate: 2800,
                        floatDuration: 9000,
                        maxBalloons: 2,
                        wordType: 'word'
                    };
                    break;
                case 'hard':
                    currentDifficulty = {
                        spawnRate: 3000,
                        floatDuration: 10000,
                        maxBalloons: 2,
                        wordType: 'phrase'
                    };
                    break;
            }
        }

        // 处理输入
        function handleInput(e) {
            if (!gameRunning || gamePaused) return;
            
            const input = inputArea.value.trim().toLowerCase();
            if (!input) return;
            
            // 查找匹配的气球
            for (let i = 0; i < balloons.length; i++) {
                if (balloons[i].text.toLowerCase() === input && !balloons[i].popped) {
                    popBalloon(balloons[i]);
                    inputArea.value = '';
                    return;
                }
            }
            
            // 没有匹配 - 只在有实际输入内容时才算打错
            // 部分匹配不算错，让用户继续输入
            const hasPartialMatch = balloons.some(b => !b.popped && !b.done && b.text.toLowerCase().startsWith(input));
            if (!hasPartialMatch && input.length > 1) {
                combo = 0;
                updateStats();
                feedbackEl.textContent = '打错啦 ❌';
                feedbackEl.style.color = '#ef5350';
                inputArea.value = '';
            }
        }

        // 事件监听
        diffBtns.forEach(btn => btn.addEventListener('click', changeDifficulty));
        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);
        restartBtn.addEventListener('click', initGame);
        inputArea.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleInput();
            }
        });
        // 实时匹配：每次输入都检查
        inputArea.addEventListener('input', () => {
            if (!gameRunning || gamePaused) return;
            const input = inputArea.value.trim().toLowerCase();
            if (!input) return;
            // 完全匹配则击破
            for (let i = 0; i < balloons.length; i++) {
                if (balloons[i].text.toLowerCase() === input && !balloons[i].popped) {
                    popBalloon(balloons[i]);
                    inputArea.value = '';
                    return;
                }
            }
        });

        // 初始化游戏
        initGame();
    </script>
</div>
