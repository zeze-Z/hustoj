<script>
    // ===== DOM 元素 =====
    const diffBtns = document.querySelectorAll('.diff-btn');
    const minesLeftEl = document.getElementById('mines-left');
    const timerEl = document.getElementById('timer');
    const restartBtn = document.getElementById('restart-btn');
    const gameBoardEl = document.getElementById('game-board');
    const gameMessageEl = document.getElementById('game-message');

    // ===== 游戏状态 =====
    let rows = 6, cols = 6, minesCount = 6;
    let board = [];
    let revealedCount = 0, flaggedCount = 0;
    let gameOver = false, firstClick = true;
    let timer = 0, timerInterval = null;

    // ===== 通用辅助函数 =====
    function bounceStat(el) {
        el.classList.remove('stat-bounce');
        void el.offsetWidth;
        el.classList.add('stat-bounce');
        el.addEventListener('animationend', () => el.classList.remove('stat-bounce'), { once: true });
    }

    function addRipple(e, btn) {
        const rect = btn.getBoundingClientRect();
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        const size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
        ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
        btn.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove());
    }

    // ===== 礼花（从弹窗中心绽开）=====
    function launchConfettiFromCard() {
        if (typeof confetti !== 'function') return;
        const card = document.querySelector('.game-over-card');
        if (!card) { launchConfetti(); return; }
        const rect = card.getBoundingClientRect();
        const x = (rect.left + rect.width / 2) / window.innerWidth;
        const y = (rect.top + rect.height / 2) / window.innerHeight;
        confetti({ particleCount: 120, spread: 80, origin: { x, y }, colors: ['#22c55e','#f59e0b','#ef4444','#fbbf24','#86efac'] });
        setTimeout(() => confetti({ particleCount: 60, spread: 60, origin: { x, y: y - 0.05 }, colors: ['#22c55e','#f59e0b','#ef4444'] }), 250);
    }
    // 优先用页面内函数覆盖共享 launchConfetti
    if (typeof window.launchConfetti === 'function') {
        window._msOrigLaunch = window.launchConfetti;
    }
    window.launchConfetti = launchConfettiFromCard;

    // ===== 初始化游戏 =====
    function initGame() {
        board = [];
        revealedCount = 0;
        flaggedCount = 0;
        gameOver = false;
        firstClick = true;
        timer = 0;

        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

        minesLeftEl.textContent = minesCount;
        timerEl.textContent = '0';
        gameMessageEl.textContent = '';
        gameMessageEl.className = 'game-message';
        document.getElementById('game-over-screen').classList.add('hidden');

        createBoard();
        startTimer();
    }

    // ===== 创建棋盘 =====
    function createBoard() {
        gameBoardEl.innerHTML = '';
        gameBoardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

        board = Array(rows).fill().map(() => Array(cols).fill({
            isMine: false, isRevealed: false, isFlagged: false, adjacentMines: 0
        }));

        for (let i = 0; i < rows; i++) {
            for (let j = 0; j < cols; j++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = i;
                cell.dataset.col = j;
                cell.addEventListener('click', () => handleCellClick(i, j));
                cell.addEventListener('contextmenu', (e) => { e.preventDefault(); handleRightClick(i, j); });
                gameBoardEl.appendChild(cell);
            }
        }
    }

    // ===== 布置地雷 =====
    function placeMines(firstRow, firstCol) {
        let placed = 0;
        while (placed < minesCount) {
            const r = Math.floor(Math.random() * rows);
            const c = Math.floor(Math.random() * cols);
            const near = Math.abs(r - firstRow) <= 1 && Math.abs(c - firstCol) <= 1;
            if (!board[r][c].isMine && !near) {
                board[r][c] = { ...board[r][c], isMine: true };
                placed++;
            }
        }
        calculateAdjacentMines();
    }

    function calculateAdjacentMines() {
        for (let i = 0; i < rows; i++) {
            for (let j = 0; j < cols; j++) {
                if (board[i][j].isMine) continue;
                let count = 0;
                for (let di = -1; di <= 1; di++) {
                    for (let dj = -1; dj <= 1; dj++) {
                        if (di === 0 && dj === 0) continue;
                        const ni = i + di, nj = j + dj;
                        if (ni >= 0 && ni < rows && nj >= 0 && nj < cols && board[ni][nj].isMine) count++;
                    }
                }
                board[i][j] = { ...board[i][j], adjacentMines: count };
            }
        }
    }

    // ===== 点击处理 =====
    function handleCellClick(row, col) {
        if (gameOver || board[row][col].isRevealed || board[row][col].isFlagged) return;

        if (firstClick) { placeMines(row, col); firstClick = false; }

        const cell = board[row][col];

        if (cell.isMine) {
            gameOver = true;
            stopTimer();
            revealAllMines();
            gameMessageEl.textContent = '💥 游戏结束！你踩到地雷了';
            gameMessageEl.className = 'game-message game-lose';
            showGameOver(false);
            return;
        }

        revealCell(row, col);
        checkWin();
    }

    function handleRightClick(row, col) {
        if (gameOver || board[row][col].isRevealed) return;
        const cell = board[row][col];
        const cellEl = getCellElement(row, col);

        if (cell.isFlagged) {
            board[row][col] = { ...cell, isFlagged: false };
            cellEl.classList.remove('flagged');
            cellEl.textContent = '';
            flaggedCount--;
        } else {
            board[row][col] = { ...cell, isFlagged: true };
            cellEl.classList.add('flagged');
            cellEl.textContent = '🚩';
            flaggedCount++;
        }
        minesLeftEl.textContent = Math.max(0, minesCount - flaggedCount);
        bounceStat(minesLeftEl.closest('.stat-item'));
    }

    function revealCell(row, col) {
        if (row < 0 || row >= rows || col < 0 || col >= cols) return;
        if (board[row][col].isRevealed || board[row][col].isFlagged) return;

        const cell = board[row][col];
        const cellEl = getCellElement(row, col);

        board[row][col] = { ...cell, isRevealed: true };
        cellEl.classList.add('revealed');
        revealedCount++;

        if (cell.adjacentMines > 0) {
            cellEl.textContent = cell.adjacentMines;
            cellEl.classList.add(`num-${cell.adjacentMines}`);
        } else {
            for (let di = -1; di <= 1; di++) {
                for (let dj = -1; dj <= 1; dj++) {
                    if (di === 0 && dj === 0) continue;
                    revealCell(row + di, col + dj);
                }
            }
        }
    }

    function revealAllMines() {
        for (let i = 0; i < rows; i++) {
            for (let j = 0; j < cols; j++) {
                if (board[i][j].isMine) {
                    const cellEl = getCellElement(i, j);
                    cellEl.classList.add('revealed', 'mine');
                    cellEl.textContent = '💣';
                }
            }
        }
    }

    function checkWin() {
        if (revealedCount === rows * cols - minesCount) {
            gameOver = true;
            stopTimer();
            gameMessageEl.textContent = `🎉 恭喜你！胜利了！用时 ${timer} 秒`;
            gameMessageEl.className = 'game-message game-win';
            showGameOver(true);

            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    if (board[i][j].isMine && !board[i][j].isFlagged) {
                        const cellEl = getCellElement(i, j);
                        cellEl.classList.add('flagged');
                        cellEl.textContent = '🚩';
                    }
                }
            }
        }
    }

    // ===== 显示结束弹窗（弹窗 + 礼花同时出现）=====
    function showGameOver(isWin) {
        const screen = document.getElementById('game-over-screen');
        document.getElementById('game-over-title').textContent = isWin ? '🎉 恭喜胜利！' : '💥 游戏结束';
        document.getElementById('game-over-msg').textContent = isWin ? '你成功排除了所有地雷！' : '很遗憾，你踩到地雷了！';
        document.getElementById('final-time').textContent = timer;
        screen.classList.remove('hidden');
        if (isWin) {
            setTimeout(launchConfettiFromCard, 50);
        }
    }

    function getCellElement(row, col) {
        return document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
    }

    // ===== 计时器 =====
    function startTimer() {
        timerInterval = setInterval(() => { timer++; timerEl.textContent = timer; }, 1000);
    }
    function stopTimer() {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    // ===== 切换难度 =====
    function changeDifficulty(e) {
        if (!confirm('切换难度将重新开始游戏，确定吗？')) return;
        diffBtns.forEach(btn => btn.classList.remove('active'));
        const btn = e.target;
        btn.classList.add('active');
        rows = parseInt(btn.dataset.rows);
        cols = parseInt(btn.dataset.cols);
        minesCount = parseInt(btn.dataset.mines);
        addRipple(e, btn);
        initGame();
    }

    // ===== 事件监听 =====
    diffBtns.forEach(btn => btn.addEventListener('click', changeDifficulty));
    restartBtn.addEventListener('click', (e) => { addRipple(e, restartBtn); initGame(); });
    document.getElementById('overlay-restart-btn').addEventListener('click', function(e) {
        addRipple(e, this);
        document.getElementById('game-over-screen').classList.add('hidden');
        initGame();
    });

    // ===== 启动 =====
    initGame();
</script>
