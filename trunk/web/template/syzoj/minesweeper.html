                <button class="btn-primary" id="overlay-restart-btn" style="margin-top:1rem;">再来一局</button>

    <script>
        // 获取DOM元素
        const diffBtns = document.querySelectorAll('.diff-btn');
        const minesLeftEl = document.getElementById('mines-left');
        const timerEl = document.getElementById('timer');
        const restartBtn = document.getElementById('restart-btn');
        const gameBoardEl = document.getElementById('game-board');
        const gameMessageEl = document.getElementById('game-message');

        // 游戏状态变量
        let rows = 9;
        let cols = 9;
        let minesCount = 10;
        let board = [];
        let revealedCount = 0;
        let flaggedCount = 0;
        let gameOver = false;
        let firstClick = true;
        let timer = 0;
        let timerInterval = null;

        // 初始化游戏
        function initGame() {
            // 重置状态
            board = [];
            revealedCount = 0;
            flaggedCount = 0;
            gameOver = false;
            firstClick = true;
            timer = 0;
            
            // 清除定时器
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            
            // 更新UI
            minesLeftEl.textContent = minesCount;
            timerEl.textContent = timer;
            gameMessageEl.textContent = '';
            gameMessageEl.className = 'game-message';
            document.getElementById('game-over-screen').classList.add('hidden');

            // 创建棋盘
            createBoard();
            
            // 开始计时器
            startTimer();
        }

        // 创建棋盘
        function createBoard() {
            gameBoardEl.innerHTML = '';
            gameBoardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            
            // 初始化二维数组
            board = Array(rows).fill().map(() => Array(cols).fill({
                isMine: false,
                isRevealed: false,
                isFlagged: false,
                adjacentMines: 0
            }));
            
            // 创建单元格元素
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    
                    // 左键点击事件
                    cell.addEventListener('click', () => handleCellClick(i, j));
                    
                    // 右键点击事件（标记地雷）
                    cell.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleRightClick(i, j);
                    });
                    
                    gameBoardEl.appendChild(cell);
                }
            }
        }

        // 布置地雷（第一次点击后调用，确保第一次点击不是雷）
        function placeMines(firstRow, firstCol) {
            let minesPlaced = 0;
            
            while (minesPlaced < minesCount) {
                const randRow = Math.floor(Math.random() * rows);
                const randCol = Math.floor(Math.random() * cols);
                
                // 避免在第一次点击的位置和周围3x3区域布置地雷
                const isNearFirstClick = Math.abs(randRow - firstRow) <= 1 && Math.abs(randCol - firstCol) <= 1;
                
                if (!board[randRow][randCol].isMine && !isNearFirstClick) {
                    board[randRow][randCol] = { ...board[randRow][randCol], isMine: true };
                    minesPlaced++;
                }
            }
            
            // 计算每个单元格周围的地雷数
            calculateAdjacentMines();
        }

        // 计算相邻地雷数
        function calculateAdjacentMines() {
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    if (!board[i][j].isMine) {
                        let count = 0;
                        // 检查周围8个方向
                        for (let di = -1; di <= 1; di++) {
                            for (let dj = -1; dj <= 1; dj++) {
                                if (di === 0 && dj === 0) continue;
                                const ni = i + di;
                                const nj = j + dj;
                                if (ni >= 0 && ni < rows && nj >=0 && nj < cols && board[ni][nj].isMine) {
                                    count++;
                                }
                            }
                        }
                        board[i][j] = { ...board[i][j], adjacentMines: count };
                    }
                }
            }
        }

        // 处理单元格点击
        function handleCellClick(row, col) {
            if (gameOver || board[row][col].isRevealed || board[row][col].isFlagged) return;
            
            // 第一次点击时布置地雷
            if (firstClick) {
                placeMines(row, col);
                firstClick = false;
            }
            
            const cell = board[row][col];
            
            if (cell.isMine) {
                // 踩到地雷，游戏结束
                gameOver = true;
                stopTimer();
                revealAllMines();
                gameMessageEl.textContent = '💥 游戏结束！你踩到地雷了';
                gameMessageEl.className = 'game-message game-lose';

                // 显示游戏结束弹窗
                document.getElementById('game-over-title').textContent = '💥 游戏结束';
                document.getElementById('game-over-msg').textContent = '很遗憾，你踩到地雷了！';
                document.getElementById('final-time').textContent = timer;
                document.getElementById('game-over-screen').classList.remove('hidden');
                return;
            }
            
            // 翻开单元格
            revealCell(row, col);
            
            // 检查是否胜利
            checkWin();
        }

        // 处理右键点击（标记地雷）
        function handleRightClick(row, col) {
            if (gameOver || board[row][col].isRevealed) return;
            
            const cell = board[row][col];
            const cellEl = getCellElement(row, col);
            
            if (cell.isFlagged) {
                // 取消标记
                board[row][col] = { ...cell, isFlagged: false };
                cellEl.classList.remove('flagged');
                cellEl.textContent = '';
                flaggedCount--;
            } else {
                // 添加标记
                board[row][col] = { ...cell, isFlagged: true };
                cellEl.classList.add('flagged');
                cellEl.textContent = '🚩';
                flaggedCount++;
            }
            
            // 更新剩余雷数显示
            minesLeftEl.textContent = Math.max(0, minesCount - flaggedCount);
        }

        // 翻开单元格
        function revealCell(row, col) {
            if (row < 0 || row >= rows || col < 0 || col >= cols) return;
            if (board[row][col].isRevealed || board[row][col].isFlagged) return;
            
            const cell = board[row][col];
            const cellEl = getCellElement(row, col);
            
            board[row][col] = { ...cell, isRevealed: true };
            cellEl.classList.add('revealed');
            revealedCount++;
            
            if (cell.adjacentMines > 0) {
                cellEl.textContent = cell.adjacentMines;
                cellEl.classList.add(`num-${cell.adjacentMines}`);
            } else {
                // 如果是空白格，自动翻开周围8个单元格
                for (let di = -1; di <= 1; di++) {
                    for (let dj = -1; dj <= 1; dj++) {
                        if (di === 0 && dj === 0) continue;
                        revealCell(row + di, col + dj);
                    }
                }
            }
        }

        // 显示所有地雷
        function revealAllMines() {
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    if (board[i][j].isMine) {
                        const cellEl = getCellElement(i, j);
                        cellEl.classList.add('revealed', 'mine');
                        cellEl.textContent = '💣';
                    }
                }
            }
        }

        // 检查是否胜利
        function checkWin() {
            // 所有非地雷单元格都被翻开
            if (revealedCount === rows * cols - minesCount) {
                gameOver = true;
                stopTimer();
                gameMessageEl.textContent = `🎉 恭喜你！胜利了！用时 ${timer} 秒`;
                gameMessageEl.className = 'game-message game-win';

                // 显示游戏结束弹窗
                document.getElementById('game-over-title').textContent = '🎉 恭喜胜利！';
                document.getElementById('game-over-msg').textContent = '你成功排除了所有地雷！';
                document.getElementById('final-time').textContent = timer;
                document.getElementById('game-over-screen').classList.remove('hidden');
                
                // 标记所有未标记的地雷
                for (let i = 0; i < rows; i++) {
                    for (let j = 0; j < cols; j++) {
                        if (board[i][j].isMine && !board[i][j].isFlagged) {
                            const cellEl = getCellElement(i, j);
                            cellEl.classList.add('flagged');
                            cellEl.textContent = '🚩';
                        }
                    }
                }
            }
        }

        // 获取单元格元素
        function getCellElement(row, col) {
            return document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
        }

        // 开始计时器
        function startTimer() {
            timerInterval = setInterval(() => {
                timer++;
                timerEl.textContent = timer;
            }, 1000);
        }

        // 停止计时器
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // 切换难度
        function changeDifficulty(e) {
            if (!confirm('切换难度将重新开始游戏，确定吗？')) {
                return;
            }

            // 移除所有active类
            diffBtns.forEach(btn => btn.classList.remove('active'));
            
            // 添加当前active类
            const btn = e.target;
            btn.classList.add('active');
            
            // 更新游戏参数
            rows = parseInt(btn.dataset.rows);
            cols = parseInt(btn.dataset.cols);
            minesCount = parseInt(btn.dataset.mines);
            
            // 重新初始化游戏
            initGame();
        }

        // 事件监听
        diffBtns.forEach(btn => btn.addEventListener('click', changeDifficulty));
        restartBtn.addEventListener('click', initGame);
        
        // 弹窗重新开始按钮
        document.getElementById('overlay-restart-btn').addEventListener('click', function() {
            document.getElementById('game-over-screen').classList.add('hidden');
            initGame();
        });

        // 初始化游戏
        initGame();
    </script>
</div>
