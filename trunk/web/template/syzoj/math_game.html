                <p>通过关卡：<strong id="final-levels">0</strong> 关</p>
                <p>本关正确率：<strong id="final-accuracy">0%</strong></p>
                <button class="btn-primary" id="overlay-restart-btn" style="margin-top:1rem;">再来一局</button>
            </div>
        </div>
    </div>
    </div>

    <script>
        // 获取DOM元素
        const difficultyBadgeEl = document.getElementById('difficulty-badge');
        const levelEl = document.getElementById('level');
        const scoreEl = document.getElementById('score');
        const remainingEl = document.getElementById('remaining');
        const comboEl = document.getElementById('combo');
        const questionEl = document.getElementById('question');
        const inputArea = document.getElementById('input-area');
        const submitBtn = document.getElementById('submit-btn');
        const resetBtn = document.getElementById('reset-btn');
        const feedbackEl = document.getElementById('feedback');
        const gameResultEl = document.getElementById('game-result');
        const gameOverScreen = document.getElementById('game-over-screen');

        // 游戏状态变量
        let level = 1;
        let score = 0;
        let remaining = 5;
        let combo = 0;
        let correctCount = 0;
        let currentAnswer = 0;
        let gameOver = false;

        // 难度配置
        const difficultyConfig = {
            1: { name: '简单难度', className: 'difficulty-easy', ops: ['+', '-'], maxNum: 99, minResult: 0 },
            2: { name: '普通难度', className: 'difficulty-normal', ops: ['+', '-', '*'], maxNum: 99, minResult: null },
            3: { name: '困难难度', className: 'difficulty-hard', ops: ['+', '-', '*', '/'], maxNum: 999, minResult: null }
        };

        // 获取当前难度
        function getCurrentDifficulty() {
            if (level <= 3) return difficultyConfig[1];
            if (level <= 6) return difficultyConfig[2];
            return difficultyConfig[3];
        }

        // 生成随机题目
        function generateQuestion() {
            const difficulty = getCurrentDifficulty();
            const ops = difficulty.ops;
            const op = ops[Math.floor(Math.random() * ops.length)];
            const maxNum = difficulty.maxNum;

            let a, b, answer;

            switch (op) {
                case '+':
                    a = Math.floor(Math.random() * maxNum) + 1;
                    b = Math.floor(Math.random() * maxNum) + 1;
                    answer = a + b;
                    break;
                case '-':
                    a = Math.floor(Math.random() * maxNum) + 1;
                    b = Math.floor(Math.random() * maxNum) + 1;
                    if (difficulty.minResult === 0 && a < b) {
                        [a, b] = [b, a];
                    }
                    answer = a - b;
                    break;
                case '*':
                    a = Math.floor(Math.random() * maxNum) + 1;
                    b = Math.floor(Math.random() * 30) + 1; // 乘法控制数字不要太大
                    answer = a * b;
                    break;
                case '/':
                    // 除法确保整除
                    b = Math.floor(Math.random() * 50) + 1;
                    const multiplier = Math.floor(Math.random() * (maxNum / b)) + 1;
                    a = b * multiplier;
                    answer = multiplier;
                    break;
            }

            currentAnswer = answer;
            // 把 * / 换成更友好的显示符号
            const displayOp = op === '*' ? '×' : (op === '/' ? '÷' : op);
            questionEl.textContent = `${a} ${displayOp} ${b} = ?`;
        }

        // 更新UI显示
        function updateUI() {
            const difficulty = getCurrentDifficulty();
            difficultyBadgeEl.textContent = difficulty.name;
            difficultyBadgeEl.className = 'difficulty-badge ' + difficulty.className;

            levelEl.textContent = level;
            scoreEl.textContent = score;
            remainingEl.textContent = remaining;
            comboEl.textContent = combo;
        }

        // 初始化游戏
        function initGame() {
            level = 1;
            score = 0;
            remaining = 5;
            combo = 0;
            correctCount = 0;
            gameOver = false;

            generateQuestion();
            updateUI();

            inputArea.value = '';
            feedbackEl.textContent = '';
            feedbackEl.className = 'feedback';
            gameResultEl.textContent = '';
            gameResultEl.className = 'game-result';
            gameOverScreen.classList.add('hidden');
            inputArea.disabled = false;
            submitBtn.disabled = false;
            inputArea.focus();
        }

        // 处理下一关
        function nextLevel() {
            level++;
            remaining = 5;
            correctCount = 0;
            gameResultEl.textContent = `🎉 恭喜通过第${level-1}关！进入第${level}关，难度提升！`;
            gameResultEl.className = 'game-result game-win show-result';
            generateQuestion();
            updateUI();
            bounceStat(levelEl);

            // 3秒后清除提示
            setTimeout(() => {
                gameResultEl.textContent = '';
                gameResultEl.className = 'game-result';
            }, 3000);
        }

        // 处理答题
        function handleSubmit() {
            if (gameOver) return;

            const userAnswer = parseInt(inputArea.value.trim());

            // 验证输入
            if (isNaN(userAnswer)) {
                feedbackEl.textContent = '⚠️ 请输入有效的数字！';
                feedbackEl.className = 'feedback wrong';
                requestAnimationFrame(() => feedbackEl.classList.add('show-feedback'));
                flashInput('hint');
                inputArea.value = '';
                inputArea.focus();
                return;
            }

            // 按钮波纹
            createRipple(submitBtn);

            if (userAnswer === currentAnswer) {
                // 答对了
                feedbackEl.textContent = '✅ 回答正确！';
                feedbackEl.className = 'feedback correct';
                requestAnimationFrame(() => feedbackEl.classList.add('show-feedback'));
                flashInput('correct');
                questionEl.classList.add('flash-correct');
                setTimeout(() => questionEl.classList.remove('flash-correct'), 800);
                correctCount++;
                combo++;

                // 计算得分：基础10分 + 连击加分
                let addScore = 10 + Math.floor(combo / 3) * 5;
                score += addScore;
                bounceStat(scoreEl);
                if (combo > 0) bounceStat(comboEl);
            } else {
                // 答错了
                feedbackEl.textContent = `❌ 回答错误，正确答案是 ${currentAnswer}`;
                feedbackEl.className = 'feedback wrong';
                requestAnimationFrame(() => feedbackEl.classList.add('show-feedback'));
                flashInput('wrong');
                questionEl.classList.add('flash-wrong');
                setTimeout(() => questionEl.classList.remove('flash-wrong'), 800);
                combo = 0;
                score = Math.max(0, score - 5); // 得分不低于0
                bounceStat(comboEl);
            }

            remaining--;
            bounceStat(remainingEl);
            updateUI();

            // 检查本关是否结束
            if (remaining === 0) {
                if (correctCount >= 4) {
                    // 闯关成功
                    // 通关烟花效果
                    launchConfetti();
                    setTimeout(() => {
                        nextLevel();
                    }, 1500);
                } else {
                    // 闯关失败
                    gameOver = true;
                    inputArea.disabled = true;
                    submitBtn.disabled = true;
                    gameResultEl.textContent = `😔 闯关失败！本关答对${correctCount}题，总得分${score}，继续加油哦！`;
                    gameResultEl.className = 'game-result game-lose show-result';

                    // 显示游戏结束弹窗
                    document.getElementById('final-score').textContent = score;
                    document.getElementById('final-levels').textContent = level - 1;
                    document.getElementById('final-accuracy').textContent = Math.round(correctCount / 5 * 100) + '%';
                    gameOverScreen.classList.remove('hidden');
                }
            } else {
                // 继续下一题
                setTimeout(() => {
                    generateQuestion();
                    inputArea.value = '';
                    feedbackEl.textContent = '';
                    feedbackEl.className = 'feedback';
                    inputArea.focus();
                }, 1500);
            }
        }

        // 事件监听
        submitBtn.addEventListener('click', handleSubmit);
        resetBtn.addEventListener('click', initGame);

        // 回车键提交
        inputArea.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSubmit();
            }
        });

        // 弹窗重新开始按钮
        document.getElementById('overlay-restart-btn').addEventListener('click', function() {
            gameOverScreen.classList.add('hidden');
            initGame();
        });

        // ===== �效辅助函数 =====

        // 输入框状态闪烁
        function flashInput(type) {
            inputArea.classList.remove('flash-correct','flash-wrong','flash-hint');
            void inputArea.offsetWidth; // 强制 reflow
            inputArea.classList.add('flash-' + type);
            setTimeout(() => inputArea.classList.remove('flash-correct','flash-wrong','flash-hint'), 1200);
        }

        // 统计数字跳动
        function bounceStat(el) {
            el.classList.remove('stat-bounce');
            void el.offsetWidth;
            el.classList.add('stat-bounce');
            el.addEventListener('animationend', () => el.classList.remove('stat-bounce'), { once: true });
        }

        // 按钮波纹
        function createRipple(btn) {
            const existing = btn.querySelector('.ripple');
            if (existing) existing.remove();
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const rect = btn.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (rect.width / 2 - size / 2) + 'px';
            ripple.style.top = (rect.height / 2 - size / 2) + 'px';
            btn.appendChild(ripple);
            ripple.addEventListener('animationend', () => ripple.remove());
        }

        // 通关撒花 - 复用项目公共 game_confetti.js
        // launchConfetti() 由 game_confetti.js 提供

        // 初始化游戏
        initGame();
    </script>
</div>
