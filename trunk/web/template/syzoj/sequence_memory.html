<script>
const colors = ['red', 'yellow', 'blue', 'green'];
let sequence = [];
let playerSequence = [];
let level = 1;
let score = 0;
let highScore = localStorage.getItem('sequenceMemoryHighScore') || 0;
let isPlayingSequence = false;

const levelEl = document.getElementById('level');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('high-score');
const instructionEl = document.getElementById('instruction');
const startButton = document.getElementById('start-button');
const colorButtons = document.querySelectorAll('.color-button');
const gameOverModal = document.getElementById('game-over-modal');
const finalScoreEl = document.getElementById('final-score');
const finalLevelEl = document.getElementById('final-level');
const playAgainButton = document.getElementById('play-again-button');

highScoreEl.textContent = highScore;

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

/* 统计数字 bounce 动效 */
function bounceStat(el) {
    el.classList.remove('stat-bounce');
    void el.offsetWidth;
    el.classList.add('stat-bounce');
    el.addEventListener('animationend', () => el.classList.remove('stat-bounce'), { once: true });
}

/* 反馈提示弹入 */
function showInstruction(text, type) {
    instructionEl.textContent = text;
    instructionEl.classList.remove('show-feedback', 'sm-success', 'sm-error', 'sm-watch');
    void instructionEl.offsetWidth;
    instructionEl.classList.add('show-feedback');
    if (type) instructionEl.classList.add('sm-' + type);
}

/* 按钮波纹 */
function addRipple(button, e) {
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const rect = button.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    button.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove());
}

async function playSequence() {
    isPlayingSequence = true;
    disableButtons();
    showInstruction('仔细看灯亮顺序 👀', 'watch');

    await sleep(700);

    for (let i = 0; i < sequence.length; i++) {
        const color = sequence[i];
        const button = document.querySelector(`[data-color="${color}"]`);

        button.classList.add('active');
        await sleep(600);
        button.classList.remove('active');
        await sleep(400);
    }

    isPlayingSequence = false;
    enableButtons();
    playerSequence = [];
    showInstruction('轮到你了！按顺序点击 👇', 'success');
}

function addToSequence() {
    const randomColor = colors[Math.floor(Math.random() * colors.length)];
    sequence.push(randomColor);
}

function startGame() {
    sequence = [];
    playerSequence = [];
    level = 1;
    score = 0;
    updateStats();

    startButton.disabled = true;
    startButton.textContent = '游戏进行中...';

    for (let i = 0; i < 2; i++) {
        addToSequence();
    }
    playSequence();
}

function updateStats() {
    const oldLevel = parseInt(levelEl.textContent);
    const oldScore = parseInt(scoreEl.textContent);
    levelEl.textContent = level;
    scoreEl.textContent = score;
    if (level !== oldLevel) bounceStat(levelEl);
    if (score !== oldScore) bounceStat(scoreEl);
    if (score > highScore) {
        highScore = score;
        highScoreEl.textContent = highScore;
        bounceStat(highScoreEl);
        localStorage.setItem('sequenceMemoryHighScore', highScore);
    }
}

function disableButtons() {
    colorButtons.forEach(button => {
        button.disabled = true;
    });
}

function enableButtons() {
    colorButtons.forEach(button => {
        button.disabled = false;
    });
}

async function handleButtonClick(e) {
    if (isPlayingSequence) return;

    const color = e.currentTarget.dataset.color;
    const button = e.currentTarget;

    button.classList.add('active');
    await sleep(200);
    button.classList.remove('active');

    playerSequence.push(color);
    checkAnswer();
}

function checkAnswer() {
    const currentIndex = playerSequence.length - 1;

    if (playerSequence[currentIndex] !== sequence[currentIndex]) {
        showInstruction('错了！游戏结束 ❌', 'error');
        gameOver();
        return;
    }

    score += 10;
    updateStats();

    if (playerSequence.length === sequence.length) {
        disableButtons();
        showInstruction('正确！进入下一关 🎉', 'success');
        setTimeout(() => {
            level++;
            score += level * 5;
            updateStats();
            const newColors = Math.random() > 0.7 ? 2 : 1;
            for (let i = 0; i < newColors; i++) {
                addToSequence();
            }
            playSequence();
        }, 1000);
    }
}

/* 通关礼花：从屏幕中心绽开（弹窗居中，中心即屏幕中心，不依赖弹窗元素位置避免布局时序问题） */
function launchConfettiFromCard() {
    if (typeof confetti !== 'function') return;
    const center = { x: 0.5, y: 0.5 };
    confetti({ particleCount: 100, spread: 80, startVelocity: 45, origin: center, colors: ['#8b5cf6', '#ec4899', '#f59e0b', '#22c55e', '#3b82f6'] });
    setTimeout(() => confetti({ particleCount: 70, angle: 60, spread: 60, origin: { x: 0.2, y: 0.6 } }), 150);
    setTimeout(() => confetti({ particleCount: 70, angle: 120, spread: 60, origin: { x: 0.8, y: 0.6 } }), 300);
}

function gameOver() {
    disableButtons();
    finalScoreEl.textContent = score;
    finalLevelEl.textContent = level;
    /* 弹窗和礼花在同一帧出现 */
    gameOverModal.classList.add('show');
    requestAnimationFrame(() => launchConfettiFromCard());
    startButton.disabled = false;
    startButton.textContent = '开始游戏';
}

function resetGame() {
    gameOverModal.classList.remove('show');
    startGame();
}

colorButtons.forEach(button => {
    button.addEventListener('click', handleButtonClick);
});

startButton.addEventListener('click', (e) => { addRipple(startButton, e); startGame(); });
playAgainButton.addEventListener('click', resetGame);
</script>
