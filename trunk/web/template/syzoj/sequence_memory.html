<script>
const colors = ['red', 'yellow', 'blue', 'green'];
let sequence = [];
let playerSequence = [];
let level = 1;
let score = 0;
let highScore = localStorage.getItem('sequenceMemoryHighScore') || 0;
let isPlayingSequence = false;

const levelEl = document.getElementById('level');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('high-score');
const startButton = document.getElementById('start-button');
const colorButtons = document.querySelectorAll('.color-button');
const gameOverModal = document.getElementById('game-over-modal');
const finalScoreEl = document.getElementById('final-score');
const finalLevelEl = document.getElementById('final-level');
const playAgainButton = document.getElementById('play-again-button');

highScoreEl.textContent = highScore;

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function playSequence() {
    isPlayingSequence = true;
    disableButtons();
    
    for (let i = 0; i < sequence.length; i++) {
        const color = sequence[i];
        const button = document.querySelector(`[data-color="${color}"]`);
        
        button.classList.add('active');
        await sleep(600);
        button.classList.remove('active');
        await sleep(400);
    }
    
    isPlayingSequence = false;
    enableButtons();
    playerSequence = [];
}

function addToSequence() {
    const randomColor = colors[Math.floor(Math.random() * colors.length)];
    sequence.push(randomColor);
}

function startGame() {
    sequence = [];
    playerSequence = [];
    level = 1;
    score = 0;
    updateStats();
    
    startButton.disabled = true;
    startButton.textContent = '游戏进行中...';
    
    // Start with 2 colors on level 1 for more challenge
    for (let i = 0; i < 2; i++) {
        addToSequence();
    }
    playSequence();
}

function updateStats() {
    levelEl.textContent = level;
    scoreEl.textContent = score;
    if (score > highScore) {
        highScore = score;
        highScoreEl.textContent = highScore;
        localStorage.setItem('sequenceMemoryHighScore', highScore);
    }
}

function disableButtons() {
    colorButtons.forEach(button => {
        button.disabled = true;
    });
}

function enableButtons() {
    colorButtons.forEach(button => {
        button.disabled = false;
    });
}

async function handleButtonClick(e) {
    if (isPlayingSequence) return;
    
    const color = e.target.dataset.color;
    const button = e.target;
    
    button.classList.add('active');
    await sleep(200);
    button.classList.remove('active');
    
    playerSequence.push(color);
    checkAnswer();
}

function checkAnswer() {
    const currentIndex = playerSequence.length - 1;
    
    if (playerSequence[currentIndex] !== sequence[currentIndex]) {
        gameOver();
        return;
    }
    
    score += 10;
    updateStats();
    
    if (playerSequence.length === sequence.length) {
        disableButtons();
        setTimeout(() => {
            level++;
            score += level * 5;
            updateStats();
            // Add 1-2 new colors per level for more variety
            const newColors = Math.random() > 0.7 ? 2 : 1;
            for (let i = 0; i < newColors; i++) {
                addToSequence();
            }
            playSequence();
        }, 1000);
    }
}

function gameOver() {
    disableButtons();
    finalScoreEl.textContent = score;
    finalLevelEl.textContent = level;
    gameOverModal.style.display = 'flex';
    startButton.disabled = false;
    startButton.textContent = '开始游戏';
}

function resetGame() {
    gameOverModal.style.display = 'none';
    startGame();
}

colorButtons.forEach(button => {
    button.addEventListener('click', handleButtonClick);
});

startButton.addEventListener('click', startGame);
playAgainButton.addEventListener('click', resetGame);
</script>
