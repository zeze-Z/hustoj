    <script>
        // 获取DOM元素
        const diffBtns = document.querySelectorAll('.diff-btn');
        const guessCountEl = document.getElementById('guess-count');
        const currentRangeEl = document.getElementById('current-range');
        const rangeHintEl = document.getElementById('range-hint');
        const inputArea = document.getElementById('input-area');
        const guessBtn = document.getElementById('guess-btn');
        const resetBtn = document.getElementById('reset-btn');
        const feedbackEl = document.getElementById('feedback');
        const gameWinMessage = document.getElementById('game-win-message');

        // 游戏状态变量
        let minNum = 1;
        let maxNum = 100;
        let targetNum = 0;
        let guessCount = 0;
        let gameWon = false;

        // 初始化游戏
        function initGame() {
            // 生成随机数字
            targetNum = Math.floor(Math.random() * (maxNum - minNum + 1)) + minNum;
            guessCount = 0;
            gameWon = false;
            
            // 更新UI
            guessCountEl.textContent = guessCount;
            currentRangeEl.textContent = `${minNum}-${maxNum}`;
            rangeHintEl.textContent = `请猜一个${minNum}到${maxNum}之间的数字`;
            inputArea.value = '';
            inputArea.min = minNum;
            inputArea.max = maxNum;
            feedbackEl.textContent = '';
            feedbackEl.className = 'feedback';
            gameWinMessage.textContent = '';
            inputArea.disabled = false;
            guessBtn.disabled = false;
            inputArea.focus();
        }

        // 切换难度
        function changeDifficulty(e) {
            if (gameWon || guessCount > 0) {
                if (!confirm('切换难度将重新开始游戏，确定吗？')) {
                    return;
                }
            }

            // 移除所有active类
            diffBtns.forEach(btn => btn.classList.remove('active'));
            
            // 添加当前active类
            const btn = e.target;
            btn.classList.add('active');
            
            // 更新范围
            minNum = parseInt(btn.dataset.min);
            maxNum = parseInt(btn.dataset.max);
            
            // 重新初始化游戏
            initGame();
        }

        // 处理猜测
        function handleGuess() {
            if (gameWon) return;
            
            const guess = parseInt(inputArea.value.trim());
            
            // 验证输入
            if (isNaN(guess) || guess < minNum || guess > maxNum) {
                feedbackEl.textContent = `请输入${minNum}到${maxNum}之间的有效数字！`;
                feedbackEl.className = 'feedback too-high';
                inputArea.value = '';
                inputArea.focus();
                return;
            }

            guessCount++;
            guessCountEl.textContent = guessCount;

            if (guess > targetNum) {
                // 太大了
                feedbackEl.textContent = '太大了 ⬆️';
                feedbackEl.className = 'feedback too-high';
                maxNum = guess - 1;
            } else if (guess < targetNum) {
                // 太小了
                feedbackEl.textContent = '太小了 ⬇️';
                feedbackEl.className = 'feedback too-low';
                minNum = guess + 1;
            } else {
                // 猜对了
                feedbackEl.textContent = '恭喜你！猜对了 🎉';
                feedbackEl.className = 'feedback correct';
                gameWon = true;
                gameWinMessage.textContent = `太棒了！你用了${guessCount}次就猜对了！`;
                inputArea.disabled = true;
                guessBtn.disabled = true;
                return;
            }

            // 更新范围显示
            currentRangeEl.textContent = `${minNum}-${maxNum}`;
            rangeHintEl.textContent = `答案在${minNum}到${maxNum}之间`;
            inputArea.value = '';
            inputArea.focus();
        }

        // 事件监听
        diffBtns.forEach(btn => btn.addEventListener('click', changeDifficulty));
        guessBtn.addEventListener('click', handleGuess);
        resetBtn.addEventListener('click', initGame);
        
        // 回车键提交
        inputArea.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleGuess();
            }
        });

        // 初始化游戏
        initGame();
    </script>
