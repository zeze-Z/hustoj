    <script>
        // 获取DOM元素
        const diffBtns = document.querySelectorAll('.diff-btn');
        const guessCountEl = document.getElementById('guess-count');
        const currentRangeEl = document.getElementById('current-range');
        const rangeHintEl = document.getElementById('range-hint');
        const inputArea = document.getElementById('input-area');
        const guessBtn = document.getElementById('guess-btn');
        const resetBtn = document.getElementById('reset-btn');
        const feedbackEl = document.getElementById('feedback');
        const gameWinMessage = document.getElementById('game-win-message');

        // 游戏状态变量 - 从默认激活的难度按钮读取初始范围
        const defaultDiffBtn = document.querySelector('.diff-btn.active');
        let minNum = parseInt(defaultDiffBtn.dataset.min);
        let maxNum = parseInt(defaultDiffBtn.dataset.max);
        let targetNum = 0;
        let guessCount = 0;
        let gameWon = false;

        // 初始化游戏
        function initGame() {
            // 生成随机数字
            targetNum = Math.floor(Math.random() * (maxNum - minNum + 1)) + minNum;
            guessCount = 0;
            gameWon = false;

            // 更新UI
            guessCountEl.textContent = guessCount;
            currentRangeEl.textContent = `${minNum}-${maxNum}`;
            rangeHintEl.textContent = `请猜一个${minNum}到${maxNum}之间的数字`;
            inputArea.value = '';
            inputArea.min = minNum;
            inputArea.max = maxNum;
            feedbackEl.textContent = '';
            feedbackEl.className = 'feedback';
            gameWinMessage.textContent = '';
            document.getElementById('game-over-screen').classList.add('hidden');
            inputArea.disabled = false;
            guessBtn.disabled = false;
            inputArea.focus();
        }

        // 切换难度
        function changeDifficulty(e) {
            if (gameWon || guessCount > 0) {
                if (!confirm('切换难度将重新开始游戏，确定吗？')) {
                    return;
                }
            }

            // 移除所有active类
            diffBtns.forEach(btn => btn.classList.remove('active'));

            // 添加当前active类
            const btn = e.target;
            btn.classList.add('active');

            // 更新范围
            minNum = parseInt(btn.dataset.min);
            maxNum = parseInt(btn.dataset.max);

            // 重新初始化游戏
            initGame();
        }

        // 处理猜测
        function handleGuess() {
            if (gameWon) return;

            const guess = parseInt(inputArea.value.trim());

            // 验证输入
            if (isNaN(guess) || guess < minNum || guess > maxNum) {
                feedbackEl.textContent = `请输入${minNum}到${maxNum}之间的有效数字！`;
                feedbackEl.className = 'feedback too-high show-feedback';
                flashInput('high');
                inputArea.value = '';
                inputArea.focus();
                return;
            }

            guessCount++;
            guessCountEl.textContent = guessCount;
            bounceStat(guessCountEl);

            // 按钮波纹
            createRipple(guessBtn);

            if (guess > targetNum) {
                // 太大了
                feedbackEl.textContent = '太大了 ⬆️';
                feedbackEl.className = 'feedback too-high';
                maxNum = guess - 1;
                flashInput('high');
            } else if (guess < targetNum) {
                // 太小了
                feedbackEl.textContent = '太小了 ⬇️';
                feedbackEl.className = 'feedback too-low';
                minNum = guess + 1;
                flashInput('low');
            } else {
                // 猜对了
                feedbackEl.textContent = '恭喜你！猜对了 🎉';
                feedbackEl.className = 'feedback correct';
                gameWon = true;
                inputArea.disabled = true;
                guessBtn.disabled = true;
                flashInput('correct');

                // 显示游戏结束弹窗
                const activeDiffBtn = document.querySelector('.diff-btn.active');
                const rangeSize = parseInt(activeDiffBtn.dataset.max) - parseInt(activeDiffBtn.dataset.min) + 1;
                const optimalGuesses = Math.ceil(Math.log2(rangeSize));
                const finalScore = Math.max(10, Math.round(100 * optimalGuesses / guessCount));
                document.getElementById('final-guess-count').textContent = guessCount;
                document.getElementById('final-score').textContent = finalScore;
                document.getElementById('final-accuracy').textContent = '100%';

                // 弹窗和礼花同时出现
                document.getElementById('game-over-screen').classList.remove('hidden');
                launchConfetti();
                // 触发反馈动画
                requestAnimationFrame(() => feedbackEl.classList.add('show-feedback'));
                return;
            }

            // 触发反馈动画
            requestAnimationFrame(() => feedbackEl.classList.add('show-feedback'));

            // 更新范围显示
            currentRangeEl.textContent = `${minNum}-${maxNum}`;
            rangeHintEl.textContent = `答案在${minNum}到${maxNum}之间`;
            inputArea.value = '';
            inputArea.focus();
        }

        // 事件监听
        diffBtns.forEach(btn => btn.addEventListener('click', changeDifficulty));
        guessBtn.addEventListener('click', handleGuess);
        resetBtn.addEventListener('click', initGame);

        // 回车键提交
        inputArea.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleGuess();
            }
        });

        // 弹窗重新开始按钮
        document.getElementById('overlay-restart-btn').addEventListener('click', function() {
            document.getElementById('game-over-screen').classList.add('hidden');
            initGame();
        });

        // ===== 动效辅助函数 =====

        // 输入框状态闪烁
        function flashInput(type) {
            inputArea.classList.remove('flash-high','flash-low','flash-correct');
            void inputArea.offsetWidth; // 强制 reflow
            inputArea.classList.add('flash-' + type);
            setTimeout(() => inputArea.classList.remove('flash-high','flash-low','flash-correct'), 1200);
        }

        // 统计数字跳动
        function bounceStat(el) {
            el.classList.remove('stat-bounce');
            void el.offsetWidth;
            el.classList.add('stat-bounce');
            el.addEventListener('animationend', () => el.classList.remove('stat-bounce'), { once: true });
        }

        // 按钮波纹
        function createRipple(btn) {
            const existing = btn.querySelector('.ripple');
            if (existing) existing.remove();
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const rect = btn.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (rect.width / 2 - size / 2) + 'px';
            ripple.style.top = (rect.height / 2 - size / 2) + 'px';
            btn.appendChild(ripple);
            ripple.addEventListener('animationend', () => ripple.remove());
        }

        // 猜对撒花 - 复用项目公共 game_confetti.js
        // launchConfetti() 由 game_confetti.js 提供

        // 初始化游戏
        initGame();
    </script>
</div>
