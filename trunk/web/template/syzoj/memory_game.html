    <script>
        // 获取DOM元素
        const diffBtns = document.querySelectorAll('.diff-btn');
        const flipCountEl = document.getElementById('flip-count');
        const matchedCountEl = document.getElementById('matched-count');
        const totalPairsEl = document.getElementById('total-pairs');
        const timeEl = document.getElementById('time');
        const memoryGridEl = document.getElementById('memory-grid');
        const resetBtn = document.getElementById('reset-btn');
        const gameWinMessage = document.getElementById('game-win-message');

        // 游戏配置
        const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔'];
        
        // 游戏状态变量
        let rows = 4;
        let cols = 4;
        let totalPairs = 8;
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let flipCount = 0;
        let gameStarted = false;
        let startTime = 0;
        let timerInterval = null;
        let isProcessing = false;

        // 初始化游戏
        function initGame() {
            // 重置状态
            cards = [];
            flippedCards = [];
            matchedPairs = 0;
            flipCount = 0;
            gameStarted = false;
            isProcessing = false;
            
            // 停止计时器
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            
            // 更新UI
            flipCountEl.textContent = flipCount;
            matchedCountEl.textContent = matchedPairs;
            totalPairsEl.textContent = totalPairs;
            timeEl.textContent = '00:00';
            gameWinMessage.textContent = '';
            document.getElementById('game-over-screen').classList.add('hidden');

            // 生成卡片数组
            const selectedEmojis = emojis.slice(0, totalPairs);
            const cardValues = [...selectedEmojis, ...selectedEmojis];
            
            // 洗牌
            for (let i = cardValues.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cardValues[i], cardValues[j]] = [cardValues[j], cardValues[i]];
            }
            
            // 设置网格类
            memoryGridEl.className = 'memory-grid';
            if (rows === 2 && cols === 3) {
                memoryGridEl.classList.add('grid-easy');
            } else if (rows === 4 && cols === 4) {
                memoryGridEl.classList.add('grid-normal');
            } else if (rows === 4 && cols === 5) {
                memoryGridEl.classList.add('grid-hard');
            }
            
            // 设置网格样式
            memoryGridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            
            // 清空网格
            memoryGridEl.innerHTML = '';
            
            // 创建卡片
            cardValues.forEach((value, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.value = value;
                card.dataset.index = index;
                
                const cardFront = document.createElement('div');
                cardFront.className = 'card-front';
                
                const cardBack = document.createElement('div');
                cardBack.className = 'card-back';
                cardBack.textContent = value;
                
                card.appendChild(cardFront);
                card.appendChild(cardBack);
                
                card.addEventListener('click', () => flipCard(card));
                
                memoryGridEl.appendChild(card);
                cards.push(card);
            });
        }

        // 翻转卡片
        function flipCard(card) {
            // 处理中、已翻转、已匹配的卡片不能点击
            if (isProcessing || card.classList.contains('flipped') || card.classList.contains('matched')) {
                return;
            }
            
            // 游戏开始时启动计时器
            if (!gameStarted) {
                gameStarted = true;
                startTime = Date.now();
                timerInterval = setInterval(updateTime, 1000);
            }
            
            // 翻转卡片
            card.classList.add('flipped');
            flippedCards.push(card);
            flipCount++;
            flipCountEl.textContent = flipCount;
            
            // 两张卡片已翻转，检查是否匹配
            if (flippedCards.length === 2) {
                isProcessing = true;
                setTimeout(checkMatch, 800);
            }
        }

        // 检查匹配
        function checkMatch() {
            const [card1, card2] = flippedCards;
            const value1 = card1.dataset.value;
            const value2 = card2.dataset.value;
            
            if (value1 === value2) {
                // 匹配成功
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                matchedCountEl.textContent = matchedPairs;
                
                // 检查游戏是否结束
                if (matchedPairs === totalPairs) {
                    endGame();
                }
            } else {
                // 匹配失败，翻回
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
            }
            
            flippedCards = [];
            isProcessing = false;
        }

        // 结束游戏
        function endGame() {
            clearInterval(timerInterval);
            const totalTime = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(totalTime / 60).toString().padStart(2, '0');
            const seconds = (totalTime % 60).toString().padStart(2, '0');

            // 填充弹窗数据
            const accuracy = Math.round(totalPairs * 2 / flipCount * 100);
            document.getElementById('final-flip-count').textContent = flipCount;
            document.getElementById('final-time').textContent = `${minutes}:${seconds}`;
            document.getElementById('final-accuracy').textContent = accuracy + '%';
            document.getElementById('game-over-screen').classList.remove('hidden');

            // 通关烟花效果
            launchConfetti();
        }

        // 更新时间
        function updateTime() {
            const totalTime = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(totalTime / 60).toString().padStart(2, '0');
            const seconds = (totalTime % 60).toString().padStart(2, '0');
            timeEl.textContent = `${minutes}:${seconds}`;
        }

        // 切换难度
        function changeDifficulty(e) {
            if (gameStarted) {
                if (!confirm('切换难度将重新开始游戏，确定吗？')) {
                    return;
                }
            }

            // 移除所有active类
            diffBtns.forEach(btn => btn.classList.remove('active'));
            
            // 添加当前active类
            const btn = e.target;
            btn.classList.add('active');
            
            // 更新尺寸
            rows = parseInt(btn.dataset.rows);
            cols = parseInt(btn.dataset.cols);
            totalPairs = (rows * cols) / 2;
            
            // 重新初始化游戏
            initGame();
        }

        // 事件监听
        diffBtns.forEach(btn => btn.addEventListener('click', changeDifficulty));
        resetBtn.addEventListener('click', initGame);

        // 弹窗重新开始按钮
        document.getElementById('overlay-restart-btn').addEventListener('click', function() {
            document.getElementById('game-over-screen').classList.add('hidden');
            initGame();
        });

        // 初始化游戏
        initGame();
    </script>
