var state={L:[],R:[],stall:[]};
function lv(){return LV[cur]}
function sumArr(a){var s=0;for(var i=0;i<a.length;i++)s+=F[a[i]].w;return s}
function leftSum(){var s=sumArr(state.L);if(lv().box>0)s+=lv().box;return s}

function zoneDraggable(g,from){
 if(g==='A')return false;
 if(g==='B')return from==='stall'||from==='R';

 el.className='bs-fruit'+(can?' drag':'');

 drawFruit(el,code);
 if(can){
   /* from 显式传入：.bs-load 上没有 data-id，取 zone.dataset.id 会是 undefined，
      moveFruit 就会去货架里找水果导致盘上水果拖不动 */
   el.addEventListener('pointerdown',function(e){dragStart(e,el,from);});
 }else{

function render(ansTilt){
 var g=lv().g;
 var loadL=panL.querySelector('.bs-load'),loadR=panR.querySelector('.bs-load');
 loadL.innerHTML='';loadR.innerHTML='';stallLoad.innerHTML='';
 if(lv().box>0){
   var bx=document.createElement('div');bx.className='bs-box';
   loadL.appendChild(bx);drawBox(bx,solved?lv().box:'?');
 }
 var cL=zoneDraggable(g,'L'),cR=zoneDraggable(g,'R'),cS=zoneDraggable(g,'stall');
 state.L.forEach(function(c){addFruit(loadL,c,cL,'L')});
 state.R.forEach(function(c){addFruit(loadR,c,cR,'R')});
 state.stall.forEach(function(c){addFruit(stallLoad,c,cS,'stall')});
 /* 货架文案分组不同；空货架给可爱提示，不留白 */
 var lab=$('bsStallLab');
 if(lab){
   lab.textContent=(g==='B')?'🧺 水果货架 · 拖到右盘配平'
     :(g==='C'&&lv().self)?'🧺 货架 · 把相同的水果拖回来'
     :(g==='C')?'🧺 水果摊 · 两边同时拿走'
     :'🧺 水果摊 · 看看谁更重';
 }
 if(state.stall.length===0){
   var e=document.createElement('div');e.className='bs-stall-empty';
   e.textContent=(g==='C'&&lv().self)?'👆 把两边相同的水果拖回这里'
     :(g==='C')?'本关用下面的按钮操作，不用拖水果~'
     :'本关不用拖水果，看看天平猜一猜~';
   stallLoad.appendChild(e);
 }
 if(state.L.length===0&&state.R.length===0&&state.stall.length===0){noFruitHint();}
 /* 倾斜：永远反映真实轻重（A 组靠“看哪边低”作答，藏起来就没法看） */
 applyTilt(true);
 /* 提示操作 */
 if(g==='C'&&lv().self&&!solved)msg('把两边的🍊都拿回货架','warn');
 check();updateStats();

function applyTilt(show){
 /* 左重则左盘下沉 = counter-clockwise = 负角（CSS 正角顺时针抬左压右） */

 if(show&&!solved)ang=Math.max(-12,Math.min(12,-d*3));
 var t='rotate('+ang+'deg)';
 if(canAnimate()){
   if(rocker.style.transition!=='none')rocker.style.transition='none';
   /* 先写终值兜底：动画被跳过/中断也不会停在 0；再跑弹簧回振（过冲→回落→稳定） */
   rocker.style.transform=t;
   A.animate(rocker,{rotate:[ang*1.16,ang*.9,ang],ease:'out(2)',duration:720,onComplete:function(){rocker.style.transform=t;}});
 }else{
   rocker.style.transform=t;   /* CSS transition 兜底 */
 }
}

/* ====== 拖拽 ====== */
var drag=null;
function dragStart(e,el,from){
 if(solved||el.style.pointerEvents==='none')return;
 e.preventDefault();
 var r=el.getBoundingClientRect();
 drag={el:el,code:el.dataset.code,from:from,dx:e.clientX-r.left,dy:e.clientY-r.top};
 el.classList.add('dragging');
 /* .bs-card 的 backdrop-filter / .bs-stage 的 scale / .bs-rocker 的 rotate 都会
    抢走 position:fixed 的包含块，left/top 按视口写会错位（水果飘到指针上方）；
    拖起时挂到 body 下，fixed 才真正相对视口 */
 document.body.appendChild(el);
 el.style.left=(e.clientX-drag.dx)+'px';el.style.top=(e.clientY-drag.dy)+'px';
 el.setPointerCapture(e.pointerId);
 document.addEventListener('pointermove',dragMove);
 document.addEventListener('pointerup',dragUp);
 document.addEventListener('pointercancel',dragUp);
}
function dragMove(e){if(!drag)return;drag.el.style.left=(e.clientX-drag.dx)+'px';drag.el.style.top=(e.clientY-drag.dy)+'px';}
function dragUp(e){
 if(!drag)return;
 var d=drag;drag=null;
 document.removeEventListener('pointermove',dragMove);document.removeEventListener('pointerup',dragUp);document.removeEventListener('pointercancel',dragUp);
 d.el.classList.remove('dragging');
 d.el.style.left='';d.el.style.top='';
 if(d.el.parentNode)d.el.parentNode.removeChild(d.el);  /* 已挂到 body，render 重建不到它 */
 var to=(e.type==='pointercancel')?null:hitTarget(e.clientX,e.clientY),g=lv().g;
 if(to&&to!==d.from&&zoneAllowed(g,to)){
   moveFruit(d.code,d.from,to);
 }
 render(false);
}
function zoneAllowed(g,to){if(g==='A')return false;if(g==='B')return to==='R'||to==='stall';return true;}
function moveFruit(code,from,to){
 var src=from==='L'?state.L:from==='R'?state.R:state.stall;
 var i=src.indexOf(code);if(i<0)return;src.splice(i,1);
 if(to==='L')state.L.push(code);else if(to==='R')state.R.push(code);else state.stall.push(code);
}
function hitTarget(x,y){
 var els=[panL,panR,stallLoad],best=null,bestArea=1e9;
 for(var i=0;i<els.length;i++){
   var r=els[i].getBoundingClientRect(),area=r.width*r.height;
   if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom&&area<bestArea){bestArea=area;best=els[i].dataset.id;}
 }
 return best;
}

/* ====== 统计 & 时间 ====== */
function fmt(s){s=Math.max(0,s);return (String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'))}
function load(n){
 clearInterval(timer);
 cur=n;solved=false;awaitX=false;didAns=false;attemptsThis=0;t0=Date.now();
 state.L=[].concat(LV[cur].L);state.R=[].concat(LV[cur].R);state.stall=(LV[cur].stall?[].concat(LV[cur].stall):[]);
 ripple.classList.remove('bs-wave');panL.querySelector('.bs-load').classList.remove('bs-happy');panR.querySelector('.bs-load').classList.remove('bs-happy');
 $('bsFeed').className='bs-feedback';$('bsFeed').textContent='';
 $('bsHint').innerHTML=LV[cur].hint||'';
 $('bsModal').classList.add('bs-hid');$('bsXpanel').classList.add('bs-hid');
 var best=bestGet();
 $('bsBest').textContent=best===null?'--':fmt(best);
 $('bsLev').textContent=(cur+1)+' / '+LV.length;
 buildControls();render(false);updateStats();
 /* 开场就给一句“该干什么”，不让人对着空白反馈框发呆 */
 var gg=lv().g;
 if(gg!=='C'||!lv().self){
   if(gg==='A')msg('👀 看看天平，哪边更低哪边就更重~');
   else if(gg==='B')msg('👉 从货架拖水果到右盘，把天平配平~');
   else msg('✂️ 两边同时拿走相同的水果，天平会怎样？');
 }
 timer=setInterval(function(){tNow=Math.floor((Date.now()-t0)/1000);$('bsTime').textContent=fmt(tNow);},500);
}
function updateStats(){$('bsTry').textContent=attempts+attemptsThis;bounce($('bsTry'));}
function bestGet(){var k='bs_best_L'+(cur+1);var v=localStorage.getItem(k);return v===null?null:parseInt(v,10)}
function bestSet(s){localStorage.setItem('bs_best_L'+(cur+1),String(s))}
window.bsReplay=function(){$('bsModal').classList.add('bs-hid');load(cur);}

/* 高度自适缩放：按舞台实际可用宽度缩放 420px 设计稿，两侧托盘不出画布 */
function scaleStage(){
 var stage=$('bsStage');
 /* transform 不影响 layout，clientWidth 稳定可反复读；勿用视口宽——卡片有 padding，摆动总成是相对舞台居中的 */
 var w=(stage&&stage.clientWidth)?stage.clientWidth:(document.documentElement.clientWidth||375);
 var s=Math.min(1,Math.max(0.5,w/428));
 if(stage){
   stage.style.marginBottom='';
   document.documentElement.style.setProperty('--bs-s',s);
   var h=stage.offsetHeight;
   /* 一屏自适应：桌面端宽度够（s=1）但视口高度不够时，压舞台吃掉溢出量。
      transform 不改 layout，margin 清零后 card.scrollHeight 就是未缩放的真实内容高 */
   var card=$('bsCard');
   if(card&&h>0){
     var avail=window.innerHeight-card.getBoundingClientRect().top-14;
     var over=card.scrollHeight-avail;
     if(over>0){
       s=Math.max(0.42,s-over/h);
       document.documentElement.style.setProperty('--bs-s',s);
     }
   }
   /* transform-origin:top center 缩放后下方留白，用负 margin 把布局高度收回，保证一屏 */
   if(h>0&&s<1)stage.style.marginBottom=((s-1)*h)+'px';
 }
}
var resizeTimer=null;
window.addEventListener('resize',function(){
  scaleStage();
  /* clamp() 盒子随视口变宽高：debounce 重画手绘层，避免 viewBox 拉伸变形 */
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(function(){drawScale();drawTitleIcon();},220);
});
scaleStage();

/* 初始化：先入 DOM 再画（隐藏元素量不出尺寸） */
load(0);
drawScale();
drawTitleIcon();

})();
</script>
