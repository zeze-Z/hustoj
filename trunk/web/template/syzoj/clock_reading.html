<script>
class ClockReadingGame {
    constructor() {
        this.canvas = document.getElementById('clock-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.centerX = this.canvas.width / 2;
        this.centerY = this.canvas.height / 2;
        this.radius = Math.min(this.centerX, this.centerY) - 10;

        this.difficulty = 'easy';
        this.score = 0;
        this.level = 1;
        this.totalQuestions = 0;
        this.correctAnswers = 0;
        this.timeLeft = 60;
        this.gameRunning = false;
        this.currentHour = 0;
        this.currentMinute = 0;
        
        this.lastTime = 0;
        this.animationId = null;
        this.timerAccumulator = 0;

        this.initializeEventListeners();
        this.drawClock(3, 0);
    }

    initializeEventListeners() {
        document.getElementById('start-btn').addEventListener('click', () => this.startGame());
        document.getElementById('reset-btn').addEventListener('click', () => this.resetGame());
        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('game-over-screen').classList.add('hidden');
            this.resetGame();
            this.startGame();
        });

        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                this.difficulty = e.target.dataset.difficulty;
                if (!this.gameRunning) {
                    this.generateNewQuestion();
                }
            });
        });
    }

    startGame() {
        if (this.gameRunning) return;
        
        this.gameRunning = true;
        this.score = 0;
        this.level = 1;
        this.totalQuestions = 0;
        this.correctAnswers = 0;
        this.timeLeft = 60;
        this.lastTime = performance.now();
        this.timerAccumulator = 0;
        
        this.updateStats();
        this.generateNewQuestion();
        this.gameLoop();
        
        document.getElementById('start-btn').disabled = true;
    }

    resetGame() {
        this.gameRunning = false;
        if (this.animationId) {
            cancelAnimationFrame(this.animationId);
            this.animationId = null;
        }

        document.getElementById('game-over-screen').classList.add('hidden');
        this.score = 0;
        this.level = 1;
        this.totalQuestions = 0;
        this.correctAnswers = 0;
        this.timeLeft = 60;
        
        document.getElementById('timer-fill').style.width = '100%';
        this.updateStats();
        this.drawClock(3, 0);
        document.getElementById('options-container').innerHTML = '';
        document.getElementById('feedback').classList.remove('show');
        document.getElementById('start-btn').disabled = false;
    }

    gameLoop(timestamp = performance.now()) {
        if (!this.gameRunning) return;
        
        const dt = (timestamp - this.lastTime) / 1000;
        this.lastTime = timestamp;
        
        this.timerAccumulator += dt;
        if (this.timerAccumulator >= 1) {
            this.timerAccumulator -= 1;
            this.timeLeft--;
            
            const percentage = Math.max(0, (this.timeLeft / 60) * 100);
            document.getElementById('timer-fill').style.width = percentage + '%';
            document.getElementById('time-left').textContent = this.timeLeft;

            if (this.timeLeft <= 0) {
                this.endGame();
                return;
            }
        }

        this.animationId = requestAnimationFrame((t) => this.gameLoop(t));
    }

    endGame() {
        this.gameRunning = false;
        if (this.animationId) {
            cancelAnimationFrame(this.animationId);
            this.animationId = null;
        }

        const accuracy = this.totalQuestions > 0 ? Math.round((this.correctAnswers / this.totalQuestions) * 100) : 0;

        document.getElementById('final-score').textContent = this.score;
        document.getElementById('final-correct').textContent = this.correctAnswers;
        document.getElementById('final-total').textContent = this.totalQuestions;
        document.getElementById('final-accuracy').textContent = accuracy + '%';
        document.getElementById('final-level').textContent = this.level;

        document.getElementById('game-over-screen').classList.remove('hidden');
    }

    generateNewQuestion() {
        this.totalQuestions++;
        
        let hour, minute;
        
        switch (this.difficulty) {
            case 'easy':
                hour = Math.floor(Math.random() * 12) + 1;
                minute = 0;
                break;
            case 'medium':
                hour = Math.floor(Math.random() * 12) + 1;
                minute = Math.random() > 0.5 ? 0 : 30;
                break;
            case 'hard':
                hour = Math.floor(Math.random() * 12) + 1;
                minute = Math.floor(Math.random() * 12) * 5;
                break;
        }

        this.currentHour = hour;
        this.currentMinute = minute;

        this.drawClock(hour, minute);
        this.generateOptions(hour, minute);
    }

    generateOptions(correctHour, correctMinute) {
        const options = [];
        const correctTime = this.formatTime(correctHour, correctMinute);
        options.push(correctTime);

        while (options.length < 4) {
            let hour, minute;
            if (this.difficulty === 'easy') {
                hour = Math.floor(Math.random() * 12) + 1;
                minute = 0;
            } else if (this.difficulty === 'medium') {
                hour = Math.floor(Math.random() * 12) + 1;
                minute = Math.random() > 0.5 ? 0 : 30;
            } else {
                hour = Math.floor(Math.random() * 12) + 1;
                minute = Math.floor(Math.random() * 12) * 5;
            }
            
            const time = this.formatTime(hour, minute);
            if (!options.includes(time)) {
                options.push(time);
            }
        }

        options.sort(() => Math.random() - 0.5);

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        options.forEach(option => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.textContent = option;
            btn.addEventListener('click', () => this.checkAnswer(option, btn));
            container.appendChild(btn);
        });
    }

    formatTime(hour, minute) {
        const h = hour < 10 ? `0${hour}` : hour;
        const m = minute < 10 ? `0${minute}` : minute;
        return `${h}:${m}`;
    }

    checkAnswer(selectedOption, selectedBtn) {
        if (!this.gameRunning) return;

        const correctTime = this.formatTime(this.currentHour, this.currentMinute);
        const isCorrect = selectedOption === correctTime;

        const feedback = document.getElementById('feedback');
        feedback.className = 'feedback';

        if (isCorrect) {
            this.correctAnswers++;
            this.score += 10 * this.level;
            feedback.textContent = '🎉 答对了！真棒！';
            feedback.classList.add('correct', 'show');
            selectedBtn.classList.add('correct');

            this.animatePulse(selectedBtn);

            if (this.correctAnswers % 5 === 0) {
                this.level++;
            }
        } else {
            feedback.textContent = `❌ 答错了，正确答案是 ${correctTime}`;
            feedback.classList.add('incorrect', 'show');
            selectedBtn.classList.add('incorrect');

            this.animateShake(selectedBtn);

            document.querySelectorAll('.btn-option').forEach(btn => {
                if (btn.textContent === correctTime) {
                    btn.classList.add('correct');
                    this.animatePulse(btn);
                }
            });
        }

        this.updateStats();

        setTimeout(() => {
            feedback.classList.remove('show');
            this.generateNewQuestion();
        }, 2000);
    }

    animatePulse(element) {
        let start = performance.now();
        const duration = 600;

        function pulse(timestamp) {
            const elapsed = timestamp - start;
            const progress = Math.min(elapsed / duration, 1);
            const scale = 1 + 0.05 * Math.sin(progress * Math.PI);
            
            element.style.transform = `scale(${scale})`;
            
            if (progress < 1) {
                requestAnimationFrame(pulse);
            } else {
                element.style.transform = '';
            }
        }

        requestAnimationFrame(pulse);
    }

    animateShake(element) {
        let start = performance.now();
        const duration = 400;

        function shake(timestamp) {
            const elapsed = timestamp - start;
            const progress = Math.min(elapsed / duration, 1);
            const offset = 5 * Math.sin(progress * 4 * Math.PI);
            
            element.style.transform = `translateX(${offset}px)`;
            
            if (progress < 1) {
                requestAnimationFrame(shake);
            } else {
                element.style.transform = '';
            }
        }

        requestAnimationFrame(shake);
    }

    updateStats() {
        document.getElementById('score').textContent = this.score;
        document.getElementById('level').textContent = this.level;
        const accuracy = this.totalQuestions > 0 ? Math.round((this.correctAnswers / this.totalQuestions) * 100) : 0;
        document.getElementById('accuracy').textContent = accuracy + '%';
    }

    drawClock(hour, minute) {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        this.drawClockFace();
        this.drawNumbers();
        this.drawHands(hour, minute);
        this.drawCenterDot();
    }

    drawClockFace() {
        this.ctx.beginPath();
        this.ctx.arc(this.centerX, this.centerY, this.radius, 0, 2 * Math.PI);
        this.ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--clock-face').trim();
        this.ctx.fill();
        this.ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim();
        this.ctx.lineWidth = 8;
        this.ctx.stroke();
    }

    drawNumbers() {
        this.ctx.font = 'bold 24px Arial';
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        this.ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-color').trim();

        for (let num = 1; num <= 12; num++) {
            const angle = (num * Math.PI) / 6;
            const x = this.centerX + (this.radius - 35) * Math.sin(angle);
            const y = this.centerY - (this.radius - 35) * Math.cos(angle);
            this.ctx.fillText(num.toString(), x, y);
        }

        for (let i = 0; i < 60; i++) {
            const angle = (i * Math.PI) / 30;
            const length = i % 5 === 0 ? 15 : 8;
            const width = i % 5 === 0 ? 3 : 1;
            
            this.ctx.beginPath();
            this.ctx.lineWidth = width;
            this.ctx.strokeStyle = '#666';
            
            const x1 = this.centerX + (this.radius - 15) * Math.sin(angle);
            const y1 = this.centerY - (this.radius - 15) * Math.cos(angle);
            const x2 = this.centerX + (this.radius - 15 - length) * Math.sin(angle);
            const y2 = this.centerY - (this.radius - 15 - length) * Math.cos(angle);
            
            this.ctx.moveTo(x1, y1);
            this.ctx.lineTo(x2, y2);
            this.ctx.stroke();
        }
    }

    drawHands(hour, minute) {
        const hourAngle = (hour % 12) * 30 + minute * 0.5;
        const minuteAngle = minute * 6;

        this.drawHand(hourAngle, this.radius * 0.5, 6, getComputedStyle(document.documentElement).getPropertyValue('--hour-hand').trim());
        this.drawHand(minuteAngle, this.radius * 0.7, 4, getComputedStyle(document.documentElement).getPropertyValue('--minute-hand').trim());
    }

    drawHand(angle, length, width, color) {
        this.ctx.save();
        this.ctx.translate(this.centerX, this.centerY);
        this.ctx.rotate((angle * Math.PI) / 180);
        this.ctx.beginPath();
        this.ctx.lineWidth = width;
        this.ctx.lineCap = 'round';
        this.ctx.strokeStyle = color;
        this.ctx.moveTo(0, 10);
        this.ctx.lineTo(0, -length);
        this.ctx.stroke();
        this.ctx.restore();
    }

    drawCenterDot() {
        this.ctx.beginPath();
        this.ctx.arc(this.centerX, this.centerY, 6, 0, 2 * Math.PI);
        this.ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim();
        this.ctx.fill();
    }
}

document.addEventListener('DOMContentLoaded', () => {
    new ClockReadingGame();
});
</script>
