<script>
// ===== 背景粒子 =====
(function createParticles() {
  const container = document.getElementById('bg-particles');
  const colors = ['#FF6B9C', '#C850C0', '#4158D0', '#10b981', '#f59e0b', '#ef4444'];
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 60 + 20;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (Math.random() * 15 + 10) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    container.appendChild(p);
  }
})();

// ===== 游戏逻辑 =====
const colorData = [
  { name: '红色', value: '#FF0000' },
  { name: '蓝色', value: '#0000FF' },
  { name: '绿色', value: '#00AA00' },
  { name: '黄色', value: '#FFD700' },
  { name: '紫色', value: '#800080' },
  { name: '橙色', value: '#FF8C00' },
  { name: '粉色', value: '#FF69B4' },
  { name: '黑色', value: '#1a1a1a' },
  { name: '白色', value: '#F5F5F5' },
  { name: '灰色', value: '#808080' },
  { name: '棕色', value: '#8B4513' },
  { name: '青色', value: '#00CED1' }
];

let currentColor = null;
let score = 0;
let correctCount = 0;
let totalCount = 0;
let timeLeft = 60;
let totalTime = 60;
let gameActive = false;
let timer = null;
let combo = 0;
let maxCombo = 0;

const colorBlock = document.getElementById('color-block');
const colorGlow = document.getElementById('color-glow');
const colorQuestion = document.getElementById('color-question');
const colorDisplayWrapper = document.getElementById('color-display-wrapper');
const optionsContainer = document.getElementById('options-container');
const scoreElement = document.getElementById('score');
const timeLeftElement = document.getElementById('time-left');
const accuracyElement = document.getElementById('accuracy');
const timerBar = document.getElementById('timer-bar');
const startButton = document.getElementById('start-button');
const restartButton = document.getElementById('restart-button');
const comboDisplay = document.getElementById('combo-display');
const gameOverScreen = document.getElementById('game-over-screen');
const finalScoreElement = document.getElementById('final-score');
const totalQuestionsElement = document.getElementById('total-questions');
const finalAccuracyElement = document.getElementById('final-accuracy');
const resultEmoji = document.getElementById('result-emoji');
const rankText = document.getElementById('rank-text');

function getRandomColors(count) {
  const shuffled = [...colorData].sort(() => 0.5 - Math.random());
  return shuffled.slice(0, count);
}

function generateQuestion() {
  const colors = getRandomColors(4);
  currentColor = colors[Math.floor(Math.random() * 4)];

  colorBlock.style.backgroundColor = currentColor.value;
  colorGlow.style.background = currentColor.value;
  colorGlow.style.opacity = '0.3';
  colorQuestion.style.display = 'none';

  // 弹跳动画
  colorBlock.classList.add('pop');
  setTimeout(() => colorBlock.classList.remove('pop'), 300);

  optionsContainer.innerHTML = '';
  colors.forEach(color => {
    const button = document.createElement('button');
    button.className = 'btn-option';
    button.textContent = color.name;
    button.dataset.colorName = color.name;
    button.addEventListener('click', () => checkAnswer(color.name, button));
    optionsContainer.appendChild(button);
  });
}

function showScorePopup(text, isPlus) {
  const popup = document.createElement('div');
  popup.className = 'score-popup ' + (isPlus ? 'plus' : 'minus');
  popup.textContent = text;
  // 放在色块附近
  const rect = colorDisplayWrapper.getBoundingClientRect();
  const containerRect = document.querySelector('.game-container').getBoundingClientRect();
  popup.style.left = (rect.left - containerRect.left + rect.width / 2 - 20) + 'px';
  popup.style.top = (rect.top - containerRect.top + rect.height / 2) + 'px';
  document.querySelector('.game-container').appendChild(popup);
  setTimeout(() => popup.remove(), 800);
}

function showCombo() {
  if (combo >= 2) {
    comboDisplay.textContent = '🔥 ' + combo + ' 连击！';
    comboDisplay.className = 'combo-display show';
    clearTimeout(comboDisplay._hideTimer);
    comboDisplay._hideTimer = setTimeout(() => {
      comboDisplay.className = 'combo-display hide';
    }, 1200);
  }
}

function checkAnswer(selectedName, button) {
  if (!gameActive) return;

  totalCount++;
  const correct = selectedName === currentColor.name;

  // 禁用所有按钮
  const allBtns = optionsContainer.querySelectorAll('.btn-option');
  allBtns.forEach(b => b.style.pointerEvents = 'none');

  if (correct) {
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    const comboBonus = Math.min(combo, 5); // 最多5倍加成
    const points = 1 + (comboBonus > 1 ? comboBonus - 1 : 0);
    score += points;
    correctCount++;
    button.classList.add('correct');

    showScorePopup('+' + points, true);
    showCombo();

    // 分数跳动
    scoreElement.classList.add('bump');
    setTimeout(() => scoreElement.classList.remove('bump'), 150);
  } else {
    combo = 0;
    button.classList.add('incorrect');

    // 显示正确答案
    allBtns.forEach(btn => {
      if (btn.dataset.colorName === currentColor.name) {
        btn.classList.add('reveal-correct');
      }
    });

    showScorePopup('✗', false);

    // 隐藏连击
    comboDisplay.className = 'combo-display hide';
  }

  updateStats();

  gameActive = false;
  setTimeout(() => {
    if (timeLeft > 0) {
      gameActive = true;
      generateQuestion();
    }
  }, 800);
}

function updateStats() {
  scoreElement.textContent = score;
  const accuracy = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
  accuracyElement.textContent = accuracy + '%';
}

function updateTimerBar() {
  const pct = (timeLeft / totalTime) * 100;
  timerBar.style.width = pct + '%';

  timerBar.classList.remove('warning', 'danger');
  if (pct <= 16) {
    timerBar.classList.add('danger');
  } else if (pct <= 33) {
    timerBar.classList.add('warning');
  }
}

function getRank(score, accuracy) {
  if (score >= 50 && accuracy >= 90) return { emoji: '👑', text: '颜色大师' };
  if (score >= 35 && accuracy >= 80) return { emoji: '🏆', text: '色彩达人' };
  if (score >= 20 && accuracy >= 60) return { emoji: '⭐', text: '眼力不错' };
  if (score >= 10) return { emoji: '👍', text: '继续加油' };
  return { emoji: '💪', text: '再接再厉' };
}

function startGame() {
  score = 0;
  correctCount = 0;
  totalCount = 0;
  timeLeft = totalTime;
  gameActive = true;
  combo = 0;
  maxCombo = 0;

  updateStats();
  timeLeftElement.textContent = timeLeft;
  updateTimerBar();

  startButton.classList.add('hidden');
  restartButton.classList.add('hidden');
  gameOverScreen.classList.add('hidden');

  generateQuestion();

  timer = setInterval(() => {
    timeLeft--;
    timeLeftElement.textContent = timeLeft;
    updateTimerBar();

    if (timeLeft <= 0) {
      endGame();
    }
  }, 1000);
}

function endGame() {
  clearInterval(timer);
  gameActive = false;

  const accuracy = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
  const rank = getRank(score, accuracy);

  finalScoreElement.textContent = score;
  totalQuestionsElement.textContent = totalCount;
  finalAccuracyElement.textContent = accuracy + '%';
  resultEmoji.textContent = rank.emoji;
  rankText.textContent = rank.text;

  gameOverScreen.classList.remove('hidden');
  restartButton.classList.remove('hidden');
}

startButton.addEventListener('click', startGame);
restartButton.addEventListener('click', startGame);
document.getElementById('restart-button-2').addEventListener('click', startGame);
</script>
