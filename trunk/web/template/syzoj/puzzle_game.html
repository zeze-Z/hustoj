<script>
(function(){
var TOTAL_IMAGES = 6;
var IMAGE_FILES = ['01.jpg', '02.jpg', '03.jpg', '04.jpg', '05.jpg', '06.jpg'];
var DRAG_THRESHOLD = 5;
var SNAP_THRESHOLD = 0.4;

var grid = document.getElementById('grid');
var movesEl = document.getElementById('moves');
var timeEl = document.getElementById('time');
var bestEl = document.getElementById('best');
var difficultySelect = document.getElementById('difficulty');
var restartBtn = document.getElementById('restart');
var changeImgBtn = document.getElementById('changeImg');
var targetHighlight = document.getElementById('targetHighlight');
var previewImg = document.getElementById('previewImg');
var previewToggle = document.getElementById('previewToggle');
var victoryModal = document.getElementById('victoryModal');
var playAgainBtn = document.getElementById('playAgain');
var challengeHarderBtn = document.getElementById('challengeHarder');
var victoryMovesEl = document.getElementById('victoryMoves');
var victoryTimeEl = document.getElementById('victoryTime');
var victoryDifficultyEl = document.getElementById('victoryDifficulty');

var gridSize, pieces, pieceEls, steps, time, timer, started, won, imgSrc, imgIndex;
var previewVisible = true;

// Drag state
var dragPiece = null;
var dragStartX, dragStartY, dragOrigX, dragOrigY, dragDist;
var rafId = null;

// Click swap state
var selectedPiece = null;

function fmtTime(s) {
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function ps() { return grid.clientWidth / gridSize; }

function loadBest() {
    var k = 'puzzle_best_' + gridSize;
    var raw = localStorage.getItem(k);
    if (raw) {
        try { var d = JSON.parse(raw); bestEl.textContent = d.steps + '步/' + fmtTime(d.time); }
        catch(e) { bestEl.textContent = '--:--'; }
    } else { bestEl.textContent = '--:--'; }
}

function saveBest() {
    var k = 'puzzle_best_' + gridSize;
    var data = {steps: steps, time: time};
    var prev = localStorage.getItem(k);
    if (prev) {
        try {
            var old = JSON.parse(prev);
            if (old.time < time) return;
            if (old.time === time && old.steps <= steps) return;
        } catch(e) {}
    }
    localStorage.setItem(k, JSON.stringify(data));
    bestEl.textContent = steps + '步/' + fmtTime(time);
}

function updateMoves() { movesEl.textContent = steps; }
function updateTime() { timeEl.textContent = fmtTime(time); }

function startTimer() {
    if (timer) return;
    started = true;
    timer = setInterval(function(){ time++; updateTime(); }, 1000);
}

function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

function randomImage() {
    imgIndex = Math.floor(Math.random() * TOTAL_IMAGES);
    imgSrc = 'image/puzzle/' + IMAGE_FILES[imgIndex];
}

function shuffleCount() {
    switch(gridSize) { case 3: return 20; case 5: return 50; case 7: return 100; case 9: return 200; default: return 50; }
}

function findPieceAt(row, col) {
    for (var i = 0; i < pieces.length; i++) {
        if (pieces[i].currentRow === row && pieces[i].currentCol === col) return i;
    }
    return -1;
}

function getCellFromCenter(cx, cy) {
    var psz = ps();
    var col = Math.floor(cx / psz);
    var row = Math.floor(cy / psz);
    if (col < 0 || col >= gridSize || row < 0 || row >= gridSize) return null;
    var cellCx = col * psz + psz / 2;
    var cellCy = row * psz + psz / 2;
    var dx = cx - cellCx, dy = cy - cellCy;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < SNAP_THRESHOLD * psz) return {row: row, col: col};
    return null;
}

function showHighlight(col, row) {
    var psz = ps();
    targetHighlight.style.width = psz + 'px';
    targetHighlight.style.height = psz + 'px';
    targetHighlight.style.top = (row * psz) + 'px';
    targetHighlight.style.left = (col * psz) + 'px';
    targetHighlight.classList.add('active');
}

function hideHighlight() { targetHighlight.classList.remove('active'); }

function checkWin() {
    for (var i = 0; i < pieces.length; i++) { if (!pieces[i].correct) return false; }
    return true;
}

function onVictory() {
    won = true;
    stopTimer();
    saveBest();
    hideHighlight();
    clearSelection();

    // 礼花效果
    launchConfetti();

    setTimeout(function(){
        victoryMovesEl.textContent = steps;
        victoryTimeEl.textContent = fmtTime(time);
        victoryDifficultyEl.textContent = gridSize + '×' + gridSize;
        victoryModal.classList.add('show');
    }, 300);
}

function clearSelection() {
    if (selectedPiece !== null) {
        pieceEls[selectedPiece].classList.remove('selected');
        selectedPiece = null;
    }
}

function updateCorrect(p) {
    p.correct = (p.currentRow === p.targetRow && p.currentCol === p.targetCol);
}

function updateCorrectClasses() {
    for (var i = 0; i < pieces.length; i++) {
        updateCorrect(pieces[i]);
        if (pieces[i].correct) { pieceEls[i].classList.add('correct'); pieceEls[i].classList.remove('selected'); }
        else { pieceEls[i].classList.remove('correct'); }
    }
}

function positionPiece(el, p) {
    var psz = ps();
    el.style.transform = 'translate(' + (p.currentCol * psz) + 'px, ' + (p.currentRow * psz) + 'px)';
}

function positionAll(instant) {
    var psz = ps();
    pieceEls.forEach(function(el) {
        var i = parseInt(el.dataset.index);
        var p = pieces[i];
        if (instant) {
            el.style.transition = 'none';
            el.classList.remove('transitioning');
            el.style.transform = 'translate(' + (p.currentCol * psz) + 'px, ' + (p.currentRow * psz) + 'px)';
        } else {
            el.classList.add('transitioning');
            el.style.transform = 'translate(' + (p.currentCol * psz) + 'px, ' + (p.currentRow * psz) + 'px)';
        }
    });
}

function swapPieces(a, b) {
    var tmpR = pieces[a].currentRow, tmpC = pieces[a].currentCol;
    pieces[a].currentRow = pieces[b].currentRow;
    pieces[a].currentCol = pieces[b].currentCol;
    pieces[b].currentRow = tmpR;
    pieces[b].currentCol = tmpC;
    updateCorrect(pieces[a]);
    updateCorrect(pieces[b]);
    var psz = ps();
    pieceEls[a].classList.add('transitioning');
    pieceEls[a].style.transform = 'translate(' + (pieces[a].currentCol * psz) + 'px, ' + (pieces[a].currentRow * psz) + 'px)';
    pieceEls[b].classList.add('transitioning');
    pieceEls[b].style.transform = 'translate(' + (pieces[b].currentCol * psz) + 'px, ' + (pieces[b].currentRow * psz) + 'px)';
    updateCorrectClasses();
    steps++;
    updateMoves();
    if (!started) startTimer();
    if (checkWin()) onVictory();
}

function handleClickSwap(idx) {
    if (pieces[idx].correct) return;
    if (selectedPiece === null) {
        selectedPiece = idx;
        pieceEls[idx].classList.add('selected');
    } else if (selectedPiece === idx) {
        pieceEls[idx].classList.remove('selected');
        selectedPiece = null;
    } else {
        swapPieces(selectedPiece, idx);
        pieceEls[selectedPiece].classList.remove('selected');
        pieceEls[idx].classList.remove('selected');
        selectedPiece = null;
    }
}

function doSnap(idx, targetRow, targetCol) {
    pieces[idx].currentRow = targetRow;
    pieces[idx].currentCol = targetCol;
    updateCorrect(pieces[idx]);
    updateCorrectClasses();
    var el = pieceEls[idx];
    el.classList.add('transitioning');
    el.style.transition = '';
    positionPiece(el, pieces[idx]);
    steps++;
    updateMoves();
    if (!started) startTimer();
    if (checkWin()) onVictory();
}

function doBounceBack(idx) {
    var el = pieceEls[idx];
    el.classList.add('transitioning');
    el.style.transition = '';
    positionPiece(el, pieces[idx]);
}

// === Mouse Drag ===
grid.addEventListener('mousedown', function(e) {
    if (won || e.button !== 0) return;
    var el = e.target.closest('.piece');
    if (!el) return;
    var idx = parseInt(el.dataset.index);
    if (pieces[idx].correct) return;
    e.preventDefault();
    dragPiece = idx;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragDist = 0;
    var m = (el.style.transform || '').match(/translate\(([^,]+)px,\s*([^)]+)px\)/);
    dragOrigX = m ? parseFloat(m[1]) : (pieces[idx].currentCol * ps());
    dragOrigY = m ? parseFloat(m[2]) : (pieces[idx].currentRow * ps());
    el.classList.remove('transitioning');
    el.style.transition = 'none';
});

document.addEventListener('mousemove', function(e) {
    if (dragPiece === null || won) return;
    if (rafId) return;
    rafId = requestAnimationFrame(function() {
        rafId = null;
        var dx = e.clientX - dragStartX;
        var dy = e.clientY - dragStartY;
        dragDist = Math.sqrt(dx * dx + dy * dy);
        if (dragDist < DRAG_THRESHOLD) { hideHighlight(); return; }
        var el = pieceEls[dragPiece];
        el.classList.add('dragging');
        el.style.transform = 'translate(' + (dragOrigX + dx) + 'px, ' + (dragOrigY + dy) + 'px) scale(1.08)';
        var psz = ps();
        var cx = dragOrigX + dx + psz / 2;
        var cy = dragOrigY + dy + psz / 2;
        var t = getCellFromCenter(cx, cy);
        if (t) showHighlight(t.col, t.row);
        else hideHighlight();
    });
});

function snapOrSwap(idx, toRow, toCol) {
    var occupant = findPieceAt(toRow, toCol);
    if (occupant === -1) {
        doSnap(idx, toRow, toCol);
    } else if (occupant !== idx && !pieces[occupant].correct) {
        swapPieces(idx, occupant);
    } else {
        doBounceBack(idx);
    }
}

document.addEventListener('mouseup', function(e) {
    if (dragPiece === null || won) { dragPiece = null; return; }
    var idx = dragPiece;
    dragPiece = null;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    var el = pieceEls[idx];
    el.classList.remove('dragging');
    hideHighlight();
    if (dragDist < DRAG_THRESHOLD) {
        el.style.transition = '';
        el.style.transform = 'translate(' + (pieces[idx].currentCol * ps()) + 'px, ' + (pieces[idx].currentRow * ps()) + 'px)';
        handleClickSwap(idx);
        return;
    }
    var dx = e.clientX - dragStartX;
    var dy = e.clientY - dragStartY;
    var psz = ps();
    var cx = dragOrigX + dx + psz / 2;
    var cy = dragOrigY + dy + psz / 2;
    var t = getCellFromCenter(cx, cy);
    if (t) snapOrSwap(idx, t.row, t.col);
    else doBounceBack(idx);
});

// === Touch Drag ===
grid.addEventListener('touchstart', function(e) {
    if (won) return;
    var el = e.target.closest('.piece');
    if (!el) return;
    var idx = parseInt(el.dataset.index);
    if (pieces[idx].correct) return;
    var touch = e.touches[0];
    dragPiece = idx;
    dragStartX = touch.clientX;
    dragStartY = touch.clientY;
    dragDist = 0;
    var m = (el.style.transform || '').match(/translate\(([^,]+)px,\s*([^)]+)px\)/);
    dragOrigX = m ? parseFloat(m[1]) : (pieces[idx].currentCol * ps());
    dragOrigY = m ? parseFloat(m[2]) : (pieces[idx].currentRow * ps());
    el.classList.remove('transitioning');
    el.style.transition = 'none';
}, {passive: true});

grid.addEventListener('touchmove', function(e) {
    if (dragPiece === null || won) return;
    if (rafId) return;
    rafId = requestAnimationFrame(function() {
        rafId = null;
        var touch = e.touches[0];
        var dx = touch.clientX - dragStartX;
        var dy = touch.clientY - dragStartY;
        dragDist = Math.sqrt(dx * dx + dy * dy);
        if (dragDist < DRAG_THRESHOLD) { hideHighlight(); return; }
        var el = pieceEls[dragPiece];
        el.classList.add('dragging');
        el.style.transform = 'translate(' + (dragOrigX + dx) + 'px, ' + (dragOrigY + dy) + 'px) scale(1.08)';
        var psz = ps();
        var cx = dragOrigX + dx + psz / 2;
        var cy = dragOrigY + dy + psz / 2;
        var t = getCellFromCenter(cx, cy);
        if (t) showHighlight(t.col, t.row);
        else hideHighlight();
    });
}, {passive: true});

grid.addEventListener('touchend', function(e) {
    if (dragPiece === null || won) { dragPiece = null; return; }
    var idx = dragPiece;
    dragPiece = null;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    var el = pieceEls[idx];
    el.classList.remove('dragging');
    hideHighlight();
    if (dragDist < DRAG_THRESHOLD) {
        el.style.transition = '';
        el.style.transform = 'translate(' + (pieces[idx].currentCol * ps()) + 'px, ' + (pieces[idx].currentRow * ps()) + 'px)';
        handleClickSwap(idx);
        return;
    }
    var touch = e.changedTouches[0];
    var dx = touch.clientX - dragStartX;
    var dy = touch.clientY - dragStartY;
    var psz = ps();
    var cx = dragOrigX + dx + psz / 2;
    var cy = dragOrigY + dy + psz / 2;
    var t = getCellFromCenter(cx, cy);
    if (t) snapOrSwap(idx, t.row, t.col);
    else doBounceBack(idx);
}, {passive: true});

// Prevent text selection during drag
grid.addEventListener('selectstart', function(e) {
    if (dragPiece !== null) e.preventDefault();
});
grid.addEventListener('dragstart', function(e) { e.preventDefault(); });

// === Resize ===
window.addEventListener('resize', function() {
    if (won || dragPiece !== null) return;
    positionAll(true);
});

// === Controls ===
previewToggle.addEventListener('click', function() {
    previewVisible = !previewVisible;
    previewImg.style.display = previewVisible ? 'block' : 'none';
    previewToggle.textContent = previewVisible ? '👁️' : '👁️‍🗨️';
});

function startGame() {
    gridSize = parseInt(difficultySelect.value);
    // Reset state
    won = false;
    steps = 0;
    time = 0;
    started = false;
    stopTimer();
    timer = null;
    dragPiece = null;
    selectedPiece = null;
    rafId = null;
    updateMoves();
    updateTime();
    hideHighlight();
    if (!imgSrc) randomImage();
    // Build pieces after image status confirmed
    loadBest();
    initPieces();
    shuffle();
    positionAll(false);
    updateCorrectClasses();
    previewImg.src = imgSrc;
    // Background: detect load failure and swap to fallback if needed
    var testImg = new Image();
    testImg.onerror = function() {
        var c = document.createElement('canvas');
        c.width = 600; c.height = 600;
        var ctx = c.getContext('2d');
        var colors = ['#6366f1','#8b5cf6','#ec4899','#f59e0b','#10b981','#3b82f6'];
        var hue = colors[(imgIndex || 1) - 1];
        ctx.fillStyle = hue;
        ctx.fillRect(0, 0, 600, 600);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        for (var i = 0; i < 8; i++) {
            ctx.beginPath();
            ctx.arc(100 + i * 55, 200 + (i % 3) * 120, 60, 0, Math.PI * 2);
            ctx.fill();
        }
        imgSrc = c.toDataURL();
        previewImg.src = imgSrc;
        // Update all piece backgrounds to fallback image
        Array.prototype.forEach.call(pieceEls, function(el) {
            el.style.backgroundImage = 'url(' + imgSrc + ')';
        });
    };
    testImg.src = imgSrc;
}

function initPieces() {
    pieces = [];
    // Remove old pieces
    grid.querySelectorAll('.piece').forEach(function(el) { el.remove(); });
    var sz = gridSize;
    var frag = document.createDocumentFragment();
    for (var r = 0; r < sz; r++) {
        for (var c = 0; c < sz; c++) {
            var p = { targetRow: r, targetCol: c, currentRow: r, currentCol: c, correct: true };
            pieces.push(p);
            var el = document.createElement('div');
            el.className = 'piece correct';
            el.dataset.index = pieces.length - 1;
            el.style.width = (100 / sz) + '%';
            el.style.height = (100 / sz) + '%';
            el.style.backgroundImage = 'url(' + imgSrc + ')';
            el.style.backgroundSize = (sz * 100) + '% ' + (sz * 100) + '%';
            el.style.backgroundPosition = (c * 100 / (sz - 1)) + '% ' + (r * 100 / (sz - 1)) + '%';
            frag.appendChild(el);
        }
    }
    grid.appendChild(frag);
    pieceEls = grid.querySelectorAll('.piece');
}

function shuffle() {
    var sz = gridSize;
    var total = sz * sz;
    var cnt = shuffleCount();
    for (var i = 0; i < cnt; i++) {
        var a = Math.floor(Math.random() * total);
        var b = Math.floor(Math.random() * total);
        while (b === a) b = Math.floor(Math.random() * total);
        var tmpR = pieces[a].currentRow, tmpC = pieces[a].currentCol;
        pieces[a].currentRow = pieces[b].currentRow;
        pieces[a].currentCol = pieces[b].currentCol;
        pieces[b].currentRow = tmpR;
        pieces[b].currentCol = tmpC;
    }
    // Double-check not accidentally solved
    var allCorrect = true;
    for (var j = 0; j < total; j++) {
        if (pieces[j].currentRow !== pieces[j].targetRow || pieces[j].currentCol !== pieces[j].targetCol) {
            allCorrect = false;
            break;
        }
    }
    if (allCorrect) {
        for (var k = 0; k < 20; k++) {
            var a2 = Math.floor(Math.random() * total);
            var b2 = Math.floor(Math.random() * total);
            while (b2 === a2) b2 = Math.floor(Math.random() * total);
            var tr = pieces[a2].currentRow, tc = pieces[a2].currentCol;
            pieces[a2].currentRow = pieces[b2].currentRow;
            pieces[a2].currentCol = pieces[b2].currentCol;
            pieces[b2].currentRow = tr;
            pieces[b2].currentCol = tc;
        }
    }
}

restartBtn.addEventListener('click', startGame);
changeImgBtn.addEventListener('click', function() {
    randomImage();
    previewImg.src = imgSrc;
    startGame();
});
difficultySelect.addEventListener('change', startGame);

playAgainBtn.addEventListener('click', function() {
    victoryModal.classList.remove('show');
    startGame();
});

challengeHarderBtn.addEventListener('click', function() {
    victoryModal.classList.remove('show');
    var sizes = [3, 5, 7, 9];
    var cur = sizes.indexOf(gridSize);
    if (cur < sizes.length - 1) difficultySelect.value = sizes[cur + 1];
    startGame();
});

// Start
randomImage();
startGame();

})();
</script>
