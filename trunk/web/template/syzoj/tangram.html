<script>
(function(){
"use strict";

/* 形状定义（本地坐标系，单位=格子，原点为包围盒中心）
   标准七巧板：两大三角直角边2、中三角√2、小三角1、正方形边长1、平行四边形边1×√2
   面积校验：2+2+1+0.5+0.5+1+1 = 8 格（修正前 q/p 大了 √2 倍，总面积 9.71 格，永远拼不出图形） */
var SHAPES={
  b1:[[-1,-1],[1,-1],[-1,1]],
  b2:[[-1,-1],[1,-1],[-1,1]],
  m:[[-0.7071,-0.7071],[0.7071,-0.7071],[-0.7071,0.7071]],
  s1:[[-0.5,-0.5],[0.5,-0.5],[-0.5,0.5]],
  s2:[[-0.5,-0.5],[0.5,-0.5],[-0.5,0.5]],
  q:[[-0.5,-0.5],[0.5,-0.5],[0.5,0.5],[-0.5,0.5]],
  p:[[-1.0607,-0.3536],[0.3536,-0.3536],[1.0607,0.3536],[-0.3536,0.3536]]
};
/* 木质积木：7 种木色（底色/纹理线），像一盒真木七巧板，靠木色+形状双重区分 */
var WOODS={
  b1:{base:'#E8C49A',grain:'#C09A6A'}, /* 浅枫木 */
  b2:{base:'#C97B5A',grain:'#A85E42'}, /* 红樱桃 */
  m:{base:'#8B5E3C',grain:'#6E482C'},  /* 深胡桃 */
  s1:{base:'#D2A56B',grain:'#B0864E'}, /* 金橡木 */
  s2:{base:'#A9714A',grain:'#8B5A38'}, /* 柚木 */
  q:{base:'#E6C9A0',grain:'#C4A070'}, /* 蜜色榉木 */
  p:{base:'#7E4A32',grain:'#633824'}  /* 紫檀 */
};
var PIECE_KEYS=['b1','b2','m','s1','s2','q','p'];

/* -------- 关卡数据：slot={k(形状),x,y(块原点落点),r(角度deg),flip(是否镜像)} --------
   全部由格点精确覆盖求解器生成：七块零重叠、零缝隙，正好拼满 8 格。
   注意 x/y 是「积木原点（本地坐标 (0,0)）落在棋盘的哪一点」，不是包围盒中心 ——
   所以贴边的槽位其值可以小于 1 或大于 span，拖拽夹取必须按积木自身外框算（见 clampTo）。 */
/* 7 关取自开源七巧板（tangram-main）的经典图形，坐标经求解器换算：
   参考库大三角直角边 70.7 ↔ 本游戏 2 格，× 2/70.7 归一后按 45° 步进拟合。
   每关面积和 = 8.0000 格、7 类不重复。
   flip:true 表示该块要镜像（只有平行四边形有手性，三角形/正方形的镜像等价于旋转所以不需要标）。 */
var LEVELS=[
 {name:'长方形',hint:false,slots:[
   {k:'b1',x:2.686,y:3.662,r:270},{k:'b2',x:2.6878,y:3.6741,r:90},{k:'q',x:4.169,y:4.1553,r:0},{k:'m',x:5.6376,y:3.6643,r:315},{k:'p',x:4.6448,y:3.1732,r:135},{k:'s1',x:5.1501,y:4.1553,r:270},{k:'s2',x:4.169,y:3.1723,r:0}]},
 {name:'菱形',hint:false,slots:[
   {k:'b1',x:3.6775,y:2.9726,r:315},{k:'b2',x:3.6587,y:2.9726,r:135},{k:'q',x:4.3484,y:4.3698,r:45},{k:'m',x:2.991,y:3.6871,r:270},{k:'p',x:3.3313,y:4.7359,r:0},{k:'s1',x:3.666,y:5.0706,r:225},{k:'s2',x:5.0589,y:3.682,r:315}]},
 {name:'小鱼',hint:false,slots:[
   {k:'b1',x:2.6869,y:4.6492,r:90},{k:'b2',x:2.6869,y:2.6681,r:180},{k:'q',x:4.1681,y:3.6973,r:0},{k:'m',x:5.6596,y:3.2233,r:315},{k:'p',x:5.1492,y:4.1973,r:45},{k:'s1',x:4.1681,y:2.7085,r:270},{k:'s2',x:4.1681,y:4.6802,r:0}]},
 {name:'小牛',hint:false,slots:[
   {k:'b1',x:4.5244,y:4.5153,r:90},{k:'b2',x:2.7667,y:4.1681,r:135},{k:'q',x:2.2856,y:3.2539,r:0},{k:'m',x:4.1753,y:5.1591,r:45},{k:'p',x:6.0055,y:4.5158,r:45},{k:'s1',x:3.2813,y:2.2539,r:180},{k:'s2',x:1.3306,y:2.2539,r:270}]},
 {name:'帆船',hint:false,slots:[
   {k:'b1',x:4.6513,y:4.5823,r:45},{k:'b2',x:3.2487,y:3.1681,r:135},{k:'q',x:2.7676,y:4.0823,r:0},{k:'m',x:4.2334,y:4.5634,r:225},{k:'p',x:3.2482,y:5.0634,r:135,flip:true},{k:'s1',x:1.7707,y:4.0823,r:180},{k:'s2',x:2.7676,y:3.1012,r:180}]},
 {name:'火箭',hint:false,slots:[
   {k:'b1',x:4.5457,y:2.8035,r:315},{k:'b2',x:4.5268,y:2.8035,r:135},{k:'q',x:3.4906,y:3.8426,r:45},{k:'m',x:5.2351,y:2.1151,r:90},{k:'p',x:2.4546,y:3.4855,r:0,flip:true},{k:'s1',x:4.1904,y:4.5385,r:315},{k:'s2',x:3.4839,y:5.2398,r:135}]},
 {name:'天鹅',hint:false,slots:[
   {k:'b1',x:3.8918,y:4.9127,r:270},{k:'b2',x:4.2916,y:3.9162,r:225},{k:'q',x:2.6209,y:3.5286,r:45},{k:'m',x:2.9107,y:4.9127,r:315},{k:'p',x:2.9767,y:2.4841,r:90,flip:true},{k:'s1',x:1.9171,y:4.2105,r:135},{k:'s2',x:2.1303,y:1.9261,r:180}]}
];

/* -------- 全局状态 -------- */
var state={lv:1,moves:0,sec:0,placed:0,selected:null,drag:null,win:false,timer:null};
var CELL=0,GS=0,STAGE_W=0,STAGE_H=0,TRAY_Y=0,TRAY_SCALE=1,TRAY_COLS=4,TRAY_ROWS=2,pieces=[];
var $=function(id){return document.getElementById(id);};
var silEl=$('tgSil'),stage=$('tgStage');
function ql(s){return Array.prototype.slice.call(document.querySelectorAll(s));}

/* anime.js v4 自托管：缺失/减动效时全部效果自动降级到 CSS */
var A=window.anime||null;
function reduced(){try{return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}}
function canAnimate(){return !!A && !reduced();}
function sketchOn(){return !!(window.GameSketch&&window.GameSketch.available);}

/* 统计数字弹性跳动：优先 anime.js，降级 CSS 类 */
function bounce(el){
  if(!el)return;
  if(canAnimate()){A.animate(el,{scale:[1,1.22,1],ease:'out(2)',duration:420});return;}
  var card=el.closest?el.closest('.tg-stat'):null;
  var t=card||el;
  t.classList.remove('sbounce');void t.offsetWidth;t.classList.add('sbounce');
}
/* 反馈条：彩色底 + 弹性弹入 */
function msg(t,type){
  var el=$('tgMsg');if(!el)return;
  el.textContent=t;
  el.className='tg-msg'+(type?(' tg-'+type):'');
  if(canAnimate())A.animate(el,{opacity:[0,1],scale:[.92,1],y:[8,0],ease:'out(3)',duration:340});
}
/* 按钮波纹 */
function addRipple(e,btn){
  var r=btn.getBoundingClientRect();
  var d=Math.max(r.width,r.height);
  var s=document.createElement('span');
  s.className='tg-ripple';
  s.style.width=s.style.height=d+'px';
  s.style.left=(e.clientX-r.left-d/2)+'px';
  s.style.top=(e.clientY-r.top-d/2)+'px';
  btn.appendChild(s);
  setTimeout(function(){s.remove();},620);
}

function polyToStr(pts){return pts.map(function(p){return p[0]+','+p[1];}).join(' ');}
function hexA(hex,a){var n=parseInt(hex.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
/* 像素化一段本地形状 → 元素内坐标（pivot=包围盒中心=element中心） */
function localPx(pts){var out=[];for(var i=0;i<pts.length;i++)out.push([pts[i][0]*CELL+CELL,pts[i][1]*CELL+CELL]);return out;}

/* 棋盘几何包络（按「当前关卡」单独算，不跨关）：棋盘按本关真实内容开框，
   否则 45° 大三角/平行四边稿会戳出画布边框。
   按关算而不是全局最大包络是关键：正方形关跨度 2.83 格、最长的牛关 5.68 格，
   两者共用同一块棋盘预算时紧凑关的积木会缩到 1/2，手机上很难拖 */
var GEO={span:4,ox:0,oy:0};
function calcGeo(slots){
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(var si=0;si<slots.length;si++){
    var s=slots[si],pts=SHAPES[s.k],a=s.r*Math.PI/180,c=Math.cos(a),sn=Math.sin(a);
    for(var pi=0;pi<pts.length;pi++){
      var x=pts[pi][0]*c-pts[pi][1]*sn+s.x,y=pts[pi][0]*sn+pts[pi][1]*c+s.y;
      if(x<minX)minX=x;if(x>maxX)maxX=x;
      if(y<minY)minY=y;if(y>maxY)maxY=y;
    }
  }
  var pad=0.2; /* 描边/手绘歪扭/drop-shadow 的余量（格） */
  var cw=maxX-minX+pad*2,ch=maxY-minY+pad*2;
  GEO.span=Math.max(cw,ch);
  GEO.ox=pad-minX+(GEO.span-cw)/2; /* 网格 x=0 → GEO.ox*CELL（内容在棋盘内居中） */
  GEO.oy=pad-minY+(GEO.span-ch)/2;
}
calcGeo(LEVELS[0].slots);
/* 网格坐标 → 舞台像素。槽位与积木共用这套映射，天然对齐 */
function bx(gx){return (gx+GEO.ox)*CELL;}
function by(gy){return (gy+GEO.oy)*CELL;}

/* 降级用平面多边形 SVG（stroke 由调用方给） */
function plainSvg(pts,fill,elW,stroke,sw){
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+elW+' '+elW+'"><polygon points="'+polyToStr(pts)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" stroke-linejoin="round"/></svg>';
}

/* 手绘木纹：全盒积木共用同一纹路方向（像同一块木板裁下来的），clip 在形状内不外溢 */
function woodGrain(svg,pts,grain,seed){
  if(!sketchOn()||!svg)return;
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(var i=0;i<pts.length;i++){
    if(pts[i][0]<minX)minX=pts[i][0];if(pts[i][0]>maxX)maxX=pts[i][0];
    if(pts[i][1]<minY)minY=pts[i][1];if(pts[i][1]>maxY)maxY=pts[i][1];
  }
  var NS='http://www.w3.org/2000/svg';
  var id='tg-grain-'+seed;
  var defs=document.createElementNS(NS,'defs');
  var cp=document.createElementNS(NS,'clipPath');cp.setAttribute('id',id);
  var pg=document.createElementNS(NS,'polygon');pg.setAttribute('points',polyToStr(pts));
  cp.appendChild(pg);defs.appendChild(cp);svg.appendChild(defs);
  var g=document.createElementNS(NS,'g');g.setAttribute('clip-path','url(#'+id+')');svg.appendChild(g);
  var sw=Math.max(1,CELL*0.022);
  for(var i=0;i<4;i++){
    var y=minY+(maxY-minY)*((i+0.5)/4)+((i%2)?1:-1)*(maxY-minY)*0.05;
    GameSketch.line(g,minX-2,y,maxX+2,y+((i%2)?2.2:-2.2),{
      stroke:grain,strokeWidth:sw,roughness:1.7,bowing:1.3,
      seed:GameSketch.seedFrom(seed+'g'+i)
    },'tg-grain');
  }
}

/* 剪影描边：深棕粗实线——小尺寸下虚线会碎成糊，实线才看得出轮廓 */
var INK_COLOR='#5E3A1C',INK_W=2.8,CARVE_COLOR='#7a5a3a';
/* 画一块形状进 el：rough 手绘优先，无 rough.js 退平面 SVG
   —— 必须先 appendChild 到 DOM 再调（svgInto 要量 offsetWidth） */
function drawShape(el,pts,fill,seed,mode,grain){
  var ghost=(mode==='ghost');
  if(sketchOn()){
    var svg=GameSketch.svgInto(el);
    if(svg){
      var opt={
        fill:fill,fillStyle:'solid',
        stroke:ghost?INK_COLOR:CARVE_COLOR,
        strokeWidth:ghost?INK_W:2,
        roughness:1.35,bowing:0.85,
        seed:GameSketch.seedFrom(seed)
      };
      GameSketch.polygon(svg,pts,opt,ghost?'tg-ghost':'tg-shape');
      if(!ghost&&grain)woodGrain(svg,pts,grain,seed);
      return;
    }
  }
  var sw2=ghost?INK_W*1.2:Math.max(1.6,CELL*0.03);
  el.innerHTML=plainSvg(pts,fill,CELL*2,ghost?INK_COLOR:CARVE_COLOR,sw2);
}
/* 关卡差异只在色：前几关用木色提示，后面统一深灰剪影 */
function silStyle(k,hint){
  return hint?{fill:hexA(WOODS[k].grain,.55),stroke:WOODS[k].grain}
            :{fill:'rgba(110,92,72,.55)',stroke:INK_COLOR};
}

/* 渲染剪影（由 7 块目标拼出）：每槽一个 div，rough polygon 填色 + 深棕粗实线描边 */
function renderSil(){
  var lv=LEVELS[state.lv-1];
  silEl.innerHTML='';
  silEl.style.width=GS+'px';silEl.style.height=GS+'px';
  silEl.classList.remove('wiggle');
  document.body.classList.toggle('gs-sketch',sketchOn());
  for(var i=0;i<lv.slots.length;i++){
    var sl=lv.slots[i];
    var d=document.createElement('div');
    d.className='tg-slot';
    d.style.width=d.style.height=(CELL*2)+'px';
    d.style.left=(bx(sl.x)-CELL)+'px';
    d.style.top=(by(sl.y)-CELL)+'px';
    d.style.transform='rotate('+sl.r+'deg)'+(sl.flip?' scaleX(-1)':'');
    silEl.appendChild(d);   /* 入 DOM 后再画，否则量不出尺寸 */
    var st=silStyle(sl.k,lv.hint);
    drawShape(d,localPx(SHAPES[sl.k]),st.fill,'sil'+sl.k,'ghost');
    /* 深色实线补描边（叠在 rough 图形之上）：小块被缩放后虚线会碎成糊，实线才出轮廓 */
    if(!lv.hint){
      var ov=document.createElement('div');
      ov.className='tg-slot tg-slot-ink';
      ov.style.cssText=d.style.cssText;
      ov.innerHTML='<svg viewBox="0 0 '+(CELL*2)+' '+(CELL*2)+'" width="100%" height="100%">'+
        '<polygon points="'+polyToStr(localPx(SHAPES[sl.k]))+'" fill="none" stroke="'+INK_COLOR+'" stroke-width="'+INK_W+'" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
      silEl.appendChild(ov);
    }
  }
  /* 手绘棋盘边框（叠加式，不占布局） */
  if(sketchOn())GameSketch.frame(silEl,{inset:5,color:'rgba(74,55,40,.38)',strokeWidth:2,roughness:1.5,bowing:1,seed:11});
}

/* 建 7 块积木：preserve=保留已落位状态（resize 用），shuffle=托盘洗牌（开局用） */
function buildPieces(preserve,shuffle){
  var index={};
  if(preserve)for(var i=0;i<pieces.length;i++)index[pieces[i].k]={rot:pieces[i].rot,flip:pieces[i].flip,placed:pieces[i].placed};
  pieces.forEach(function(p){p.el.remove();});
  pieces=[];
  var lv=LEVELS[state.lv-1];
  var keys=PIECE_KEYS.slice();
  if(shuffle){for(var i=keys.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=keys[i];keys[i]=keys[j];keys[j]=t;}}
  for(var i=0;i<keys.length;i++){
    var k=keys[i],slot=null;
    for(var s=0;s<lv.slots.length;s++)if(lv.slots[s].k===k){slot=lv.slots[s];break;}
    var el=document.createElement('div');
    el.className='tg-piece';
    el.style.width=(CELL*2)+'px';el.style.height=(CELL*2)+'px';
    el.style.setProperty('--tg-sw',Math.max(2,CELL*0.045)+'px');
    el.style.setProperty('--tg-gc',WOODS[k].grain);
    el.style.setProperty('--tg-gsw',Math.max(1,CELL*0.022)+'px');
    stage.appendChild(el);   /* 入 DOM 后再画 */
    drawShape(el,localPx(SHAPES[k]),WOODS[k].base,'pc'+k,'solid',WOODS[k].grain);
    var was=(preserve&&index[k])?index[k]:{rot:slot.r-90,placed:false};
    var p={k:k,el:el,rot:was.rot,flip:(was.flip===undefined?(!!slot.flip):was.flip),cx:0,cy:0,placed:was.placed,targetX:slot.x,targetY:slot.y,targetR:slot.r,targetFlip:!!slot.flip,tray:!was.placed,scale:1,lifted:false};
    if(p.placed){p.cx=bx(p.targetX);p.cy=by(p.targetY);el.classList.add('placed');el.style.pointerEvents='none';setPiecePos(p,p.cx,p.cy);}
    pieces.push(p);
    el.addEventListener('pointerdown',onDown);
  }
  layoutTray();
}

/* 托盘：2 行网格（4+3 行内居中），块按 TRAY_SCALE 缩小塞进棋盘同宽——
   7 块原尺寸并排要 ~16 倍 CELL 宽，必然把卡片撑出横向滚动条 */
function trayPosOf(i){
  var cols=TRAY_COLS;
  var row=Math.floor(i/cols),col=i%cols;
  var rowCount=Math.min(cols,pieces.length-row*cols);
  var pitch=STAGE_W/cols;
  var x=pitch*(col+(cols-rowCount)/2)+pitch/2;
  var y=TRAY_Y+22+CELL*TRAY_SCALE+row*(CELL*2*TRAY_SCALE+8);
  return {x:x,y:y};
}
function layoutTray(){
  for(var i=0;i<pieces.length;i++){
    if(pieces[i].placed)continue;
    pieces[i].tray=true;pieces[i].scale=TRAY_SCALE;
    var pos=trayPosOf(i);
    setPiecePos(pieces[i],pos.x,pos.y);
  }
}

/* 位置/旋转/缩放应用（几何 transform 走 style，动画只作用在内层 svg，互不打架）
   翻转 = 负 scale-x：绕包围盒中心镜像，正好等于「形状点 x 取反」，
   且不动任何落位/命中数学（本游戏各件本地坐标都以包围盒中心为原点） */
function setPiecePos(p,x,y){
  p.cx=x;p.cy=y;
  var sx=(p.scale||1)*(p.flip?-1:1);
  p.el.style.transform='translate('+(x-CELL)+'px,'+(y-CELL)+'px) rotate('+p.rot+'deg) scale('+sx+','+(p.scale||1)+')';
}

/* 拖拽 */
var curDrag=null,offX=0,offY=0;
function onDown(e){
  e.preventDefault();
  var p=pieces.find(function(x){return x.el===e.currentTarget;});
  if(state.win||!p||p.placed)return;
  if(state.drag&&state.drag!==p)state.drag.el.classList.remove('dragging');
  deselect();
  select(p);
  curDrag=p;
  var pt=clientToStage(e);
  offX=pt.x-p.cx;offY=pt.y-p.cy;
  p.lifted=false;
  p.el.classList.add('dragging');
  state.drag=p;
  try{p.el.setPointerCapture(e.pointerId);}catch(err){}
}
/* 拖拽夹取边界：按「积木旋转后的实际外框」算，而不是固定留 1 格。
   两个坑：
   1) 固定留 1 格时，半宽 1.414 格的大三角/平行四边形够不到贴棋盘边或贴角的槽位。
   2) 外框相对积木原点并不对称 —— 中三角转 315° 后只向 -x 伸 1 格、向 +x 伸 0。
      若用对称半宽 max(|x|) 夹取，上限会被压到 STAGE_W-1 格，
      贴右边的槽位（第一关最右那块 m）就永远够不到。必须用 mnx/mxx 分别算上下限。
   留 0.02 格余量，避免外框正好压线时被浮点误差弹回。 */
function clampTo(p,nx,ny){
  var pts=SHAPES[p.k],a=p.rot*Math.PI/180,c=Math.cos(a),sn=Math.sin(a);
  var mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
  for(var i=0;i<pts.length;i++){
    var x=pts[i][0]*c-pts[i][1]*sn,y=pts[i][0]*sn+pts[i][1]*c;
    if(x<mnx)mnx=x;if(x>mxx)mxx=x;
    if(y<mny)mny=y;if(y>mxy)mxy=y;
  }
  var slack=0.02*CELL;
  var loX=-mnx*CELL-slack,hiX=STAGE_W-mxx*CELL+slack;
  var loY=-mny*CELL-slack,hiY=STAGE_H-mxy*CELL+slack;
  nx=(loX>hiX)?STAGE_W/2:Math.max(loX,Math.min(hiX,nx));
  ny=(loY>hiY)?STAGE_H/2:Math.max(loY,Math.min(hiY,ny));
  return {x:nx,y:ny};
}
function onMove(e){
  if(!state.drag)return;
  e.preventDefault();
  var pt=clientToStage(e);
  var p=state.drag;
  if(!p.lifted){p.lifted=true;p.scale=1;} /* 拖起瞬间恢复原尺寸 */
  var c=clampTo(p,pt.x-offX,pt.y-offY);
  setPiecePos(p,c.x,c.y);
}
function onUp(e){
  if(!state.drag)return;
  var p=state.drag;
  p.el.classList.remove('dragging');
  state.drag=null;
  p.lifted=false;
  var dx=(p.cx-bx(p.targetX)),dy=(p.cy-by(p.targetY));
  var dist=Math.sqrt(dx*dx+dy*dy);
  var tol=CELL*0.10;
  var dr=wrapAngle(p.targetR-p.rot);
  var flipOk=((!!p.flip)===p.targetFlip);   /* 翻转态必须匹配，否则平行四边形左右手反了 */
  if(dist<=tol&&Math.abs(dr)<=10&&flipOk){
    placePiece(p);
    return;
  }
  /* 落回托盘区 → 缩回托盘尺寸；停在棋盘区 → 保持原尺寸 */
  p.tray=(p.cy>=TRAY_Y);
  p.scale=p.tray?TRAY_SCALE:1;
  setPiecePos(p,p.cx,p.cy);
  if(dist<=CELL*0.6&&Math.abs(dr)<=25&&flipOk){
    msg('差一点点，再挪挪~','warn');
    if(canAnimate()){
      var svg=p.el.querySelector('svg');
      if(svg)A.animate(svg,{x:[0,-7,6,-4,3,0],ease:'out(2)',duration:380});
    }
  }
}
function placePiece(p){
  p.rot=p.targetR;
  p.flip=p.targetFlip;
  p.scale=1;p.tray=false;
  setPiecePos(p,bx(p.targetX),by(p.targetY));
  p.placed=true;
  p.el.classList.add('placed','flashSvg');
  p.el.style.pointerEvents='none';
  state.placed++;state.moves++;
  updateStats();bounce($('tgMoves'));
  deselect();refreshDisabled();
  /* 落位弹性绽开（作用在内层 svg，不碰几何 transform） */
  if(canAnimate()){
    var svg=p.el.querySelector('svg');
    if(svg)A.animate(svg,{scale:[0.82,1.07,1],ease:'out(3)',duration:430});
  }
  if(state.placed>=7){winLevel();}
  else{msg('落位啦！还剩 '+(7-state.placed)+' 块~','ok');}
}

function clientToStage(e){
  var r=stage.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
function wrapAngle(a){a=a%360;if(a>180)a-=360;if(a<-180)a+=360;return a;}

/* 选中/旋转 */
function select(p){
  deselect();
  p.el.classList.add('selected');
  state.selected=p;
  refreshDisabled();
}
function deselect(){
  if(state.selected)state.selected.el.classList.remove('selected');
  state.selected=null;
  refreshDisabled();
}
function rotateSel(){
  if(!state.selected||state.selected.placed)return;
  var p=state.selected;
  p.rot=(p.rot+45)%360;
  if(!p.lifted){p.tray=(p.cy>=TRAY_Y);p.scale=p.tray?TRAY_SCALE:1;}
  setPiecePos(p,p.cx,p.cy);
  state.moves++;
  updateStats();bounce($('tgMoves'));
  if(canAnimate()){
    var svg=p.el.querySelector('svg');
    if(svg)A.animate(svg,{scale:[1,1.13,1],ease:'out(2)',duration:300});
  }
}
/* 翻转：仅平行四边形（唯一有手性的块）。负 scale-x 绕包围盒中心镜像 */
function flipSel(){
  if(!state.selected||state.selected.placed)return;
  var p=state.selected;
  if(p.k!=='p')return;   /* 三角形/正方形的镜像等价于旋转 90°，转一下就行，不需要翻转 */
  p.flip=!p.flip;
  if(!p.lifted){p.tray=(p.cy>=TRAY_Y);p.scale=p.tray?TRAY_SCALE:1;}
  setPiecePos(p,p.cx,p.cy);
  state.moves++;
  updateStats();bounce($('tgMoves'));
  if(canAnimate()){
    var svg=p.el.querySelector('svg');
    if(svg)A.animate(svg,{scale:[1,1.13,1],ease:'out(2)',duration:300});
  }
}

/* 统计/计时 */
function updateStats(){
  $('tgMoves').textContent=state.moves;
  $('tgTime').textContent=fmt(state.sec);
  $('tgLv').textContent=state.lv+' / '+LEVELS.length;
  var lv=LEVELS[state.lv-1],nm=$('tgLvName');
  if(nm)nm.textContent=lv.name+(lv.hint?' · 彩色提示':' · 灰剪影');
  var best=loadBest(state.lv);
  $('tgBest').textContent=best?fmt(best):'--';
}
function fmt(s){if(s===null||s===undefined)return'--';var m=Math.floor(s/60),sec=s%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');}
function tick(){state.sec++;updateStats();}
function loadBest(lv){try{var v=localStorage.getItem('tg_best_L'+lv);return v?parseInt(v,10):null;}catch(e){return null;}}
function saveBest(lv,t){try{localStorage.setItem('tg_best_L'+lv,String(t));}catch(e){}}

/* 尺寸适配：用 wrap 内容盒反推棋盘边长（全部难度档共用）。
   关键：可用高度必须从 wrap 实测，不能用 window.innerHeight——
   那样会漏掉 body 的 margin-top(顶部导航) 与 wrap 自身 padding，算出来必然偏大、撑出一屏。
   分栏后竖向预算：标题永远在最上；分栏时侧栏与舞台并排（不占竖向），单列时侧栏在上（实测扣高）。 */
function layout(preserve){
  var wrap=document.querySelector('.tg-wrap');
  var card=document.querySelector('.tg-card');
  var layoutEl=document.querySelector('.tg-layout');
  var sideEl=document.querySelector('.tg-side');
  var titleEl=document.querySelector('.tg-title');
  /* wrap 高度钉死为「视口 - 顶部导航实际占位」；hide_chrome 时 top=0 自动退化 */
  if(wrap){
    var top=Math.max(0,Math.ceil(wrap.getBoundingClientRect().top));
    wrap.style.height='calc(100dvh - '+top+'px)';
    wrap.style.minHeight=wrap.style.height;
  }
  var cs=card?getComputedStyle(card):null;
  var padT=cs?(parseFloat(cs.paddingTop)||0):14;
  var padB=cs?(parseFloat(cs.paddingBottom)||0):14;
  var cardGap=cs?(parseFloat(cs.rowGap)||parseFloat(cs.gap)||0):8;
  /* 可用高度 = wrap 内容盒(已扣 wrap padding) - card 自身 padding */
  var availForCard;
  if(wrap){
    var wcs=getComputedStyle(wrap);
    availForCard=wrap.clientHeight-(parseFloat(wcs.paddingTop)||0)-(parseFloat(wcs.paddingBottom)||0);
  }else{
    availForCard=window.innerHeight-60;
  }
  var availInner=availForCard-padT-padB;
  var titleH=titleEl?titleEl.offsetHeight:0;
  /* 竖向预算：先扣标题 + card 间距；单列再扣侧栏实测高（分栏时侧栏并排不占高） */
  var stageBudget=availInner-titleH-cardGap-4;
  var rowMode=!!(layoutEl&&getComputedStyle(layoutEl).flexDirection.indexOf('row')===0);
  if(!rowMode&&sideEl){
    var lcs=layoutEl?getComputedStyle(layoutEl):null;
    var lgap=lcs?(parseFloat(lcs.rowGap)||parseFloat(lcs.gap)||0):0;
    stageBudget-=sideEl.offsetHeight+lgap;
  }
  /* 可用量父容器宽（stage 会被钉成 GS 宽，不能用它自量） */
  var hostEl=stage.parentElement;
  var availW=Math.max(200,(hostEl?hostEl.clientWidth:document.documentElement.clientWidth)-12);
  /* 棋盘包络按当前关卡重算（每关自适应放大）：必须在算 TRAY_SCALE/GS 之前 */
  calcGeo(LEVELS[state.lv-1].slots);
  /* 托盘块缩放只与跨度有关（GS 在 (GS/cols)/(CELL*2.2) 里约掉）：
     托盘高 = 22+rows*2*CELL*s+8*(rows-1) = 常量+trayK*GS → 闭式解 GS */
  TRAY_SCALE=Math.min(0.85,GEO.span/(TRAY_COLS*2.2));
  var trayK=TRAY_ROWS*2*TRAY_SCALE/GEO.span;
  GS=Math.min(availW,Math.max(110,(stageBudget-36-8*(TRAY_ROWS-1))/(1+trayK)));
  CELL=GS/GEO.span;
  STAGE_W=GS;
  stage.style.width=GS+'px';
  stage.style.margin='0 auto'; /* 舞台=棋盘同宽居中，槽位/积木同一坐标系 */
  TRAY_Y=GS+14;
  var trayH=22+TRAY_ROWS*(CELL*2*TRAY_SCALE)+8*(TRAY_ROWS-1);
  stage.style.height=(TRAY_Y+trayH)+'px';
  STAGE_H=stage.clientHeight;
  var trayEl=stage.querySelector('.tg-tray');
  if(trayEl)trayEl.style.top=TRAY_Y+'px';
  renderSil();
  buildPieces(!!preserve,false);
}

/* 通关 */
function winLevel(){
  state.win=true;clearInterval(state.timer);
  updateStats();
  var lv=LEVELS[state.lv-1];
  /* 剪影活过来：某块脉动 + 整体 wiggle（只动 opacity/filter，不碰 inline rotate） */
  var slots=ql('.tg-slot');
  var idx=Math.floor(Math.random()*slots.length);
  if(!lv.hint&&slots[idx])slots[idx].classList.add('tg-pulse');
  silEl.classList.add('wiggle');
  var best=loadBest(state.lv);
  var isNew=!best||state.sec<best;
  if(isNew)saveBest(state.lv,state.sec);
  /* 积木 stagger 绽放（动画走内层 svg） */
  var svgs=[];
  for(var i=0;i<pieces.length;i++){var s=pieces[i].el.querySelector('svg');if(s)svgs.push(s);}
  if(canAnimate()&&svgs.length){
    A.animate(svgs,{scale:[1,1.13,1],ease:'out(3)',duration:520,delay:A.stagger(70)});
  }
  setTimeout(function(){showVictory(isNew);},canAnimate()&&svgs.length?(svgs.length*70+260):420);
}

/* 从弹窗中心绽开礼花（移动端 origin 偏底时不走 game_confetti 的 y:.7） */
function launchConfettiFromCard(card){
  if(typeof confetti!=='function'||typeof confetti.create!=='function'){
    if(window.launchConfetti){try{window.launchConfetti();}catch(e){}}
    return;
  }
  var r=card.getBoundingClientRect();
  var ox=Math.min(0.92,Math.max(0.08,(r.left+r.width/2)/window.innerWidth));
  var oy=Math.min(0.92,Math.max(0.08,(r.top+r.height*0.32)/window.innerHeight));
  var canvas=document.createElement('canvas');
  canvas.style.cssText='position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:2147483647;';
  document.body.appendChild(canvas);
  var fire=confetti.create(canvas,{resize:true,useWorker:false});
  var colors=['#E85D4A','#F2B441','#7CB342','#4FA3C7','#9575CD','#F49AC2'];
  var end=Date.now()+1500;
  (function frame(){
    fire({particleCount:5,spread:60,origin:{x:ox,y:oy},colors:colors,disableForReducedMotion:true});
    if(Date.now()<end)requestAnimationFrame(frame);
  }());
  setTimeout(function(){try{fire.reset();}catch(e){} if(canvas.parentNode)canvas.parentNode.removeChild(canvas);},3500);
}

/* 手绘五角星（通关奖章） */
function drawVStar(el){
  if(!el||!sketchOn())return;
  var svg=GameSketch.svgInto(el);
  if(!svg)return;
  var w=el.offsetWidth,h=el.offsetHeight,cx=w/2,cy=h/2;
  var R=Math.min(w,h)*0.48,r=R*0.44,pts=[];
  for(var i=0;i<10;i++){
    var ang=-Math.PI/2+i*Math.PI/5,rad=(i%2===0)?R:r;
    pts.push([cx+Math.cos(ang)*rad,cy+Math.sin(ang)*rad]);
  }
  GameSketch.polygon(svg,pts,{fill:'#F2B441',fillStyle:'solid',stroke:'#E08A1E',strokeWidth:2,roughness:1.4,bowing:0.9,seed:GameSketch.seedFrom('vstar')},'tg-vstar-g');
}

function showVictory(isNew){
  $('tgVTime').textContent=fmt(state.sec);
  $('tgVMoves').textContent=state.moves;
  $('tgVBest').textContent=fmt(loadBest(state.lv));
  $('tgVStat').innerHTML=isNew?'<div class="tg-newbest">🎊 新最佳纪录！</div>':'';
  var overlay=$('tgVictory'),card=overlay.querySelector('.tg-vwin');
  overlay.classList.remove('hidden');   /* 先显示，星标才量得出尺寸 */
  var vs=$('tgVStar');
  if(vs&&!vs.dataset.drawn&&sketchOn()){vs.dataset.drawn='1';drawVStar(vs);}
  if(canAnimate()){
    A.animate(card,{opacity:[0,1],scale:[.82,1],y:[18,0],ease:'out(4)',duration:520});
    if(vs&&vs.dataset.drawn)A.animate(vs,{scale:[0,1],rotate:[-40,0],ease:'out(4)',duration:560,delay:120});
  }else{
    card.classList.remove('tg-vwin-in');void card.offsetWidth;card.classList.add('tg-vwin-in');
  }
  /* 弹窗与礼花同时出现 */
  try{setTimeout(function(){launchConfettiFromCard(card);},60);}catch(e){}
}

/* 标题图标：手绘小房子七巧板（emoji 仅降级） */
function drawTitleIcon(){
  var el=$('tgTitleIcon');
  if(!el||!sketchOn())return;
  var svg=GameSketch.svgInto(el);
  if(!svg)return;
  var w=el.offsetWidth,h=el.offsetHeight,s=Math.min(w,h);
  var cx=w/2,cy=h/2,u=s*0.40;
  function P(pts,fill,seed){
    GameSketch.polygon(svg,pts,{fill:fill,fillStyle:'solid',stroke:'#7a5a3a',strokeWidth:1.6,roughness:1.3,bowing:0.7,seed:GameSketch.seedFrom(seed)},'tg-ticon');
  }
  P([[cx,cy-u*1.18],[cx-u*1.12,cy+u*0.12],[cx+u*1.12,cy+u*0.12]],'#C97B5A','ti1');
  P([[cx-u*0.74,cy+u*0.26],[cx+u*0.02,cy+u*0.26],[cx+u*0.02,cy+u*1.02],[cx-u*0.74,cy+u*1.02]],'#E8C49A','ti2');
  P([[cx+u*0.18,cy+u*0.32],[cx+u*1.02,cy+u*0.32],[cx+u*0.18,cy+u*1.04]],'#8B5E3C','ti3');
}

/* 关卡切换 */
function loadLevel(n){
  if(n<1)n=1;if(n>LEVELS.length)n=LEVELS.length;
  state.lv=n;state.moves=0;state.sec=0;state.placed=0;state.win=false;state.selected=null;state.drag=null;
  if(state.timer)clearInterval(state.timer);
  updateStats();
  layout(false);   /* 新关卡必须重建，不能沿用上一关的 placed 状态 */
  state.timer=setInterval(tick,1000);
  $('tgVictory').classList.add('hidden');
  refreshDisabled();
  msg('拖一块到阴影里，拼成「'+LEVELS[n-1].name+'」~','hint');
}
function refreshDisabled(){
  $('tgPrev').disabled=(state.lv<=1);
  $('tgNext').disabled=(state.lv>=LEVELS.length);
  var sel=state.selected&&!state.selected.placed?state.selected:null;
  $('tgRot').disabled=!sel;
  /* 翻转只对平行四边形开放（画面上才看得出区别） */
  $('tgFlip').disabled=!(sel&&sel.k==='p');
}

/* 事件绑定（弹窗按钮走 document 委托，DOM 顺序变化也不会拖死整个 IIFE） */
stage.addEventListener('pointermove',onMove);
stage.addEventListener('pointerup',onUp);
stage.addEventListener('pointercancel',function(){
  if(!state.drag)return;
  state.drag.el.classList.remove('dragging');
  state.drag.lifted=false;
  state.drag.tray=(state.drag.cy>=TRAY_Y);
  state.drag.scale=state.drag.tray?TRAY_SCALE:1;
  setPiecePos(state.drag,state.drag.cx,state.drag.cy);
  state.drag=null;
});
$('tgRot').addEventListener('click',function(e){addRipple(e,$('tgRot'));rotateSel();});
$('tgFlip').addEventListener('click',function(e){addRipple(e,$('tgFlip'));flipSel();});
$('tgRestart').addEventListener('click',function(e){addRipple(e,$('tgRestart'));loadLevel(state.lv);});
$('tgPrev').addEventListener('click',function(e){addRipple(e,$('tgPrev'));loadLevel(state.lv-1);});
$('tgNext').addEventListener('click',function(e){addRipple(e,$('tgNext'));loadLevel(state.lv+1);});
document.addEventListener('click',function(e){
  if(!e.target||!e.target.closest)return;
  if(e.target.closest('#tgAgain')){
    if(state.lv>=LEVELS.length){$('tgVictory').classList.add('hidden');return;}
    loadLevel(state.lv+1);
  }else if(e.target.closest('#tgClose')){
    $('tgVictory').classList.add('hidden');
  }
});
var rzT=null;
window.addEventListener('resize',function(){
  clearTimeout(rzT);
  rzT=setTimeout(function(){if(!state.win)layout(true);},160);
});

/* 启动 */
document.body.classList.toggle('gs-sketch',sketchOn());
loadLevel(1);
drawTitleIcon();
})();
</script>
