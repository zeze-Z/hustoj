<script>
class NumberPuzzle {
    constructor() {
        this.grid = document.getElementById('grid');
        this.movesEl = document.getElementById('moves');
        this.timeEl = document.getElementById('time');
        this.bestEl = document.getElementById('best');
        this.diffBtns = document.getElementById('diffBtns');
        this.restartBtn = document.getElementById('restart');
        this.victoryModal = document.getElementById('victoryModal');
        this.playAgainBtn = document.getElementById('playAgain');
        this.victoryMovesEl = document.getElementById('victoryMoves');
        this.victoryTimeEl = document.getElementById('victoryTime');

        this.size = 4;
        this.total = this.size * this.size;
        this.board = [];   // 一维数组，0=空格，1-15=数字
        this.emptyIdx = 0; // 空格在一维数组中的索引
        this.moves = 0;
        this.time = 0;
        this.timer = null;
        this.isWon = false;
        this.isAnimating = false;

        this.bestTime = localStorage.getItem('puzzleBestTime');
        if (this.bestTime) this.bestEl.textContent = this.fmtTime(+this.bestTime);

        this.bindEvents();
        this.init();
    }

    /* ---------- 初始化 ---------- */

    init() {
        this.updateDiffHint();
        this.board = [];
        this.moves = 0;
        this.time = 0;
        this.isWon = false;
        this.isAnimating = false;
        if (this.timer) { clearInterval(this.timer); this.timer = null; }
        this.updateMoves();
        this.updateTime();

        // 生成已完成状态 [1,2,...,15,0]
        for (let i = 1; i < this.total; i++) this.board.push(i);
        this.board.push(0);
        this.emptyIdx = this.total - 1;

        this.shuffle();
        this.render();
        this.startTimer();
    }

    shuffle() {
        const diff = this.getDifficulty();

        if (diff === 'easy') {
            // 简单：1-8已排好，只打乱最后两行（位置8-15），BFS保证最优解>=3步
            // 注：4格最后一行最多只有3步且3步题唯一，故扩大到最后两行以获得多样且>=3步的题目
            const MIN_STEPS = 3;
            let attempts = 0;
            let ok = false;
            do {
                // 重置最后两行为完成态 [9..15, 0]
                for (let i = 8; i < this.total - 1; i++) this.board[i] = i + 1;
                this.board[15] = 0;
                this.emptyIdx = 15;
                // 空格限制在最后两行内随机移动，保证1-8不动
                let last = -1;
                for (let i = 0; i < 60; i++) {
                    let neighbors = this.getNeighbors(this.emptyIdx).filter(n => n >= 8);
                    let choices = neighbors.filter(n => n !== last);
                    if (choices.length === 0) choices = neighbors;
                    if (choices.length === 0) break; // 安全兜底
                    const pick = choices[Math.floor(Math.random() * choices.length)];
                    last = this.emptyIdx;
                    this.swap(this.emptyIdx, pick);
                    this.emptyIdx = pick;
                }
                // BFS 求当前状态到完成态的最短步数，不达标则重洗
                if (this.easyMinSteps() >= MIN_STEPS) { ok = true; break; }
                attempts++;
            } while (attempts < 100);
            // 兜底：若100次仍不达标（极小概率），强制扰动确保非平凡
            if (!ok) { this.swap(8, 12); this.swap(9, 13); }
        } else {
            // 中等/困难：全面打乱（从完成状态随机移动，保证可解）
            const steps = diff === 'medium' ? 150 : 400;
            for (let i = 0; i < steps; i++) {
                const neighbors = this.getNeighbors(this.emptyIdx);
                const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
                this.swap(this.emptyIdx, pick);
                this.emptyIdx = pick;
            }
        }

        // 统一校正：emptyIdx 必须指向 board 中 0 的真实位置
        this.emptyIdx = this.board.indexOf(0);
    }

    /* ---------- 简单模式难度评估（2x4 子棋盘 BFS） ---------- */

    // 将最后两行 board[8..15] 视为 2行4列子棋盘，求当前状态到完成态的最短步数。
    // 滑块每步可逆，故从完成态 BFS 一次即可得到所有可达状态的最短距离（懒加载缓存）。
    easyMinSteps() {
        const W = 4, H = 2;
        const TARGET = [9, 10, 11, 12, 13, 14, 15, 0];
        const key = arr => arr.join(',');
        if (!this._easyDist) {
            const dist = new Map();
            const queue = [TARGET.slice()];
            dist.set(key(TARGET), 0);
            let head = 0;
            const neigh = idx => {
                const r = Math.floor(idx / W), c = idx % W;
                const res = [];
                if (r > 0) res.push(idx - W);
                if (r < H - 1) res.push(idx + W);
                if (c > 0) res.push(idx - 1);
                if (c < W - 1) res.push(idx + 1);
                return res;
            };
            while (head < queue.length) {
                const cur = queue[head++];
                const d = dist.get(key(cur));
                const ei = cur.indexOf(0);
                for (const ni of neigh(ei)) {
                    const nxt = cur.slice();
                    [nxt[ei], nxt[ni]] = [nxt[ni], nxt[ei]];
                    const k = key(nxt);
                    if (!dist.has(k)) { dist.set(k, d + 1); queue.push(nxt); }
                }
            }
            this._easyDist = dist;
        }
        const state8 = this.board.slice(8, 16);
        return this._easyDist.get(key(state8));
    }

    /* ---------- 核心逻辑 ---------- */

    // 获取某索引的相邻索引（上下左右）
    getNeighbors(idx) {
        const r = Math.floor(idx / this.size);
        const c = idx % this.size;
        const result = [];
        if (r > 0) result.push(idx - this.size); // 上
        if (r < this.size - 1) result.push(idx + this.size); // 下
        if (c > 0) result.push(idx - 1); // 左
        if (c < this.size - 1) result.push(idx + 1); // 右
        return result;
    }

    // 判断两个索引是否相邻
    isAdjacent(a, b) {
        const ar = Math.floor(a / this.size), ac = a % this.size;
        const br = Math.floor(b / this.size), bc = b % this.size;
        return (Math.abs(ar - br) + Math.abs(ac - bc)) === 1;
    }

    // 交换数组中两个位置的值
    swap(i, j) {
        [this.board[i], this.board[j]] = [this.board[j], this.board[i]];
    }

    // 尝试移动指定索引处的瓷砖
    tryMove(idx) {
        if (this.isWon || this.isAnimating) return;
        if (this.board[idx] === 0) return; // 点的是空格
        if (!this.isAdjacent(idx, this.emptyIdx)) return; // 不相邻

        this.isAnimating = true;

        // 交换数组
        this.swap(idx, this.emptyIdx);
        this.emptyIdx = idx;

        // 重绘整个棋盘（最可靠，无不同步问题）
        this.render();

        // 更新步数
        this.moves++;
        this.updateMoves();
        this.checkWin();
        this.isAnimating = false;
    }

    // 交换两个 DOM 元素的位置（在父容器中）
    swapDOM(a, b) {
        const parent = a.parentNode;
        const aNext = a.nextSibling;
        const bNext = b.nextSibling;
        if (aNext === b) {
            parent.insertBefore(b, a);
        } else if (bNext === a) {
            parent.insertBefore(a, b);
        } else {
            parent.insertBefore(a, bNext);
            parent.insertBefore(b, aNext);
        }
        // 同步更新 dataset.idx，保持与网格位置一致
        const tmpIdx = a.dataset.idx;
        a.dataset.idx = b.dataset.idx;
        b.dataset.idx = tmpIdx;
    }

    // 简单的交换动画
    animateSwap(tileA, tileB, callback) {
        const rectA = tileA.getBoundingClientRect();
        const rectB = tileB.getBoundingClientRect();
        const dx = rectB.left - rectA.left;
        const dy = rectB.top - rectA.top;

        tileA.style.transition = 'transform 0.15s ease';
        tileB.style.transition = 'transform 0.15s ease';
        tileA.style.transform = `translate(${dx}px, ${dy}px)`;
        tileB.style.transform = `translate(${-dx}px, ${-dy}px)`;
        tileA.style.zIndex = '10';
        tileB.style.zIndex = '10';

        setTimeout(() => {
            tileA.style.transition = '';
            tileB.style.transition = '';
            tileA.style.transform = '';
            tileB.style.transform = '';
            tileA.style.zIndex = '';
            tileB.style.zIndex = '';
            callback();
        }, 155);
    }

    /* ---------- 渲染 ---------- */

    render() {
        this.grid.innerHTML = '';
        for (let i = 0; i < this.total; i++) {
            const val = this.board[i];
            const tile = document.createElement('div');
            tile.className = val === 0 ? 'tile empty' : 'tile';
            tile.textContent = val === 0 ? '' : val;
            tile.dataset.idx = i;
            this.grid.appendChild(tile);
        }
    }

    /* ---------- 胜利检测 ---------- */

    checkWin() {
        for (let i = 0; i < this.total - 1; i++) {
            if (this.board[i] !== i + 1) return;
        }
        this.isWon = true;
        clearInterval(this.timer);

        if (!this.bestTime || this.time < +this.bestTime) {
            this.bestTime = this.time;
            localStorage.setItem('puzzleBestTime', String(this.time));
            this.bestEl.textContent = this.fmtTime(this.time);
        }

        setTimeout(() => {
            this.victoryMovesEl.textContent = this.moves;
            this.victoryTimeEl.textContent = this.fmtTime(this.time);
            this.victoryModal.classList.remove('hidden');
            launchConfetti();
        }, 300);
    }

    /* ---------- 计时 ---------- */

    startTimer() {
        this.timer = setInterval(() => {
            this.time++;
            this.updateTime();
        }, 1000);
    }

    updateMoves() { this.movesEl.textContent = this.moves; }
    updateTime() { this.timeEl.textContent = this.fmtTime(this.time); }

    getDifficulty() {
        const active = this.diffBtns.querySelector('.diff-btn.active');
        return active ? active.dataset.diff : 'medium';
    }

    updateDiffHint() {
        const hints = {
            easy: '💡 简单模式：1-8已排好，只需完成最后两行（至少3步）',
            medium: '💡 中等模式：全面打乱，适合有基础的同学',
            hard: '💡 困难模式：深度打乱，挑战你的极限！'
        };
        document.getElementById('diffHint').textContent = hints[this.getDifficulty()] || '';
    }

    fmtTime(s) {
        return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }

    /* ---------- 事件绑定 ---------- */

    bindEvents() {
        // 点击
        this.grid.addEventListener('click', (e) => {
            const tile = e.target.closest('.tile');
            if (!tile) return;
            this.tryMove(+tile.dataset.idx);
        });

        // 键盘
        document.addEventListener('keydown', (e) => {
            if (this.isWon || this.isAnimating) return;
            let target = -1;
            const r = Math.floor(this.emptyIdx / this.size);
            const c = this.emptyIdx % this.size;
            switch (e.key) {
                case 'ArrowLeft':  if (c < this.size - 1) target = this.emptyIdx + 1; break;
                case 'ArrowRight': if (c > 0) target = this.emptyIdx - 1; break;
                case 'ArrowUp':    if (r < this.size - 1) target = this.emptyIdx + this.size; break;
                case 'ArrowDown':  if (r > 0) target = this.emptyIdx - this.size; break;
            }
            if (target >= 0) { e.preventDefault(); this.tryMove(target); }
        });

        // 触摸滑动
        let touchStartX, touchStartY, touchIdx = -1;
        this.grid.addEventListener('touchstart', (e) => {
            const tile = e.target.closest('.tile:not(.empty)');
            if (!tile) return;
            touchIdx = +tile.dataset.idx;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        this.grid.addEventListener('touchend', (e) => {
            if (touchIdx < 0) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            const threshold = 30;
            if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) { touchIdx = -1; return; }

            // 判断滑动方向，找到该方向上离空格最近的同行/列瓷砖
            let target = -1;
            const tr = Math.floor(touchIdx / this.size), tc = touchIdx % this.size;
            const er = Math.floor(this.emptyIdx / this.size), ec = this.emptyIdx % this.size;

            if (Math.abs(dx) > Math.abs(dy)) {
                // 水平滑动
                if (dx > 0 && tr === er && tc < ec) { // 向右滑，空格在右边
                    target = this.emptyIdx - 1;
                } else if (dx < 0 && tr === er && tc > ec) { // 向左滑，空格在左边
                    target = this.emptyIdx + 1;
                }
            } else {
                // 垂直滑动
                if (dy > 0 && tc === ec && tr < er) { // 向下滑，空格在下边
                    target = this.emptyIdx - this.size;
                } else if (dy < 0 && tc === ec && tr > er) { // 向上滑，空格在上边
                    target = this.emptyIdx + this.size;
                }
            }
            if (target >= 0) this.tryMove(target);
            touchIdx = -1;
        }, { passive: true });

        // 鼠标拖拽
        let dragStartX, dragStartY, dragIdx = -1;
        this.grid.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            const tile = e.target.closest('.tile:not(.empty)');
            if (!tile) return;
            dragIdx = +tile.dataset.idx;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            e.preventDefault();
        });

        document.addEventListener('mouseup', (e) => {
            if (dragIdx < 0) return;
            const dx = e.clientX - dragStartX;
            const dy = e.clientY - dragStartY;
            const threshold = 30;
            if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) { dragIdx = -1; return; }

            let target = -1;
            const tr = Math.floor(dragIdx / this.size), tc = dragIdx % this.size;
            const er = Math.floor(this.emptyIdx / this.size), ec = this.emptyIdx % this.size;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0 && tr === er && tc < ec) target = this.emptyIdx - 1;
                else if (dx < 0 && tr === er && tc > ec) target = this.emptyIdx + 1;
            } else {
                if (dy > 0 && tc === ec && tr < er) target = this.emptyIdx - this.size;
                else if (dy < 0 && tc === ec && tr > er) target = this.emptyIdx + this.size;
            }
            if (target >= 0) this.tryMove(target);
            dragIdx = -1;
        });

        // 按钮
        this.restartBtn.addEventListener('click', () => this.init());
        this.playAgainBtn.addEventListener('click', () => {
            this.victoryModal.classList.add('hidden');
            this.init();
        });
        this.diffBtns.addEventListener('click', (e) => {
            const btn = e.target.closest('.diff-btn');
            if (!btn) return;
            this.diffBtns.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.updateDiffHint();
            this.init();
        });

        // 防止文字选中
        this.grid.addEventListener('selectstart', (e) => e.preventDefault());
    }
}

document.addEventListener('DOMContentLoaded', () => new NumberPuzzle());
</script>
