<script>
class NumberPuzzle {
    constructor() {
        this.grid = document.getElementById('grid');
        this.movesEl = document.getElementById('moves');
        this.timeEl = document.getElementById('time');
        this.bestEl = document.getElementById('best');
        this.difficultySelect = document.getElementById('difficulty');
        this.restartBtn = document.getElementById('restart');
        this.victoryModal = document.getElementById('victoryModal');
        this.playAgainBtn = document.getElementById('playAgain');
        this.victoryMovesEl = document.getElementById('victoryMoves');
        this.victoryTimeEl = document.getElementById('victoryTime');

        this.size = 4;
        this.tiles = [];
        this.emptyPos = { x: 3, y: 3 };
        this.moves = 0;
        this.time = 0;
        this.timer = null;
        this.isAnimating = false;
        this.isWon = false;
        this.isDragging = false; // 全局拖拽状态

        this.bestTime = localStorage.getItem('puzzleBestTime');
        if (this.bestTime) {
            this.bestEl.textContent = this.formatTime(parseInt(this.bestTime));
        }

        this.init();
        this.bindEvents();
    }

    init() {
        this.grid.innerHTML = '';
        this.tiles = [];
        this.moves = 0;
        this.time = 0;
        this.isWon = false;
        this.updateMoves();
        this.updateTime();
        
        if (this.timer) {
            clearInterval(this.timer);
            this.timer = null;
        }

        // 初始化完成状态
        let num = 1;
        for (let y = 0; y < this.size; y++) {
            for (let x = 0; x < this.size; x++) {
                if (x === 3 && y === 3) {
                    // 空格
                    const tile = document.createElement('div');
                    tile.className = 'tile empty';
                    tile.dataset.x = x;
                    tile.dataset.y = y;
                    this.grid.appendChild(tile);
                    this.tiles.push(null);
                } else {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.textContent = num;
                    tile.dataset.x = x;
                    tile.dataset.y = y;
                    tile.dataset.value = num;
                    this.grid.appendChild(tile);
                    this.tiles.push(num);
                    num++;
                }
            }
        }

        this.emptyPos = { x: 3, y: 3 };
        this.shuffle();
        this.startTimer();
    }

    shuffle() {
        const difficulty = this.difficultySelect.value;
        let moves = 0;
        
        switch (difficulty) {
            case 'easy': moves = 20; break;
            case 'medium': moves = 100; break;
            case 'hard': moves = 300; break;
        }

        // 从完成状态随机移动，保证可解
        for (let i = 0; i < moves; i++) {
            const possibleMoves = this.getPossibleMoves();
            const randomMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
            this.moveTile(randomMove.x, randomMove.y, false);
        }

        this.moves = 0;
        this.updateMoves();
    }

    getPossibleMoves() {
        const { x, y } = this.emptyPos;
        const moves = [];

        if (x > 0) moves.push({ x: x - 1, y }); // 左
        if (x < 3) moves.push({ x: x + 1, y }); // 右
        if (y > 0) moves.push({ x, y: y - 1 }); // 上
        if (y < 3) moves.push({ x, y: y + 1 }); // 下

        return moves;
    }

    moveTile(x, y, animate = true) {
        const tileIndex = y * this.size + x;
        const emptyIndex = this.emptyPos.y * this.size + this.emptyPos.x;

        // 交换位置
        [this.tiles[tileIndex], this.tiles[emptyIndex]] = [this.tiles[emptyIndex], this.tiles[tileIndex]];

        // 更新DOM位置
        const tile = this.getTileAt(x, y);
        const emptyTile = this.getTileAt(this.emptyPos.x, this.emptyPos.y);

        if (animate) {
            tile.classList.add('sliding');
        }

        const pos = this.getTilePosition(this.emptyPos.x, this.emptyPos.y);
        tile.style.transform = `translate(${pos.x}px, ${pos.y}px)`;

        if (animate) {
            setTimeout(() => {
                tile.classList.remove('sliding');
            }, 150);
        } else {
            tile.style.transition = 'none';
            setTimeout(() => {
                tile.style.transition = '';
            }, 0);
        }

        // 更新dataset
        tile.dataset.x = this.emptyPos.x;
        tile.dataset.y = this.emptyPos.y;
        emptyTile.dataset.x = x;
        emptyTile.dataset.y = y;

        // 更新空格位置
        this.emptyPos = { x, y };

        if (animate) {
            this.moves++;
            this.updateMoves();
            this.checkWin();
        }
    }

    getTileAt(x, y) {
        return this.grid.querySelector(`.tile:not(.empty)[data-x="${x}"][data-y="${y}"]`);
    }

    getTilePosition(x, y) {
        const gridRect = this.grid.getBoundingClientRect();
        const tileSize = gridRect.width / this.size - parseFloat(getComputedStyle(this.grid).gap) * 3 / 4;
        const gap = parseFloat(getComputedStyle(this.grid).gap) || 12;
        const padding = parseFloat(getComputedStyle(this.grid).padding) || 16;
        
        return {
            x: x * (tileSize + gap) + padding,
            y: y * (tileSize + gap) + padding
        };
    }

    isAdjacent(x, y) {
        const { x: ex, y: ey } = this.emptyPos;
        return (Math.abs(x - ex) === 1 && y === ey) || (Math.abs(y - ey) === 1 && x === ex);
    }

    checkWin() {
        if (this.isWon) return;

        for (let i = 0; i < this.tiles.length - 1; i++) {
            if (this.tiles[i] !== i + 1) {
                return;
            }
        }

        // 胜利
        this.isWon = true;
        clearInterval(this.timer);

        // 保存最佳记录
        if (!this.bestTime || this.time < parseInt(this.bestTime)) {
            this.bestTime = this.time;
            localStorage.setItem('puzzleBestTime', this.time.toString());
            this.bestEl.textContent = this.formatTime(this.time);
        }

        // 显示胜利弹窗
        setTimeout(() => {
            this.victoryMovesEl.textContent = this.moves;
            this.victoryTimeEl.textContent = this.formatTime(this.time);
            this.victoryModal.classList.add('show');
        }, 300);
    }

    startTimer() {
        this.timer = setInterval(() => {
            this.time++;
            this.updateTime();
        }, 1000);
    }

    updateMoves() {
        this.movesEl.textContent = this.moves;
    }

    updateTime() {
        this.timeEl.textContent = this.formatTime(this.time);
    }

    formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    bindEvents() {


        // 支持触摸滑动和拖拽
        let touchStartX, touchStartY, draggedTile = null, initialX, initialY, tileStartX, tileStartY;
        
        this.grid.addEventListener('touchstart', (e) => {
            if (this.isAnimating || this.isWon) return;
            
            const touch = e.touches[0];
            const tile = e.target.closest('.tile:not(.empty)');
            if (!tile) return;
            
            const x = parseInt(tile.dataset.x);
            const y = parseInt(tile.dataset.y);
            
            if (!this.isAdjacent(x, y)) return;
            
            draggedTile = tile;
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            
            const transform = window.getComputedStyle(tile).transform;
            const matrix = new DOMMatrix(transform);
            tileStartX = matrix.e;
            tileStartY = matrix.f;
            
            initialX = tileStartX;
            initialY = tileStartY;
            
            tile.style.transition = 'none';
            tile.style.zIndex = '10';
        }, { passive: true });

        this.grid.addEventListener('touchmove', (e) => {
            if (!draggedTile || this.isAnimating || this.isWon) return;
            
            const touch = e.touches[0];
            const deltaX = touch.clientX - touchStartX;
            const deltaY = touch.clientY - touchStartY;
            
            const x = parseInt(draggedTile.dataset.x);
            const y = parseInt(draggedTile.dataset.y);
            
            // 限制拖动方向只能向空格方向
            let finalX = tileStartX + deltaX;
            let finalY = tileStartY + deltaY;
            
            if (x > this.emptyPos.x) { // 空格在左边，只能向左拖
                finalX = Math.min(initialX, Math.max(initialX - (tileStartX - this.getTilePosition(this.emptyPos.x, this.emptyPos.y).x), finalX));
                finalY = initialY;
            } else if (x < this.emptyPos.x) { // 空格在右边，只能向右拖
                finalX = Math.max(initialX, Math.min(initialX + (this.getTilePosition(this.emptyPos.x, this.emptyPos.y).x - tileStartX), finalX));
                finalY = initialY;
            } else if (y > this.emptyPos.y) { // 空格在上边，只能向上拖
                finalY = Math.min(initialY, Math.max(initialY - (tileStartY - this.getTilePosition(this.emptyPos.x, this.emptyPos.y).y), finalY));
                finalX = initialX;
            } else if (y < this.emptyPos.y) { // 空格在下边，只能向下拖
                finalY = Math.max(initialY, Math.min(initialY + (this.getTilePosition(this.emptyPos.x, this.emptyPos.y).y - tileStartY), finalY));
                finalX = initialX;
            }
            
            draggedTile.style.transform = `translate(${finalX}px, ${finalY}px)`;
        }, { passive: true });

        this.grid.addEventListener('touchend', (e) => {
            if (!draggedTile || this.isAnimating || this.isWon) {
                draggedTile = null;
                return;
            }

            const touch = e.changedTouches[0];
            const deltaX = touch.clientX - touchStartX;
            const deltaY = touch.clientY - touchStartY;

            const threshold = 30;
            const x = parseInt(draggedTile.dataset.x);
            const y = parseInt(draggedTile.dataset.y);
            
            // 检查是否拖动到足够距离
            let shouldMove = false;
            
            if (x > this.emptyPos.x && deltaX < -threshold) { // 向左拖到空格
                shouldMove = true;
            } else if (x < this.emptyPos.x && deltaX > threshold) { // 向右拖到空格
                shouldMove = true;
            } else if (y > this.emptyPos.y && deltaY < -threshold) { // 向上拖到空格
                shouldMove = true;
            } else if (y < this.emptyPos.y && deltaY > threshold) { // 向下拖到空格
                shouldMove = true;
            }
            
            draggedTile.style.transition = '';
            draggedTile.style.zIndex = '';
            
            if (shouldMove) {
                this.isAnimating = true;
                this.moveTile(x, y);
                setTimeout(() => {
                    this.isAnimating = false;
                }, 150);
            } else {
                // 回弹到原位
                draggedTile.style.transform = `translate(${initialX}px, ${initialY}px)`;
            }
            
            draggedTile = null;
        }, { passive: true });

        this.restartBtn.addEventListener('click', () => {
            this.init();
        });

        this.playAgainBtn.addEventListener('click', () => {
            this.victoryModal.classList.remove('show');
            this.init();
        });

        this.difficultySelect.addEventListener('change', () => {
            this.init();
        });

        // 键盘支持
        document.addEventListener('keydown', (e) => {
            if (this.isAnimating || this.isWon) return;

            let moveX = this.emptyPos.x;
            let moveY = this.emptyPos.y;

            switch (e.key) {
                case 'ArrowLeft':
                    if (this.emptyPos.x < 3) moveX++;
                    break;
                case 'ArrowRight':
                    if (this.emptyPos.x > 0) moveX--;
                    break;
                case 'ArrowUp':
                    if (this.emptyPos.y < 3) moveY++;
                    break;
                case 'ArrowDown':
                    if (this.emptyPos.y > 0) moveY--;
                    break;
                default:
                    return;
            }

            e.preventDefault();
            this.isAnimating = true;
            this.moveTile(moveX, moveY);
            setTimeout(() => {
                this.isAnimating = false;
            }, 150);
        });

        // 响应式调整位置
        window.addEventListener('resize', () => {
            if (!this.isAnimating) {
                this.updateTilePositions();
            }
        });
        
        // 鼠标拖拽支持
        let mouseStartX, mouseStartY, mouseDraggedTile = null, mouseTileStartX, mouseTileStartY, mouseInitialX, mouseInitialY;
        
        this.grid.addEventListener('mousedown', (e) => {
            if (this.isAnimating || this.isWon || e.button !== 0) return;
            
            const tile = e.target.closest('.tile:not(.empty)');
            if (!tile) return;
            
            const x = parseInt(tile.dataset.x);
            const y = parseInt(tile.dataset.y);
            
            if (!this.isAdjacent(x, y)) return;
            
            this.isDragging = true;
            mouseDraggedTile = tile;
            mouseStartX = e.clientX;
            mouseStartY = e.clientY;
            
            const transform = window.getComputedStyle(tile).transform;
            const matrix = new DOMMatrix(transform);
            mouseTileStartX = matrix.e;
            mouseTileStartY = matrix.f;
            
            mouseInitialX = mouseTileStartX;
            mouseInitialY = mouseTileStartY;
            
            tile.style.transition = 'none';
            tile.style.zIndex = '10';
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!this.isDragging || !mouseDraggedTile || this.isAnimating || this.isWon) return;
            
            const deltaX = e.clientX - mouseStartX;
            const deltaY = e.clientY - mouseStartY;
            
            const x = parseInt(mouseDraggedTile.dataset.x);
            const y = parseInt(mouseDraggedTile.dataset.y);
            
            // 限制拖动方向只能向空格方向
            let finalX = mouseTileStartX + deltaX;
            let finalY = mouseTileStartY + deltaY;
            
            if (x > this.emptyPos.x) { // 空格在左边，只能向左拖
                finalX = Math.min(mouseInitialX, Math.max(mouseInitialX - (mouseTileStartX - this.getTilePosition(this.emptyPos.x, this.emptyPos.y).x), finalX));
                finalY = mouseInitialY;
            } else if (x < this.emptyPos.x) { // 空格在右边，只能向右拖
                finalX = Math.max(mouseInitialX, Math.min(mouseInitialX + (this.getTilePosition(this.emptyPos.x, this.emptyPos.y).x - mouseTileStartX), finalX));
                finalY = mouseInitialY;
            } else if (y > this.emptyPos.y) { // 空格在上边，只能向上拖
                finalY = Math.min(mouseInitialY, Math.max(mouseInitialY - (mouseTileStartY - this.getTilePosition(this.emptyPos.x, this.emptyPos.y).y), finalY));
                finalX = mouseInitialX;
            } else if (y < this.emptyPos.y) { // 空格在下边，只能向下拖
                finalY = Math.max(mouseInitialY, Math.min(mouseInitialY + (this.getTilePosition(this.emptyPos.x, this.emptyPos.y).y - mouseTileStartY), finalY));
                finalX = mouseInitialX;
            }
            
            mouseDraggedTile.style.transform = `translate(${finalX}px, ${finalY}px)`;
            e.preventDefault();
        });

        document.addEventListener('mouseup', (e) => {
            if (!this.isDragging || !mouseDraggedTile || this.isAnimating || this.isWon) {
                this.isDragging = false;
                mouseDraggedTile = null;
                return;
            }

            const deltaX = e.clientX - mouseStartX;
            const deltaY = e.clientY - mouseStartY;

            const threshold = 30;
            const x = parseInt(mouseDraggedTile.dataset.x);
            const y = parseInt(mouseDraggedTile.dataset.y);
            
            // 检查是否拖动到足够距离
            let shouldMove = false;
            
            if (x > this.emptyPos.x && deltaX < -threshold) { // 向左拖到空格
                shouldMove = true;
            } else if (x < this.emptyPos.x && deltaX > threshold) { // 向右拖到空格
                shouldMove = true;
            } else if (y > this.emptyPos.y && deltaY < -threshold) { // 向上拖到空格
                shouldMove = true;
            } else if (y < this.emptyPos.y && deltaY > threshold) { // 向下拖到空格
                shouldMove = true;
            }
            
            mouseDraggedTile.style.transition = '';
            mouseDraggedTile.style.zIndex = '';
            
            if (shouldMove) {
                this.isAnimating = true;
                this.moveTile(x, y);
                setTimeout(() => {
                    this.isAnimating = false;
                }, 150);
            } else {
                // 回弹到原位
                mouseDraggedTile.style.transform = `translate(${mouseInitialX}px, ${mouseInitialY}px)`;
            }
            
            this.isDragging = false;
            mouseDraggedTile = null;
        });

        // 防止拖拽时选中文字
        this.grid.addEventListener('selectstart', (e) => {
            e.preventDefault();
        });
        
        // 修复点击事件与拖拽冲突
        this.grid.addEventListener('click', (e) => {
            if (this.isAnimating || this.isWon || this.isDragging) return;

            const tile = e.target.closest('.tile:not(.empty)');
            if (!tile) return;

            const x = parseInt(tile.dataset.x);
            const y = parseInt(tile.dataset.y);

            if (this.isAdjacent(x, y)) {
                this.isAnimating = true;
                this.moveTile(x, y);
                setTimeout(() => {
                    this.isAnimating = false;
                }, 150);
            }
        });
    }

    updateTilePositions() {
        const tiles = this.grid.querySelectorAll('.tile:not(.empty)');
        tiles.forEach(tile => {
            const x = parseInt(tile.dataset.x);
            const y = parseInt(tile.dataset.y);
            const pos = this.getTilePosition(x, y);
            tile.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
        });
    }
}

// 初始化游戏
document.addEventListener('DOMContentLoaded', () => {
    new NumberPuzzle();
});
