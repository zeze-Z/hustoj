<script>
(() => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const scoreEl = document.getElementById('score');
    const highscoreEl = document.getElementById('highscore');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScoreEl = document.getElementById('finalScore');
    const finalHighscoreEl = document.getElementById('finalHighscore');
    const restartBtn = document.getElementById('restartBtn');
    const startBtn = document.getElementById('startBtn');
    const difficultyBtns = document.querySelectorAll('.difficulty-btn');
    
    const GRID_SIZE = 20;
    const TILE_SIZE = canvas.width / GRID_SIZE;
    
    let snake = [];
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let food = { x: 0, y: 0 };
    let score = 0;
    let highscore = localStorage.getItem('snake_highscore') || 0;
    let gameSpeed = 200; // 默认慢速
    let gameRunning = false;
    let gameInterval = null;
    
    highscoreEl.textContent = highscore;
    
    function init() {
        snake = [];
        const startX = Math.floor(GRID_SIZE / 2);
        const startY = Math.floor(GRID_SIZE / 2);
        snake.push({ x: startX, y: startY });
        snake.push({ x: startX - 1, y: startY });
        snake.push({ x: startX - 2, y: startY });
        
        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };
        score = 0;
        scoreEl.textContent = score;
        gameRunning = false;
        gameOverOverlay.classList.remove('show');
        startBtn.style.display = 'inline-block';
        
        if (gameInterval) {
            clearInterval(gameInterval);
            gameInterval = null;
        }
        
        spawnFood();
        draw(); // 初始绘制静态画面
    }
    
    function spawnFood() {
        let validPosition = false;
        while (!validPosition) {
            food.x = Math.floor(Math.random() * GRID_SIZE);
            food.y = Math.floor(Math.random() * GRID_SIZE);
            
            validPosition = !snake.some(segment => segment.x === food.x && segment.y === food.y);
        }
    }
    
    function drawGrid() {
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= GRID_SIZE; i++) {
            ctx.beginPath();
            ctx.moveTo(i * TILE_SIZE, 0);
            ctx.lineTo(i * TILE_SIZE, canvas.height);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(0, i * TILE_SIZE);
            ctx.lineTo(canvas.width, i * TILE_SIZE);
            ctx.stroke();
        }
    }
    
    function drawSnake() {
        snake.forEach((segment, index) => {
            const x = segment.x * TILE_SIZE;
            const y = segment.y * TILE_SIZE;
            
            if (index === 0) {
                ctx.fillStyle = '#22c55e';
            } else {
                ctx.fillStyle = '#4ade80';
            }
            
            ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        });
    }
    
    function drawFood() {
        const x = food.x * TILE_SIZE;
        const y = food.y * TILE_SIZE;
        
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
    }
    
    function update() {
        if (!gameRunning) return;
        
        direction = nextDirection;
        
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
        
        // 撞墙检测
        if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
            gameOver();
            return;
        }
        
        // 撞自己检测
        if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
            gameOver();
            return;
        }
        
        snake.unshift(head);
        
        // 吃食物
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.textContent = score;
            
            if (score > highscore) {
                highscore = score;
                highscoreEl.textContent = highscore;
                localStorage.setItem('snake_highscore', highscore);
            }
            
            spawnFood();
        } else {
            snake.pop();
        }
        
        draw();
    }
    
    function draw() {
        // 清除画布
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        drawGrid();
        drawFood();
        drawSnake();
    }
    
    function gameOver() {
        gameRunning = false;
        if (gameInterval) {
            clearInterval(gameInterval);
            gameInterval = null;
        }
        
        finalScoreEl.textContent = score;
        finalHighscoreEl.textContent = highscore;
        gameOverOverlay.classList.add('show');
    }
    
    function changeDirection(newDir) {
        // 防止反向移动
        if (newDir.x === -direction.x && newDir.y === -direction.y) {
            return;
        }
        nextDirection = newDir;
    }
    
    // 键盘控制
    document.addEventListener('keydown', (e) => {
        switch (e.key) {
            case 'ArrowUp':
            case 'w':
            case 'W':
                e.preventDefault();
                changeDirection({ x: 0, y: -1 });
                break;
            case 'ArrowDown':
            case 's':
            case 'S':
                e.preventDefault();
                changeDirection({ x: 0, y: 1 });
                break;
            case 'ArrowLeft':
            case 'a':
            case 'A':
                e.preventDefault();
                changeDirection({ x: -1, y: 0 });
                break;
            case 'ArrowRight':
            case 'd':
            case 'D':
                e.preventDefault();
                changeDirection({ x: 1, y: 0 });
                break;
            case ' ':
                e.preventDefault();
                if (!gameRunning && !gameOverOverlay.classList.contains('show')) {
                    startGame();
                }
                break;
        }
    });
    
    // 开始游戏
    function startGame() {
        if (!gameRunning) {
            gameRunning = true;
            startBtn.style.display = 'none';
            gameInterval = setInterval(update, gameSpeed);
        }
    }
    
    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', init);
    
    // 难度选择
    difficultyBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            difficultyBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            gameSpeed = parseInt(btn.dataset.speed);
            
            // 如果游戏正在运行，更新间隔
            if (gameRunning && gameInterval) {
                clearInterval(gameInterval);
                gameInterval = setInterval(update, gameSpeed);
            }
        });
    });
    
    // 初始化游戏
    init();
})();
</script>
