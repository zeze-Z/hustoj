<script>
(() => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const highscoreEl = document.getElementById('highscore');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScoreEl = document.getElementById('finalScore');
    const finalHighscoreEl = document.getElementById('finalHighscore');
    const overlayRestartBtn = document.getElementById('overlayRestartBtn');
    const closeOverlayBtn = document.getElementById('closeOverlayBtn');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const difficultyBtns = document.querySelectorAll('.diff-btn');

    const GRID_SIZE = 20;
    const TILE_SIZE = canvas.width / GRID_SIZE;

    let snake = [];
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let food = { x: 0, y: 0 };
    let score = 0;
    let highscore = localStorage.getItem('snake_highscore') || 0;
    let gameSpeed = 200;
    let gameRunning = false;
    let gameInterval = null;

    highscoreEl.textContent = highscore;

    /* 通用动效辅助 */
    function bounceStat(el) {
        el.classList.remove('stat-bounce');
        void el.offsetWidth;
        el.classList.add('stat-bounce');
        el.addEventListener('animationend', () => el.classList.remove('stat-bounce'), { once: true });
    }
    function addRipple(btn, e) {
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = (e.clientX || rect.left + rect.width/2) - rect.left - size/2;
        const y = (e.clientY || rect.top + rect.height/2) - rect.top - size/2;
        const span = document.createElement('span');
        span.className = 'ripple';
        span.style.width = span.style.height = size + 'px';
        span.style.left = x + 'px';
        span.style.top = y + 'px';
        btn.appendChild(span);
        span.addEventListener('animationend', () => span.remove(), { once: true });
    }
    document.querySelectorAll('.btn, .diff-btn').forEach(btn => {
        btn.addEventListener('click', e => addRipple(btn, e));
    });

    /* 从弹窗中心放礼花 */
    function launchConfettiFromCard() {
        if (typeof confetti !== 'function' || typeof confetti.create !== 'function') return;
        var cvs = document.createElement('canvas');
        cvs.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:2147483647;';
        document.body.appendChild(cvs);
        var fire = confetti.create(cvs, { resize: true, useWorker: false });
        var card = document.querySelector('.game-over-card');
        var rect = card ? card.getBoundingClientRect() : { left: window.innerWidth/2, top: window.innerHeight/2, width: 0, height: 0 };
        var ox = (rect.left + rect.width / 2) / window.innerWidth;
        var oy = (rect.top + rect.height / 2) / window.innerHeight;
        var duration = 1800;
        var end = Date.now() + duration;
        (function frame() {
            fire({
                particleCount: 5, spread: 60,
                origin: { x: ox, y: oy },
                colors: ['#4ADE80','#22c55e','#14b8a6','#f59e0b','#ef4444','#ec4899'],
                disableForReducedMotion: true
            });
            if (Date.now() < end) requestAnimationFrame(frame);
        })();
        setTimeout(function () {
            try { fire.reset(); } catch (e) {}
            if (cvs.parentNode) cvs.parentNode.removeChild(cvs);
        }, duration + 2000);
    }

    function init() {
        snake = [];
        const startX = Math.floor(GRID_SIZE / 2);
        const startY = Math.floor(GRID_SIZE / 2);
        snake.push({ x: startX, y: startY });
        snake.push({ x: startX - 1, y: startY });
        snake.push({ x: startX - 2, y: startY });

        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };
        score = 0;
        scoreEl.textContent = score;
        gameRunning = false;
        gameOverOverlay.classList.remove('show');
        startBtn.style.display = '';

        if (gameInterval) { clearInterval(gameInterval); gameInterval = null; }

        spawnFood();
        draw();
    }

    function spawnFood() {
        let ok = false;
        while (!ok) {
            food.x = Math.floor(Math.random() * GRID_SIZE);
            food.y = Math.floor(Math.random() * GRID_SIZE);
            ok = !snake.some(s => s.x === food.x && s.y === food.y);
        }
    }

    function drawGrid() {
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= GRID_SIZE; i++) {
            ctx.beginPath(); ctx.moveTo(i * TILE_SIZE, 0); ctx.lineTo(i * TILE_SIZE, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i * TILE_SIZE); ctx.lineTo(canvas.width, i * TILE_SIZE); ctx.stroke();
        }
    }

    function drawSnake() {
        snake.forEach((s, i) => {
            ctx.fillStyle = i === 0 ? '#22c55e' : '#4ade80';
            ctx.fillRect(s.x * TILE_SIZE + 2, s.y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        });
    }

    function drawFood() {
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(food.x * TILE_SIZE + 2, food.y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
    }

    function update() {
        if (!gameRunning) return;
        direction = nextDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

        if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) { gameOver(); return; }
        if (snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }

        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.textContent = score;
            bounceStat(scoreEl);
            if (score > highscore) {
                highscore = score;
                highscoreEl.textContent = highscore;
                bounceStat(highscoreEl);
                localStorage.setItem('snake_highscore', highscore);
            }
            spawnFood();
        } else {
            snake.pop();
        }
        draw();
    }

    function draw() {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawGrid(); drawFood(); drawSnake();
    }

    function gameOver() {
        gameRunning = false;
        if (gameInterval) { clearInterval(gameInterval); gameInterval = null; }
        finalScoreEl.textContent = score;
        finalHighscoreEl.textContent = highscore;
        gameOverOverlay.classList.add('show');
        launchConfettiFromCard();
    }

    function changeDirection(newDir) {
        if (newDir.x === -direction.x && newDir.y === -direction.y) return;
        nextDirection = newDir;
    }

    document.addEventListener('keydown', e => {
        switch (e.key) {
            case 'ArrowUp': case 'w': case 'W': e.preventDefault(); changeDirection({x:0,y:-1}); break;
            case 'ArrowDown': case 's': case 'S': e.preventDefault(); changeDirection({x:0,y:1}); break;
            case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); changeDirection({x:-1,y:0}); break;
            case 'ArrowRight': case 'd': case 'D': e.preventDefault(); changeDirection({x:1,y:0}); break;
            case ' ':
                e.preventDefault();
                if (!gameRunning && !gameOverOverlay.classList.contains('show')) startGame();
                break;
        }
    });

    function startGame() {
        if (!gameRunning) {
            gameRunning = true;
            startBtn.style.display = 'none';
            gameInterval = setInterval(update, gameSpeed);
        }
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', init);
    overlayRestartBtn.addEventListener('click', init);
    closeOverlayBtn.addEventListener('click', () => gameOverOverlay.classList.remove('show'));

    difficultyBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            difficultyBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            gameSpeed = parseInt(btn.dataset.speed);
            if (gameRunning && gameInterval) {
                clearInterval(gameInterval);
                gameInterval = setInterval(update, gameSpeed);
            }
        });
    });

    init();
})();
</script>
