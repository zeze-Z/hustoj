        /* ============ 河面 ============ */
        .river {
            position: relative;
            flex: 1 1 auto;
            min-height: 400px;

        }
        .river::before {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                transparent 0 10px,
                rgba(255, 255, 255, 0.22) 10px 14px,

        }
        @keyframes waterFlow {
            from { background-position: 0 0; }
            to   { background-position: 0 28px; }
        }
        /* 水面色块（给石头/青蛙垫底的可视水位线） */
        .river::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 18%;
            height: 38%;
            background: linear-gradient(180deg, rgba(2, 132, 199, 0.25), rgba(2, 132, 199, 0.5));
            pointer-events: none;
            z-index: 0;

        /* ===== 四区主题背景：荷花池 / 小溪 / 大河 / 大海 ===== */
        .river-zone-1 { background: linear-gradient(180deg, #bdeeda 0%, #6fd8ae 45%, #2fae7f 100%); }  /* 荷花池·春水青绿 */
        .river-zone-2 { background: linear-gradient(180deg, #c3ecff 0%, #8ac9fb 45%, #4aa0e8 100%); }  /* 小溪·明亮浅蓝 */
        .river-zone-3 { background: linear-gradient(180deg, #8fc7fa 0%, #3f8fe0 45%, #1a5cb0 100%); }  /* 大河·深湛蓝 */
        .river-zone-4 { background: linear-gradient(180deg, #5fc8d8 0%, #248db0 40%, #0b5f8a 100%); }  /* 大海·深海蓝绿 */

        /* ===== 四区手绘装饰层（轻点缀，SVG绘制） ===== */
        #river-decor {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }
        .decor {
            position: absolute;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0.88;
        }
        .decor svg {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 3px 4px rgba(2, 80, 110, 0.22));
        }
        .decor.flip svg { transform: scaleX(-1); }
        .decor.bob { animation: decorBob 3.8s ease-in-out infinite; }
        .decor.bob-2 { animation: decorBob 5.4s ease-in-out infinite reverse; }
        /* 荷花独立层：z-index 4 高于石头(z3)，在河面装饰层(z1)之上，
           避免被 .decor 容器的层叠上下文压住 */
        #lotus-layer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 4;
        }
        @keyframes decorBob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-5px); }
        }

        .bank {

        /* 石头/荷叶（手绘SVG荷叶） */
        .stone {
            position: absolute;
            bottom: 24%;
            transform: translateX(-50%);
            width: 86px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            transition: filter 0.2s ease;
            cursor: default;
        }
        .stone-pad {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 5px 8px rgba(2, 100, 60, 0.35));
        }
        .stone-chars {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1px;
            padding-top: 3px;
        }
        .stone .char {
            display: inline-block;
            color: #ffffff;
            font-weight: 800;
            text-shadow: 0 1px 3px rgba(0, 60, 30, 0.7);
            transition: all 0.15s ease;
        }
        .stone .char.pending { color: rgba(255, 255, 255, 0.55); }
        .stone .char.current {
            color: #0ea5e9;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 4px;
            transform: scale(1.18);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }
        .stone .char.correct {
            color: #052e16;
            background: #bbf7d0;
            border-radius: 4px;
            text-shadow: none;
        }
        .stone .char.wrong { color: #dc2626; animation: charWrongShake 0.3s ease; }
        @keyframes charWrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }

        .stone.damaged {
            filter: brightness(0.82) saturate(0.85);
            border-color: rgba(220, 38, 38, 0.6);
        }
        .stone.damaged::before {
            content: "";
            position: absolute;
            top: 12%;
            left: 50%;
            width: 3px;
            height: 42%;
            background: rgba(220, 38, 38, 0.8);
            transform: rotate(28deg);
            border-radius: 2px;
            z-index: 2;
        }
        .stone.sinking {
            animation: stoneSink 0.55s ease-in forwards;
            pointer-events: none;
        }
        @keyframes stoneSink {
            0%   { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
            100% { transform: translateX(-50%) translateY(40px) scale(0.8); opacity: 0.25; }
        }
        .stone.sunk { opacity: 0.18; pointer-events: none; filter: blur(1px) brightness(0.7); }
        .stone.shake { animation: stoneShake 0.35s ease; }
        @keyframes stoneShake {
            0%, 100% { transform: translateX(-50%) translateX(0); }
            25% { transform: translateX(calc(-50% - 4px)); }
            75% { transform: translateX(calc(-50% + 4px)); }
        }

        /* 青蛙 */
        .frog {
            position: absolute;
            bottom: 26%;
            left: 0;
            transform: translateX(-50%);
            font-size: 2.2rem;
            z-index: 6;
            transition: left 0.5s cubic-bezier(0.3, 1.4, 0.4, 1);
            filter: drop-shadow(0 6px 10px rgba(0, 60, 100, 0.4));
            pointer-events: none;
        }
        .frog-bounce { animation: frogArc 0.5s ease-in-out; }
        @keyframes frogArc {
            0%   { transform: translateX(-50%) translateY(0) rotate(0deg); }
            40%  { transform: translateX(-50%) translateY(-72px) rotate(-10deg); }
            70%  { transform: translateX(-50%) translateY(4px) rotate(4deg); }
            100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
        }
        .frog.splash { animation: frogSplash 0.9s ease-in forwards; }
        @keyframes frogSplash {
            0%   { transform: translateX(-50%) translateY(0) scale(1) rotate(0deg); opacity: 1; }
            55%  { transform: translateX(-50%) translateY(24px) scale(0.8) rotate(18deg); opacity: 0.8; }
            100% { transform: translateX(-50%) translateY(52px) scale(0.15) rotate(40deg); opacity: 0; }
        }

        /* 手绘青蛙SVG：呼吸 + 眨眼待机动画（跳起/落水动画作用于 .frog 外层，互不冲突） */
        .frog svg {
            width: 64px;
            height: 64px;
            display: block;
            animation: frogBreath 3.2s ease-in-out infinite;
            transform-origin: 50% 88%;
        }
        @keyframes frogBreath {
            0%, 100% { transform: scaleY(1); }
            50%      { transform: scaleY(1.045); }
        }
        .frog-eyelid {
            transform-box: fill-box;
            transform-origin: center top;
            animation: frogBlink 4.2s ease-in-out infinite;
        }
        @keyframes frogBlink {
            0%, 92%  { transform: scaleY(0); }
            94%, 96% { transform: scaleY(1); }
            98%, 100% { transform: scaleY(0); }
        }

        /* 鳄鱼（第四区追赶，位于荷叶上方的空旷水面，头朝右游向青蛙） */
        .crocodile {
            position: absolute;
            bottom: 52%;
            left: -18%;
            transform: translateX(-50%);
            z-index: 5;
            filter: drop-shadow(0 4px 8px rgba(0, 60, 100, 0.4));
            pointer-events: none;
        }
        .crocodile svg {
            width: 88px;
            height: auto;
            display: block;
        }
        .crocodile.bob { animation: crocBob 0.9s ease-in-out infinite; }
        @keyframes crocBob {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50%      { transform: translateX(-50%) translateY(-6px); }
        }

        /* 波纹 */
        #ripple-layer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 4;
        }
        .ripple {
            position: absolute;
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: rippleExpand 0.65s ease-out forwards;
        }
        @keyframes rippleExpand {
            0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(3.2); opacity: 0; }

    function pickWord(bank, last) {
        if (!bank.length) return 'a';
        if (bank.length === 1) return bank[0];
        var w = bank[Math.floor(Math.random() * bank.length)];
        var guard = 0;
        while (w === last && guard < 20) {
            w = bank[Math.floor(Math.random() * bank.length)];
            guard++;
        }
        return w;
    }

                this.enabled = false;
                this.data = {};

        save: function () {
            if (!this.enabled) return;
            try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); }
            catch (e) { this.enabled = false; }
        },
        getStars: function (level) { return this.data[level] || 0; },
        setStars: function (level, stars) {

            }
        },

            if (level <= 1) return true;
            return (this.data[level - 1] || 0) >= 1;

    var AudioSfx = {
        ctx: null,
        enabled: true,
        loadPref: function () {
            try { this.enabled = localStorage.getItem('frog_typing_mute') !== '1'; }
            catch (e) { this.enabled = true; }
        },
        init: function () {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) { this.ctx = null; return; }
            if (!this.ctx) {
                try { this.ctx = new AC(); } catch (e) { this.ctx = null; }
            }
            this.resume();
        },
        resume: function () {
            if (!this.ctx || this.ctx.state !== 'suspended' || !this.ctx.resume) return;
            try {
                var p = this.ctx.resume();
                if (p && p.catch) p.catch(function () {});
            } catch (e) {}
        },
        unlock: function () {
            // 在首次用户手势中创建/恢复 AudioContext，绕过浏览器自动播放限制
            this.init();
        },
        beep: function (freq, dur, type, gain, delay) {
            if (!this.ctx) return;
            var t0 = this.ctx.currentTime + (delay || 0);
            var osc = this.ctx.createOscillator();
            var g = this.ctx.createGain();
            osc.type = type || 'sine';
            osc.frequency.value = freq;
            g.gain.setValueAtTime(gain || 0.1, t0);
            g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(t0);
            osc.stop(t0 + dur + 0.02);
        },
        slide: function (f1, f2, dur, type, gain) {
            if (!this.ctx) return;
            var t0 = this.ctx.currentTime;
            var osc = this.ctx.createOscillator();
            var g = this.ctx.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(f1, t0);
            osc.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
            g.gain.setValueAtTime(gain || 0.1, t0);
            g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(t0);
            osc.stop(t0 + dur + 0.02);
        },
        play: function (name) {
            if (!this.enabled) return;
            this.init();
            if (!this.ctx) return;
            switch (name) {
                case 'jump':    this.slide(520, 880, 0.18, 'triangle', 0.15); break;
                case 'correct': this.beep(660, 0.08, 'sine', 0.14); this.beep(880, 0.1, 'sine', 0.14, 0.09); break;
                case 'wrong':   this.beep(180, 0.15, 'square', 0.1); break;
                case 'sink':    this.slide(300, 110, 0.45, 'sine', 0.14); break;
                case 'splash':  this.slide(520, 180, 0.4, 'triangle', 0.12); break;
                case 'win':     [523, 659, 784, 1047].forEach(function (f, i) { this.beep(f, 0.14, 'triangle', 0.14, i * 0.12); }, this); break;
                case 'lose':    [392, 330, 262].forEach(function (f, i) { this.beep(f, 0.18, 'triangle', 0.12, i * 0.15); }, this); break;
                case 'unlock':  this.beep(880, 0.09, 'sine', 0.12); this.beep(1175, 0.12, 'sine', 0.12, 0.1); break;
                case 'click':   this.beep(320, 0.05, 'square', 0.12); break;
            }
        },

            this.enabled = !this.enabled;
            try { localStorage.setItem('frog_typing_mute', this.enabled ? '0' : '1'); } catch (e) {}

    function buildLevelCards() {
        for (var z = 1; z <= 4; z++) {
            var grid = $('zone-grid-' + z);
            grid.innerHTML = '';
            for (var i = 0; i < LEVELS.length; i++) {
                var cfg = LEVELS[i];
                if (cfg.zone !== z) continue;
                var card = document.createElement('div');
                card.className = 'level-card';
                card.setAttribute('data-level', cfg.id);
                card.innerHTML =
                    '<div class="level-num">' + cfg.id + '</div>' +
                    '<div class="level-bank-icon">' + ZONES[z].emoji + '</div>' +
                    '<div class="level-stars">' + starText(0).replace(/★/g, '<span class="dim">★</span>') + '</div>';
                card.addEventListener('click', function () {
                    var lvl = parseInt(this.getAttribute('data-level'), 10);
                    AudioSfx.init();
                    AudioSfx.play('click');
                    if (!ProgressStore.isUnlocked(lvl)) {
                        showToast('🔒 先通关上一关才能玩这一关哦！');
                        return;
                    }
                    enterLevel(lvl);
                });
                grid.appendChild(card);
            }
        }
    }

    function updateMap() {
        var total = ProgressStore.totalStars();
        mapTotalStars.textContent = total;
        mapProgressBar.style.width = (total / (LEVELS.length * 3) * 100) + '%';
        for (var z = 1; z <= 4; z++) {
            var grid = $('zone-grid-' + z);
            var done = 0;
            var cards = grid.children;
            for (var i = 0; i < cards.length; i++) {
                var lvl = parseInt(cards[i].getAttribute('data-level'), 10);
                var stars = ProgressStore.getStars(lvl);
                var unlocked = ProgressStore.isUnlocked(lvl);
                cards[i].className = 'level-card' + (unlocked ? '' : ' locked') +
                    (unlocked && stars > 0 ? ' cleared' : '') +
                    (unlocked && stars === 0 ? ' current' : '');
                cards[i].querySelector('.level-stars').innerHTML = starText(stars);
                var lock = cards[i].querySelector('.level-lock');
                if (!unlocked) {
                    if (!lock) {
                        lock = document.createElement('div');
                        lock.className = 'level-lock';
                        cards[i].appendChild(lock);
                    }
                    lock.textContent = '🔒';
                } else if (lock) {
                    lock.remove();
                }
                if (stars > 0) done++;
            }
            $('zone-done-' + z).textContent = done + '/4 已通关';
        }
    }

            d.style.bottom = it.bottom + '%';
            d.innerHTML = it.svg;
            // 荷花放入独立荷花层（z4，高于荷叶），其余装饰留在底层
            (it.lotus ? lotusLayer : riverDecorEl).appendChild(d);
        }
    }

    function addMapLotus() {
        var z1 = $('zone-1');
        if (!z1 || z1.querySelector('.map-lotus')) return;
        var lotus = document.createElement('span');
        lotus.className = 'map-lotus';
        lotus.innerHTML = LOTUS_SVG;
        z1.appendChild(lotus);
    }

    function placeStones() {
        var cfg = getLevel(Game.level);
        stonesContainer.innerHTML = '';
        Game.stones = [];
        var last = null;
        for (var i = 0; i < cfg.cols; i++) {
            var bank = WORD_BANKS[cfg.bank];
            var word = pickWord(bank, last);
            last = word;
            var stone = document.createElement('div');
            stone.className = 'stone';
            stone.style.left = (((i + 1) / (cfg.cols + 1)) * 100) + '%';
            // 荷叶大小随河宽与列数自适应：列少更大、列多不重叠
            var avail = (riverEl.clientWidth || 700) / (cfg.cols + 1);
            var sw = Math.max(58, Math.min(112, avail * 0.94));
            stone.style.width = Math.round(sw) + 'px';
            stone.style.height = Math.round(sw * 0.72) + 'px';
            // 按词长自适应字号
            var fs = '1.4rem';
            if (word.length <= 1) fs = '2rem';
            else if (word.length <= 3) fs = '1.4rem';
            else if (word.length <= 6) fs = '1.15rem';
            else fs = '0.95rem';
            var chars = '';
            for (var c = 0; c < word.length; c++) {
                chars += '<span class="char pending" style="font-size:' + fs + '">' +
                    escapeHtml(word[c]) + '</span>';
            }
            // 手绘荷叶：带V型缺口的叶片 + 放射叶脉 + 高光
            stone.innerHTML =
                '<svg class="stone-pad" viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">' +
                '<path fill="#4ade80" fill-rule="evenodd" d="M50 5 C 78 5 93 24 87 43 C 81 61 66 69 50 69 C 34 69 19 61 13 43 C 7 24 22 5 50 5 Z M41 12 L 59 12 L 50 30 Z"/>' +
                '<ellipse cx="50" cy="58" rx="34" ry="10" fill="#159a4e" opacity="0.35"/>' +
                '<ellipse cx="40" cy="26" rx="16" ry="9" fill="#ffffff" opacity="0.22"/>' +
                '<g stroke="#2fae68" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.75">' +
                '<path d="M50 34 L 20 26"/><path d="M50 34 L 26 44"/><path d="M50 34 L 42 58"/>' +
                '<path d="M50 34 L 58 58"/><path d="M50 34 L 74 44"/><path d="M50 34 L 80 26"/><path d="M50 34 L 50 12"/>' +
                '</g>' +
                '</svg>' +
                '<div class="stone-chars">' + chars + '</div>';
            stonesContainer.appendChild(stone);
            Game.stones.push({ word: word, el: stone, damaged: 0, chars: stone.querySelectorAll('.char') });
        }
    }

    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function slotLeft(slot, cfg) {
        return ((slot + 1) / (cfg.cols + 1)) * 100;
    }

    // 青蛙中心不超出河面左右边界（避免半身出画布）
    function frogLeft(slot, cfg) {
        var pct = slotLeft(slot, cfg);
        var w = riverEl.clientWidth || 700;
        var half = (frogEl.offsetWidth || 64) / 2;
        var minPct = Math.min(50, (half / w) * 100);
        return Math.min(100 - minPct, Math.max(minPct, pct));
    }

    function moveFrogTo(slot) {
        var cfg = getLevel(Game.level);
        var left = frogLeft(slot, cfg);
        frogEl.style.left = left + '%';
        if (slot >= 0) {
            frogEl.classList.remove('frog-bounce');
            void frogEl.offsetWidth;
            frogEl.classList.add('frog-bounce');
        }
        spawnRipple(left, null);
    }

    function spawnRipple(leftPct, bottomPct) {
        var r = document.createElement('div');
        r.className = 'ripple';
        var bottom = bottomPct != null ? bottomPct : 26;
        r.style.left = leftPct + '%';
        r.style.bottom = bottom + '%';
        rippleLayer.appendChild(r);
        setTimeout(function () { if (r.parentNode) r.parentNode.removeChild(r); }, 700);
    }

    function updateStoneCharStatus(typed) {
        var st = Game.stones[Game.colIndex];
        if (!st) return;
        for (var i = 0; i < st.chars.length; i++) {
            var cls = 'char ';
            if (i < typed.length) cls += 'correct';
            else if (i === typed.length) cls += 'current';
            else cls += 'pending';
            st.chars[i].className = cls;
        }
    }

    function renderLives() {
        var hearts = '';
        for (var i = 0; i < Game.lives; i++) hearts += '❤️';
        for (var j = Game.lives; j < 3; j++) hearts += '🖤';
        livesEl.textContent = hearts;
    }

    function updateColProgress() {
        var cfg = getLevel(Game.level);
        colProgressBar.style.width = (Game.colIndex / cfg.cols * 100) + '%';
    }

    // ================= 倒计时 =================
    function triggerCountdownAnim(el) {
        el.classList.remove('countdown-num_play');
        void el.offsetWidth;
        el.classList.add('countdown-num_play');
    }
    function startCountdownThen(onDone) {
        var sequence = ['3', '2', '1', 'GO!'];
        var idx = 0;
        countdownOverlay.classList.remove('hidden');
        countdownNum.textContent = sequence[0];
        triggerCountdownAnim(countdownNum);
        countdownTimer = setInterval(function () {
            idx += 1;
            if (idx >= sequence.length) {
                clearInterval(countdownTimer);
                countdownTimer = null;
                countdownOverlay.classList.add('hidden');
                onDone && onDone();
                return;
            }
            countdownNum.textContent = sequence[idx];
            triggerCountdownAnim(countdownNum);
        }, 900);
    }
    function clearCountdown() {
        if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
        countdownOverlay.classList.add('hidden');
    }

    // ================= 计时器 =================
    function startTimer() {
        Game.startTime = performance.now() - Game.elapsed;
        tickTimer();
    }
    function tickTimer() {
        Game.elapsed = performance.now() - Game.startTime;
        renderTimer(Game.elapsed);
        var cfg = getLevel(Game.level);
        // 最后一词已打完、正跳向右岸的收尾窗口不判负
        if (Game.colIndex < cfg.cols) {
            // 限时判定
            if (cfg.timeLimit > 0 && Game.elapsed >= cfg.timeLimit * 1000) {
                setFeedback('⏰ 时间到！', 'err');
                endLevel(false);
                return;
            }
            // 鳄鱼追赶判定
            if (cfg.croc > 0) {
                var crocSlot = -3 + (Game.elapsed / 1000) / cfg.croc;
                updateCroc(crocSlot);
                if (crocSlot >= Game.colIndex - 1) {
                    setFeedback('🐊 被鳄鱼追上啦！', 'err');
                    endLevel(false);
                    return;
                }
            }
        }
        Game.timerRaf = requestAnimationFrame(tickTimer);
    }
    function stopTimer() {
        if (Game.timerRaf) { cancelAnimationFrame(Game.timerRaf); Game.timerRaf = null; }
    }
    function renderTimer(ms) {
        var sec = ms / 1000;
        var text;
        if (sec < 100) text = sec.toFixed(1) + 's';
        else {
            var m = Math.floor(sec / 60);
            var s = Math.floor(sec % 60);
            text = m + ':' + (s < 10 ? '0' : '') + s;
        }
        timerEl.textContent = text;
    }

    // ================= 鳄鱼 =================
    function updateCroc(slot) {
        var cfg = getLevel(Game.level);
        var left = slotLeft(slot, cfg);
        crocEl.style.left = left + '%';
        if (slot < -2.4) {
            crocEl.classList.add('hidden');
        } else {
            crocEl.classList.remove('hidden');
            if (!crocEl.classList.contains('bob')) {
                crocEl.classList.add('bob');
            }
        }
    }
    function hideCroc() {
        crocEl.classList.add('hidden');
        crocEl.classList.remove('bob');
    }

    // ================= 游戏主流程 =================
    function enterLevel(n) {
        clearTimers();
        Game.level = n;
        Game.lives = 3;
        Game.mistakes = 0;
        Game.colIndex = 0;
        Game.falling = false;
        Game.elapsed = 0;
        Game.phase = 'idle';

        screenMap.classList.add('hidden');
        screenGame.classList.remove('hidden');
        resultScreen.classList.add('hidden');

        var cfg = getLevel(n);
        riverEl.className = 'river river-zone-' + cfg.zone;
        applyZoneTheme(cfg.zone);
        topbarLevelName.textContent = '第 ' + n + ' 关 · ' + cfg.zoneName;
        topbarStars.innerHTML = starText(ProgressStore.getStars(n));

        placeStones();
        frogEl.classList.remove('splash', 'frog-bounce');
        frogEl.style.left = frogLeft(-1, cfg) + '%';
        renderLives();
        mistakesEl.textContent = '0';
        timerEl.textContent = '0.0s';
        colProgressBar.style.width = '0%';
        updateColProgress();

        if (cfg.croc > 0) {
            crocEl.classList.add('hidden');
            crocEl.classList.remove('bob');
        } else {
            hideCroc();
        }

        inputArea.value = '';
        inputArea.disabled = true;
        inputArea.placeholder = cfg.croc > 0 ? '打出荷叶上的内容，小心鳄鱼！' : '打出荷叶上的内容…';
        setFeedback('点击 ▶ 开始 出发！', 'info');
        setMainBtn('▶ 开始', true, false);
    }

    function startGame() {
        if (Game.phase !== 'idle' && Game.phase !== 'paused') return;
        Game.phase = 'countdown';
        inputArea.disabled = true;
        setMainBtn('… 准备中', false, true);
        startCountdownThen(function () {
            Game.phase = 'running';
            inputArea.disabled = false;
            setMainBtn('⏸ 暂停', false, false);
            focusInput();
            startTimer();
            setFeedback('出发！', 'ok');
        });
    }

    function focusInput() {
        try { inputArea.focus({ preventScroll: true }); } catch (e) { inputArea.focus(); }
    }

    // 合并后的"开始/暂停/继续"主按钮：切换文案、绿色开始态与禁用态
    function setMainBtn(text, cls, disabled) {
        pauseBtn.textContent = text;
        pauseBtn.classList.toggle('start', !!cls);
        pauseBtn.disabled = !!disabled;
    }

    function goPause(auto) {
        if (Game.phase !== 'running') return;
        Game.phase = 'paused';
        stopTimer();
        inputArea.disabled = true;
        setMainBtn('▶ 继续', true, false);
        setFeedback(auto ? '⏸ 离开页面已暂停，点继续出发' : '⏸ 已暂停', 'info');
    }
    function goResume() {
        if (Game.phase !== 'paused') return;
        Game.phase = 'running';
        inputArea.disabled = false;
        setMainBtn('⏸ 暂停', false, false);
        focusInput();
        startTimer();
        setFeedback('继续！', 'ok');
    }
    function pauseToggle() {
        AudioSfx.init();
        AudioSfx.play('click');
        if (Game.phase === 'idle') startGame();
        else if (Game.phase === 'running') goPause(false);
        else if (Game.phase === 'paused') goResume();
    }

    function restartLevel() {
        AudioSfx.play('click');
        clearTimers();
        enterLevel(Game.level);
        startGame();
    }

    function clearTimers() {
        stopTimer();
        clearCountdown();
        Game.timerRaf = null;
        Game.elapsed = 0;
        Game.startTime = 0;
    }

    function exitToMap() {
        clearTimers();
        resultScreen.classList.add('hidden');
        screenGame.classList.add('hidden');
        screenMap.classList.remove('hidden');
        updateMap();
    }

    function calcStars(win, mistakes, timeMs, cfg) {
        if (!win) return 0;
        if (mistakes <= 1 && timeMs <= cfg.star3Time) return 3;
        if (mistakes <= 2) return 2;
        return 1;
    }

    function endLevel(win) {
        if (Game.phase === 'over') return;
        Game.phase = 'over';
        stopTimer();
        clearCountdown();
        inputArea.disabled = true;
        setMainBtn('⏸ 暂停', false, true);

        var cfg = getLevel(Game.level);
        var elapsed = Game.elapsed;
        var stars = win ? calcStars(win, Game.mistakes, elapsed, cfg) : 0;
        var prevStars = ProgressStore.getStars(Game.level);
        var newUnlock = win && stars >= 1 && Game.level < LEVELS.length && prevStars < 1;
        ProgressStore.setStars(Game.level, stars);

        resultTitle.textContent = win ? (stars === 3 ? '完美通关！' : '过关！') : '失败了…';
        resultStars.innerHTML = starText(stars);
        resultMistakes.textContent = Game.mistakes;
        resultTime.textContent = formatTime(elapsed);

        resultNewUnlock.classList.add('hidden');
        if (newUnlock) {
            resultNewUnlock.classList.remove('hidden');
            AudioSfx.play('unlock');
        }
        resultAllClear.classList.add('hidden');
        if (win && Game.level === LEVELS.length) resultAllClear.classList.remove('hidden');

        if (win && Game.level < LEVELS.length) {
            nextBtn.classList.remove('hidden');
            nextBtn.textContent = '下一关 ➡';
        } else {
            nextBtn.classList.add('hidden');
        }

        resultScreen.classList.remove('hidden');

        if (win) {
            AudioSfx.play('win');
            launchConfetti();
        } else {
            AudioSfx.play('lose');
        }
    }

    function formatTime(ms) {
        var sec = ms / 1000;
        if (sec < 100) return sec.toFixed(1) + 's';
        var m = Math.floor(sec / 60);
        var s = Math.floor(sec % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
    }

    // ================= 输入处理 =================
    function onInput() {
        if (Game.phase !== 'running') return;
        if (Game.isComposing) return;
        if (performance.now() < Game.lockUntil) {
            inputArea.value = '';
            return;
        }
        var st = Game.stones[Game.colIndex];
        if (!st) return;
        var val = inputArea.value.toLowerCase();
        if (val.length === 0) {
            updateStoneCharStatus('');
            return;
        }
        var word = st.word;
        // 逐字符校验：任何一个字符对不上即判失误
        for (var i = 0; i < val.length; i++) {
            if (val[i] !== word[i]) {
                onWrongKey();
                return;
            }
        }
        updateStoneCharStatus(val);
        if (val.length >= word.length) {
            onWordComplete();
        }
    }

    function onWordComplete() {
        var cfg = getLevel(Game.level);
        AudioSfx.play('correct');
        var slot = Game.colIndex;      // 跳到当前这块石头上
        moveFrogTo(slot);
        Game.colIndex++;
        updateColProgress();
        inputArea.value = '';
        Game.lockUntil = performance.now() + 250;
        updateStoneCharStatus('');
        if (Game.colIndex >= cfg.cols) {
            // 最后再跳一步到右岸
            setTimeout(function () {
                if (Game.phase !== 'running') return;
                AudioSfx.play('jump');
                moveFrogTo(cfg.cols);
                endLevel(true);
            }, 480);
        } else {
            setTimeout(function () {
                if (Game.phase === 'running') focusInput();
            }, 260);
        }
    }

    function onWrongKey() {
        var st = Game.stones[Game.colIndex];
        Game.mistakes++;
        mistakesEl.textContent = Game.mistakes;
        AudioSfx.play('wrong');
        inputArea.value = '';
        updateStoneCharStatus('');
        if (!st) return;
        st.damaged++;
        if (st.damaged >= DURABILITY) {
            // 石头沉没 → 青蛙落水
            st.el.classList.add('sinking');
            setTimeout(function () { st.el.classList.add('sunk'); }, 550);
            frogFall();
            return;
        }
        st.el.classList.add('damaged');
        st.el.classList.remove('shake');
        void st.el.offsetWidth;
        st.el.classList.add('shake');
        setFeedback('打错啦！荷叶在往下沉…（还能错 ' + (DURABILITY - st.damaged) + ' 次）', 'err');
    }

    function frogFall() {
        if (Game.falling) return;
        Game.falling = true;
        Game.lives--;
        AudioSfx.play('splash');
        spawnRipple(parseFloat(frogEl.style.left), 26);
        frogEl.classList.remove('frog-bounce');
        frogEl.classList.add('splash');
        setFeedback('💦 青蛙掉水里了！', 'err');
        setTimeout(function () {
            frogEl.classList.remove('splash');
            if (Game.lives <= 0) {
                endLevel(false);
            } else {
                restartRun();
            }
            Game.falling = false;
        }, 950);
    }

    function restartRun() {
        // 石头重新生成，青蛙回到左岸，失误计数保留
        var cfg = getLevel(Game.level);
        Game.colIndex = 0;
        placeStones();
        frogEl.style.left = frogLeft(-1, cfg) + '%';
        updateColProgress();
        inputArea.value = '';
        updateStoneCharStatus('');
        renderLives();
        if (Game.phase === 'running') {
            inputArea.disabled = false;
            setTimeout(focusInput, 300);
        }
        setFeedback('重新出发，还剩 ' + Game.lives + ' 条命！', 'info');
    }

    // ================= 事件绑定 =================
    // 首次用户手势解锁音频（浏览器自动播放策略要求，在用户手势内创建/恢复 AudioContext）
    function unlockAudioOnce() { AudioSfx.unlock(); }
    document.addEventListener('pointerdown', unlockAudioOnce, { once: true });
    document.addEventListener('keydown', unlockAudioOnce, { once: true });
    document.addEventListener('click', unlockAudioOnce, { once: true });

    restartBtn.addEventListener('click', restartLevel);
    backBtn.addEventListener('click', function () { AudioSfx.play('click'); exitToMap(); });
    pauseBtn.addEventListener('click', pauseToggle);
    soundBtn.addEventListener('click', function () {
        var on = AudioSfx.toggle();
        soundBtn.innerHTML = on ? SOUND_ON_SVG : SOUND_OFF_SVG;
        AudioSfx.init();
        AudioSfx.play('click');
    });
    nextBtn.addEventListener('click', function () {
        AudioSfx.play('click');
        if (Game.level < LEVELS.length) enterLevel(Game.level + 1);
        else exitToMap();
    });
    retryBtn.addEventListener('click', function () { AudioSfx.play('click'); restartLevel(); });
    mapBtn.addEventListener('click', function () { AudioSfx.play('click'); exitToMap(); });

    inputArea.addEventListener('input', onInput);
    inputArea.addEventListener('compositionstart', function () { Game.isComposing = true; });
    inputArea.addEventListener('compositionend', function () {
        Game.isComposing = false;
        onInput();
    });
    inputArea.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            var st = Game.stones[Game.colIndex];
            if (st && inputArea.value.toLowerCase() === st.word) onWordComplete();
        }
    });

    // 切标签页自动暂停，防时间偷跑
    document.addEventListener('visibilitychange', function () {
        if (document.hidden && Game.phase === 'running') goPause(true);
    });

    // 点击河面聚焦输入框
    riverEl.addEventListener('click', function (e) {
        if (Game.phase === 'running' || Game.phase === 'idle') {
            try { inputArea.focus(); } catch (err) {}
        }
    });

    // ================= 初始化 =================
    function init() {
        AudioSfx.loadPref();
        soundBtn.innerHTML = AudioSfx.enabled ? SOUND_ON_SVG : SOUND_OFF_SVG;
        mapUserName.textContent = USER_ID;
        buildLevelCards();
        addMapLotus();
        updateMap();
        screenGame.classList.add('hidden');
        screenMap.classList.remove('hidden');
        resultScreen.classList.add('hidden');
        if (!ProgressStore.enabled) {
            setTimeout(function () {
                showToast('⚠️ 浏览器不允许保存进度，本次游玩记录不会被保存');
            }, 600);
        }
    }

    init();
})();
</script>
</div>
