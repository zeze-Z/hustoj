    <script>
        // 关卡配置（5关）
        const levels = [
            {
                id: 1,
                name: "直线前进",

            },

                description: "走到拐角处，再转向前进！",

                end: { x: 2, y: 2 },
                walls: [{x:0,y:1}, {x:1,y:1}],
                randomWalls: 0
            },
            {
                id: 3,
                name: "Z字形",
                description: "绕过障碍，走出S形路线！",
                grid: [
                    ['S', '.', '.', '.', '.'],
                    ['#', '#', '#', '#', '.'],
                    ['.', '.', '.', '.', '.'],
                    ['.', '#', '#', '#', '#'],
                    ['.', '.', '.', '.', 'E']
                ],
                start: { x: 0, y: 0, direction: 'right' },
                end: { x: 4, y: 4 },
                walls: [
                    {x:0,y:1}, {x:1,y:1}, {x:2,y:1}, {x:3,y:1},
                    {x:1,y:3}, {x:2,y:3}, {x:3,y:3}, {x:4,y:3}
                ],
                randomWalls: 0
            },
            {
                id: 4,
                name: "正方形环线",
                description: "绕中间的方块走一圈回到起点，循环块能帮你省力！",
                grid: [
                    ['S', '.', '.', '.'],
                    ['.', '#', '#', '.'],
                    ['.', '#', '#', '.'],
                    ['.', '.', '.', '.']
                ],
                start: { x: 0, y: 0, direction: 'right' },
                end: { x: 0, y: 0 },
                walls: [{x:1,y:1},{x:2,y:1},{x:1,y:2},{x:2,y:2}],
                randomWalls: 0
            },
            {
                id: 5,
                name: "超大正方形",
                description: "6×6大网格！绕更大的圈回到起点！",
                grid: [
                    ['S', '.', '.', '.', '.', '.'],
                    ['.', '#', '#', '#', '.', '.'],
                    ['.', '#', '#', '#', '.', '.'],
                    ['.', '#', '#', '#', '.', '.'],
                    ['.', '.', '.', '.', '.', '.'],
                    ['.', '.', '.', '.', '.', '.']
                ],
                start: { x: 0, y: 0, direction: 'right' },
                end: { x: 0, y: 0 },
                walls: [{x:1,y:1},{x:2,y:1},{x:3,y:1},{x:1,y:2},{x:2,y:2},{x:3,y:2},{x:1,y:3},{x:2,y:3},{x:3,y:3}],
                randomWalls: 0
            }
        ];

        // 游戏状态
        let currentLevel = 0;
        // 所有关卡均开放，无需解锁机制
        let cat = { x: 0, y: 0, direction: 'right' };
        let codeBlocks = [];
        let isRunning = false;
        let currentWalls = [];

        // DOM元素
        const levelBannerEl = document.getElementById('level-banner');
        const levelSelectorEl = document.getElementById('level-selector');
        const levelBtns = document.querySelectorAll('.level-btn');

        // 已通关关卡管理 (localStorage)
        function getCompletedLevels() {
            const stored = localStorage.getItem('coding_game_completed');
            return stored ? JSON.parse(stored) : [];
        }

        function setLevelCompleted(levelIndex) {
            const completed = getCompletedLevels();
            if (!completed.includes(levelIndex)) {
                completed.push(levelIndex);
                localStorage.setItem('coding_game_completed', JSON.stringify(completed));
            }
        }
        const gridEl = document.getElementById('grid');
        const codeAreaEl = document.getElementById('code-area');
        const runBtn = document.getElementById('run-btn');
        const resetBtn = document.getElementById('reset-btn');
        const clearBtn = document.getElementById('clear-btn');
        const feedbackEl = document.getElementById('feedback');

        // 方向映射
        const directions = ['up', 'right', 'down', 'left'];
        const directionEmojis = {
            'up': '⬆️',
            'right': '➡️',
            'down': '⬇️',
            'left': '⬅️'
        };

        // 初始化游戏
        function initGame(levelId = 0) {
            currentLevel = levelId;
            const level = levels[currentLevel];
            
            // 更新UI
            updateLevelSelector();
            levelBannerEl.innerHTML = `🎯 第${level.id}关：${level.name} → ${level.description}`;
            
            // 生成障碍物（含随机）
            generateWalls();
            
            // 初始化小猫位置
            cat = { ...level.start };
            
            // 渲染网格
            renderGrid();
            
            // 清空编程区
            codeBlocks = [];
            renderCode();
            
            // 重置状态
            isRunning = false;
            feedbackEl.textContent = '';
            feedbackEl.className = 'feedback';
            runBtn.disabled = false;
        }

        // 更新关卡选择器
        function updateLevelSelector() {
            const completed = getCompletedLevels();
            levelBtns.forEach((btn, idx) => {
                btn.classList.toggle('active', idx === currentLevel);
                btn.classList.toggle('completed', completed.includes(idx));
            });
        }

        // 生成障碍物
        function generateWalls() {
            const level = levels[currentLevel];
            currentWalls = [...level.walls];
            // 所有5关都没有随机障碍，直接使用固定墙壁
        }

        // 渲染网格
        function renderGrid() {
            const level = levels[currentLevel];
            gridEl.innerHTML = '';
            gridEl.style.gridTemplateColumns = `repeat(${level.grid[0].length}, 1fr)`;

            for (let y = 0; y < level.grid.length; y++) {
                for (let x = 0; x < level.grid[y].length; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    
                    // 设置单元格类型
                    const isWall = currentWalls.some(wall => wall.x === x && wall.y === y);
                    if (isWall) {
                        cell.classList.add('wall');
                    } else if (level.grid[y][x] === 'S') {
                        cell.classList.add('start');
                    } else if (level.grid[y][x] === 'E') {
                        cell.classList.add('end');
                    }

                    // 显示小猫或终点
                    if (x === cat.x && y === cat.y) {
                        cell.textContent = '🐱' + directionEmojis[cat.direction];
                    } else if (x === level.end.x && y === level.end.y) {
                        cell.textContent = '🏁';
                    }

                    gridEl.appendChild(cell);
                }
            }
        }

        // 渲染代码块
        function renderCode() {
            codeAreaEl.innerHTML = '';
            renderBlocks(codeBlocks, codeAreaEl);
        }

        // 递归渲染代码块
        function renderBlocks(blocks, containerEl, parentType = null, parentId = null) {
            blocks.forEach((block, index) => {
                // 防御性检查：确保 block 存在且有效
                if (!block || typeof block !== 'object' || !block.type) {
                    console.warn('Invalid block detected at index', index, block);
                    return;
                }
                if (block.type === 'loop') {
                    // 渲染容器块
                    const containerDiv = document.createElement('div');
                    containerDiv.className = `code-container code-container-${block.type}`;
                    containerDiv.dataset.type = block.type;
                    containerDiv.dataset.index = index;
                    if (parentId !== null) {
                        containerDiv.dataset.parentId = parentId;
                    }
                    
                    // 容器头部
                    const headerDiv = document.createElement('div');
                    headerDiv.className = `container-header container-header-${block.type}`;
                    
                    let headerText = '';
                    if (block.type === 'loop') {
                        headerText = `🔄 重复`;
                        headerDiv.innerHTML = `
                            <span>${headerText}</span>
                            <select class="loop-count-selector" onchange="updateLoopCount(this, ${index}, ${parentId})">
                                <option value="2" ${block.count === 2 ? 'selected' : ''}>2</option>
                                <option value="3" ${block.count === 3 ? 'selected' : ''}>3</option>
                                <option value="4" ${block.count === 4 ? 'selected' : ''}>4</option>
                                <option value="5" ${block.count === 5 ? 'selected' : ''}>5</option>
                            </select>
                            <span>次</span>
                            <button class="delete-btn" onclick="deleteBlock(${index}, ${parentId})">×</button>
                        `;
                    }
                    
                    containerDiv.appendChild(headerDiv);
                    
                    // 容器内容区域
                    const contentLabel = document.createElement('div');
                    contentLabel.className = 'container-label';
                    contentLabel.textContent = '👇 重复内容';
                    containerDiv.appendChild(contentLabel);
                    
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'container-content';
                    contentDiv.dataset.parentType = block.type;
                    contentDiv.dataset.parentIndex = index;
                    if (parentId !== null) {
                        contentDiv.dataset.grandparentId = parentId;
                    }
                    contentDiv.ondrop = (e) => dropToContainer(e, block.type, index, parentId);
                    contentDiv.ondragover = allowDrop;
                    contentDiv.ondragenter = (e) => e.target.classList.add('drag-over');
                    contentDiv.ondragleave = (e) => e.target.classList.remove('drag-over');
                    
                    // 递归渲染容器内的积木
                    renderBlocks(block.children, contentDiv, block.type, index);
                    
                    containerDiv.appendChild(contentDiv);
                    containerEl.appendChild(containerDiv);
                    
                } else {
                    // 渲染基础积木
                    const blockEl = document.createElement('div');
                    blockEl.className = `code-block block-${block.type}`;
                    blockEl.draggable = true;
                    blockEl.dataset.type = block.type;
                    blockEl.dataset.index = index;
                    if (parentId !== null) {
                        blockEl.dataset.parentId = parentId;
                    }
                    
                    let text = '';
                    switch(block.type) {
                        case 'move': text = '⬆️ 前进'; break;
                        case 'left': text = '⬅️ 左转'; break;
                        case 'right': text = '➡️ 右转'; break;
                    }
                    
                    blockEl.innerHTML = `
                        <span>${text}</span>
                        <button class="delete-btn" onclick="deleteBlock(${index}, ${parentId})">×</button>
                    `;
                    
                    // 拖拽事件
                    blockEl.addEventListener('dragstart', (e) => dragStartCode(e, index, parentId));
                    
                    containerEl.appendChild(blockEl);
                }
            });
        }

        // 更新循环次数
        function updateLoopCount(selectEl, index, parentId) {
            const count = parseInt(selectEl.value);
            const block = getBlockByIndex(index, parentId);
            if (block && block.type === 'loop') {
                block.count = count;
            }
        }

        // 根据索引获取代码块
        function getBlockByIndex(index, parentId) {
            if (parentId === null || parentId === undefined) {
                return codeBlocks[index];
            } else {
                return codeBlocks[parentId].children[index];
            }
        }

        // 删除代码块
        function deleteBlock(index, parentId) {
            if (isRunning) return;
            
            if (parentId === null || parentId === undefined) {
                codeBlocks.splice(index, 1);
            } else {
                codeBlocks[parentId].children.splice(index, 1);
            }
            
            renderCode();
        }

        // 拖拽功能 - 积木区到编程区
        document.querySelectorAll('.block').forEach(block => {
            block.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('blockType', e.target.dataset.type);
                e.dataTransfer.setData('source', 'palette');
            });
        });

        // 拖拽功能 - 编程区内的块
        let draggedData = null;

        function dragStartCode(e, index, parentId) {
            draggedData = {
                source: 'codearea',
                index: index,
                parentId: parentId
            };
            e.dataTransfer.setData('source', 'codearea');
            e.dataTransfer.effectAllowed = 'move';
        }

        function allowDrop(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        // 计算拖放插入位置
        function getDropIndex(e, containerEl) {
            const children = Array.from(containerEl.children);
            if (children.length === 0) return 0;
            
            const mouseY = e.clientY;
            let dropIndex = children.length; // 默认追加到末尾
            
            for (let i = 0; i < children.length; i++) {
                const child = children[i];
                const rect = child.getBoundingClientRect();
                const midY = rect.top + rect.height / 2;
                
                if (mouseY < midY) {
                    dropIndex = i;
                    break;
                }
            }
            
            return dropIndex;
        }

        // 拖放到代码区根目录
        function dropToCodeArea(e) {
            e.preventDefault();
            e.stopPropagation();
            if (isRunning) return;
            
            // 移除所有 drag-over 状态
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            
            const source = e.dataTransfer.getData('source');
            const insertIndex = getDropIndex(e, codeAreaEl);
            
            if (source === 'palette') {
                // 从积木区拖来的新块
                const blockType = e.dataTransfer.getData('blockType');
                if (blockType) {
                    addNewBlock(blockType, codeBlocks, insertIndex);
                }
            } else if (source === 'codearea' && draggedData) {
                // 在编程区内移动
                // 如果拖动到同一位置，需要调整索引
                let adjustedIndex = insertIndex;
                if (draggedData.parentId === null && draggedData.index < insertIndex) {
                    adjustedIndex = insertIndex - 1;
                }
                moveBlock(draggedData.index, draggedData.parentId, codeBlocks, null, adjustedIndex);
                draggedData = null;
            }
            
            renderCode();
        }

        // 拖放到容器内
        function dropToContainer(e, containerType, containerIndex, grandparentId) {
            e.preventDefault();
            e.stopPropagation();
            if (isRunning) return;
            
            // 移除所有 drag-over 状态
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            
            const source = e.dataTransfer.getData('source');
            
            // 获取目标容器的children数组
            let targetContainer;
            let containerEl = e.currentTarget; // 容器内容区元素
            if (grandparentId === null || grandparentId === undefined) {
                // 确保目标容器存在
                if (!codeBlocks[containerIndex] || !codeBlocks[containerIndex].children) {
                    console.error('Target container not found', containerIndex);
                    return;
                }
                targetContainer = codeBlocks[containerIndex].children;
            } else {
                // 确保嵌套容器存在
                if (!codeBlocks[grandparentId] || 
                    !codeBlocks[grandparentId].children ||
                    !codeBlocks[grandparentId].children[containerIndex] ||
                    !codeBlocks[grandparentId].children[containerIndex].children) {
                    console.error('Nested target container not found', grandparentId, containerIndex);
                    return;
                }
                targetContainer = codeBlocks[grandparentId].children[containerIndex].children;
            }
            
            const insertIndex = getDropIndex(e, containerEl);
            
            if (source === 'palette') {
                // 从积木区拖来的新块
                const blockType = e.dataTransfer.getData('blockType');
                if (blockType) {
                    addNewBlock(blockType, targetContainer, insertIndex);
                }
            } else if (source === 'codearea' && draggedData) {
                // 在编程区内移动
                moveBlock(draggedData.index, draggedData.parentId, targetContainer, containerIndex, insertIndex);
                draggedData = null;
            }
            
            renderCode();
        }

        // 添加新块
        function addNewBlock(type, targetContainer, insertIndex = -1) {
            if (!type || !targetContainer) {
                console.error('addNewBlock: invalid arguments', type, targetContainer);
                return;
            }
            const newBlock = { type: type };
            if (type === 'loop') {
                newBlock.count = 2;
                newBlock.children = [];
            }
            
            if (insertIndex >= 0 && insertIndex < targetContainer.length) {
                targetContainer.splice(insertIndex, 0, newBlock);
            } else {
                targetContainer.push(newBlock);
            }
        }

        // 移动块
        function moveBlock(sourceIndex, sourceParentId, targetContainer, targetParentId, insertIndex = -1) {
            // 从原位置获取块
            let sourceBlock;
            if (sourceParentId === null || sourceParentId === undefined) {
                // 确保 sourceIndex 有效
                if (sourceIndex < 0 || sourceIndex >= codeBlocks.length) {
                    console.error('moveBlock: invalid sourceIndex', sourceIndex);
                    return;
                }
                sourceBlock = codeBlocks.splice(sourceIndex, 1)[0];
            } else {
                // 确保源容器存在
                if (!codeBlocks[sourceParentId] || !codeBlocks[sourceParentId].children) {
                    console.error('moveBlock: source container not found', sourceParentId);
                    return;
                }
                const sourceContainer = codeBlocks[sourceParentId].children;
                if (sourceIndex < 0 || sourceIndex >= sourceContainer.length) {
                    console.error('moveBlock: invalid sourceIndex in nested container', sourceIndex);
                    return;
                }
                sourceBlock = sourceContainer.splice(sourceIndex, 1)[0];
            }
            
            // 确保源块有效
            if (!sourceBlock) {
                console.error('moveBlock: sourceBlock is undefined');
                return;
            }
            
            // 添加到目标位置
            if (insertIndex >= 0 && insertIndex < targetContainer.length) {
                targetContainer.splice(insertIndex, 0, sourceBlock);
            } else {
                targetContainer.push(sourceBlock);
            }
        }

        // 清空所有代码块
        clearBtn.addEventListener('click', () => {
            if (isRunning) return;
            if (confirm('确定要清空所有积木吗？')) {
                codeBlocks = [];
                renderCode();
            }
        });

        // 移动小猫
        function moveCat() {
            const level = levels[currentLevel];
            let newX = cat.x;
            let newY = cat.y;

            switch(cat.direction) {
                case 'up': newY--; break;
                case 'right': newX++; break;
                case 'down': newY++; break;
                case 'left': newX--; break;
            }

            // 检查边界
            if (newX < 0 || newX >= level.grid[0].length || newY < 0 || newY >= level.grid.length) {
                return false;
            }

            // 检查墙
            const isWall = currentWalls.some(wall => wall.x === newX && wall.y === newY);
            if (isWall) {
                return false;
            }

            // 更新位置
            cat.x = newX;
            cat.y = newY;
            return true;
        }

        // 左转
        function turnLeft() {
            const dirIndex = directions.indexOf(cat.direction);
            cat.direction = directions[(dirIndex - 1 + 4) % 4];
        }

        // 右转
        function turnRight() {
            const dirIndex = directions.indexOf(cat.direction);
            cat.direction = directions[(dirIndex + 1) % 4];
        }



        // 检查是否到达终点
        function checkWin() {
            const level = levels[currentLevel];
            return cat.x === level.end.x && cat.y === level.end.y;
        }

        // 递归执行代码块
        async function executeBlocks(blocks) {
            for (let block of blocks) {
                switch(block.type) {
                    case 'move':
                        const success = moveCat();
                        renderGrid();
                        if (!success) {
                            throw new Error('撞墙了！');
                        }
                        await new Promise(resolve => setTimeout(resolve, 500));
                        break;
                        
                    case 'left':
                        turnLeft();
                        renderGrid();
                        await new Promise(resolve => setTimeout(resolve, 300));
                        break;
                        
                    case 'right':
                        turnRight();
                        renderGrid();
                        await new Promise(resolve => setTimeout(resolve, 300));
                        break;
                        
                    case 'loop':
                        // 重复执行内部的所有积木count次
                        for (let i = 0; i < block.count; i++) {
                            await executeBlocks(block.children);
                            
                            // 每次重复后检查是否到达终点
                            if (checkWin()) {
                                return true;
                            }
                        }
                        break;
                        

                }

                // 检查是否到达终点
                if (checkWin()) {
                    return true;
                }
            }
            
            return checkWin();
        }

        // 执行程序
        async function runProgram() {
            if (isRunning || codeBlocks.length === 0) return;
            
            isRunning = true;
            runBtn.disabled = true;
            feedbackEl.textContent = '🚀 程序运行中...';
            feedbackEl.className = 'feedback';
            
            // 重置小猫位置
            cat = { ...levels[currentLevel].start };
            renderGrid();
            
            await new Promise(resolve => setTimeout(resolve, 500));

            try {
                const win = await executeBlocks(codeBlocks);
                
                if (win) {
                    setLevelCompleted(currentLevel);
                    updateLevelSelector();
                    feedbackEl.textContent = `🎉 恭喜你！第${currentLevel + 1}关通关！`;
                    feedbackEl.className = 'feedback success celebration';
                } else {
                    feedbackEl.textContent = '❌ 还没到达终点哦，请调整程序再试。';
                    feedbackEl.className = 'feedback error';
                }
            } catch (error) {
                feedbackEl.textContent = `💥 ${error.message} 请调整程序再试。`;
                feedbackEl.className = 'feedback error';
            } finally {
                isRunning = false;
                runBtn.disabled = false;
            }
        }

        // 事件监听
        runBtn.addEventListener('click', runProgram);
        resetBtn.addEventListener('click', () => initGame(currentLevel));
        
        levelBtns.forEach((btn, idx) => {
            btn.addEventListener('click', () => {
                if (isRunning) return;
                if (codeBlocks.length > 0 && !confirm('切换关卡将清空当前程序，确定吗？')) {
                    return;
                }
                initGame(idx);
            });
        });

        // 初始化第一关
        initGame(0);


    </script>
</div>
